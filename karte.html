<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
</head>
<body>
<title>Schultheorie-Karte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f6f4ee; --card: #fffdf8; --ink: #1f1b2e; --muted: #6b6478; --line: #d9d3c7; --soft: #ece8df;
  --st1: #b4552d; --st2: #6f4a8e; --st3: #4e7a4a; --sq: #2f7c86; --sr: #2c4a7c; --um: #a8790f;
  --warn: #8a5411; --warn-bg: #fbeedb; --idee: #4f5f9e; --idee-bg: #e9ecf8; --ok: #3f7a4b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #17141f; --card: #221e30; --ink: #ece8f4; --muted: #a9a2b8; --line: #3b3650; --soft: #2c2740;
    --st1: #e08a5c; --st2: #b28fd1; --st3: #86b67f; --sq: #6fc0c9; --sr: #7fa9d9; --um: #e2b64a;
    --warn: #f2b871; --warn-bg: #3a2c16; --idee: #a9b6ee; --idee-bg: #232a45; --ok: #8fcf9a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #17141f; --card: #221e30; --ink: #ece8f4; --muted: #a9a2b8; --line: #3b3650; --soft: #2c2740;
  --st1: #e08a5c; --st2: #b28fd1; --st3: #86b67f; --sq: #6fc0c9; --sr: #7fa9d9; --um: #e2b64a;
  --warn: #f2b871; --warn-bg: #3a2c16; --idee: #a9b6ee; --idee-bg: #232a45; --ok: #8fcf9a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: Karla, "Helvetica Neue", Arial, sans-serif; font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
h1, h2, h3 { font-family: Fraunces, Georgia, serif; font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); font-weight: 900; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.2rem; }
h4 { margin: 0; font-family: Karla, sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .78rem; color: var(--muted); }
p { margin: 0; }
a { color: inherit; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 16px 80px; }
.inhalt { max-width: 860px; margin: 0 auto; }
#karte-bereich { margin: 14px 0 6px; }
.map-kopf { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; min-height: 22px; }
.map-kopf .schalter { margin: 0; }
.map-werkzeuge { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rund.klein.reset { background: var(--soft); color: var(--ink); }
.zoom { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); }
.zoom button { font: inherit; font-size: .82rem; font-weight: 700; color: var(--ink); background: transparent; border: none; padding: 4px 10px; cursor: pointer; min-width: 34px; }
.zoom button + button { border-left: 1.5px solid var(--line); }
.zoom button:hover { background: var(--soft); }
.leiste { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 12px; margin: 0; padding: 6px 16px; background: var(--ink); color: var(--paper); min-height: 52px; }
.marke { text-decoration: none; color: var(--paper); font-family: Fraunces, serif; font-weight: 700; font-size: 1rem; white-space: nowrap; flex: 0 0 auto; }
.marke .kurz { display: none; }
@media (max-width: 900px) {
  .leiste { flex-wrap: wrap; row-gap: 6px; }
  .marke .voll { display: none; } .marke .kurz { display: inline; }
  .widget { flex-basis: 100%; order: 3; }
}
.modi { display: inline-flex; background: color-mix(in srgb, var(--paper) 14%, transparent); border-radius: 999px; padding: 3px; flex: 0 0 auto; }
.modi a { text-decoration: none; color: var(--paper); font-weight: 700; font-size: .85rem; padding: 6px 12px; border-radius: 999px; opacity: .75; transition: background .18s, opacity .18s; }
.modi a.aktiv { background: var(--paper); color: var(--ink); opacity: 1; }
.widget { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.widget.fertig { --w: var(--ok); }
.w-kn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--paper); color: var(--ink); font-weight: 900; cursor: pointer; flex: 0 0 auto; font: inherit; font-size: .95rem; }
.w-kn.klein { width: auto; padding: 0 8px; height: 28px; border-radius: 999px; font-size: .72rem; background: color-mix(in srgb, var(--paper) 18%, transparent); color: var(--paper); }
.w-titel { display: grid; min-width: 0; text-decoration: none; color: inherit; flex: 0 1 220px; }
.w-titel b { font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .w-titel small { opacity: .7; font-variant-numeric: tabular-nums; font-size: .72rem; }
.widget input[type="range"] { flex: 1 1 80px; min-width: 40px; accent-color: var(--paper); }
.widget select { font: inherit; font-size: .78rem; padding: 3px 4px; border-radius: 6px; border: none; background: color-mix(in srgb, var(--paper) 18%, transparent); color: var(--paper); }
.widget.fertig .w-kn:first-child { background: var(--ok); color: #fff; }
.w-kn.menu { margin-left: auto; font-size: 1rem; }
.kapitel-menu { position: sticky; top: 52px; z-index: 6; margin: 0; padding: 10px 16px 14px; background: var(--card); border-bottom: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.12); max-height: 60vh; overflow: auto; }
.kapitel-menu h4 { margin: 8px 0 4px; }
.aufgaben { margin-top: 18px; display: grid; gap: 8px; }
.aufgaben h4 { display: flex; justify-content: space-between; align-items: baseline; }
.aufgabe { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 0; }
.aufgabe-kopf { padding: 10px 12px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.aufgabe .stand { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--soft); color: var(--muted); font-size: .8rem; }
.aufgabe.fertig .stand { background: var(--ok); color: #fff; } .aufgabe.fertig .aufgabe-kopf { color: var(--muted); }
.aufgabe-inhalt { padding: 0 12px 12px; }
.bq-fertig { display: grid; gap: 8px; } .bq-kopf { display: flex; align-items: center; gap: 8px; } .bq-kopf .reset { margin-left: auto; width: 26px; height: 26px; font-size: .75rem; }
.bq-begriffe { display: grid; gap: 6px; } .bq-begriff { display: grid; gap: 1px; padding: 8px 12px; border-left: 3px solid var(--ok); background: color-mix(in srgb, var(--ok) 8%, var(--card)); border-radius: 4px; }
.bq-begriff b { font-family: Fraunces, serif; font-size: 1.2rem; color: var(--ink); } .bq-begriff small { color: var(--muted); font-size: .82rem; } .bq-fertig .stand { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--ok); color: #fff; font-size: .75rem; margin-right: 6px; }
.bq-fertig b { color: var(--ink); font-weight: 500; }
.aufgabe.fertig .aufgabe-inhalt .feier { margin-top: 6px; }
.aufgabe-inhalt .grafik { border: none; padding: 0; }
.naechstes { margin-top: 26px; display: grid; gap: 6px; justify-items: start; }
.btn-next { text-decoration: none; padding: 12px 18px; border-radius: 10px; font-weight: 700; background: var(--bc, var(--st1)); color: var(--paper); }
.btn-next.gesperrt { background: var(--soft); color: var(--muted); pointer-events: none; }
.btn-next.frei { box-shadow: 0 0 0 4px color-mix(in srgb, var(--bc, var(--st1)) 30%, transparent); }
.quiz-form label.breit { grid-column: 1 / -1; text-transform: none; letter-spacing: 0; font-size: .95rem; color: var(--ink); font-weight: 500; }
.w-quiz { background: var(--ok); color: #fff; padding: 6px 12px; border-radius: 999px; font-weight: 700; text-decoration: none; white-space: nowrap; font-size: .82rem; animation: puls 1.2s ease-in-out infinite; }
@media (max-width: 640px) { .widget .w-kn.klein, .widget select { display: none; } .modi a { padding: 6px 9px; font-size: .78rem; } }
#classic { width: 100%; height: calc(100vh - 52px); border: none; display: block; }
body:has(#classic:not([hidden])) .wrap { padding: 0; max-width: none; }
.grafik-kopf .rund.klein { background: var(--soft); color: var(--ink); } .grafik-kopf .rund.klein.an { background: var(--bc, var(--st1)); color: var(--paper); }
.grafik.geloest { border-color: var(--ok); } .grafik .haken.statisch, .mit-quiz .haken.statisch { position: static; display: inline-grid; width: 22px; height: 22px; font-size: .8rem; }
.grafik .haken { position: static; display: inline-grid; width: 22px; height: 22px; font-size: .8rem; }
.grafik .feier { background: color-mix(in srgb, var(--ok) 18%, var(--card)); color: var(--ink); border-radius: 6px; padding: 6px 10px; margin-bottom: 8px; font-weight: 700; }
.quiz-form input.falsch { border-color: #c8362a; background: var(--warn-bg); }
.quiz-form input.aufgedeckt { border-color: var(--idee); background: var(--idee-bg); color: var(--idee); font-weight: 700; }
.bq-hinweis button { font: inherit; font-size: .82rem; font-weight: 700; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.pfad .zurueck { flex: 0 0 auto; text-decoration: none; font-weight: 700; font-size: .85rem; color: var(--ink); padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); white-space: nowrap; }
.pfad .map-toggle { margin-left: auto; flex: 0 0 auto; font: inherit; font-size: .8rem; font-weight: 700; color: var(--muted); background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
#view, .map { transition: opacity .18s ease; }
#view.wechsel, .map.wechsel { opacity: 0; }
@media (prefers-reduced-motion: reduce) { #view, .map { transition: none; } }
@media (max-width: 640px) { .pfad .zurueck { font-size: 0; padding: 6px 9px; } .pfad .zurueck::before { content: "‹"; font-size: 1.1rem; } }
/* Kopfzeile mit Pfad: immer sichtbar, eine Ebene hoch per Knopf */
.pfad { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); margin: 0 -16px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; min-height: 48px; }
.pfad .hoch { flex: 0 0 auto; width: 40px; height: 36px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font-size: 1.2rem; display: grid; place-items: center; text-decoration: none; }
.pfad .hoch[hidden] { display: none; }
.pfad ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: .88rem; align-items: center; min-width: 0; }
.pfad li { display: flex; align-items: center; gap: 6px; }
.pfad li + li::before { content: "›"; color: var(--muted); }
.pfad a { text-decoration: none; color: var(--muted); font-weight: 500; }
.pfad li:last-child { font-weight: 700; color: var(--ink); }
.pfad a:focus-visible, .hoch:focus-visible, .kette a:focus-visible, .sprung a:focus-visible { outline: 2px solid var(--st1); outline-offset: 2px; }
header.kopf { padding: 30px 0 18px; display: grid; gap: 10px; }
.eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.lead { max-width: 62ch; color: var(--muted); }
.lead b { color: var(--ink); }
.stufe-kopf { display: grid; gap: 6px; margin: 24px 0 14px; grid-template-columns: minmax(0, 1fr); }
.stufe-kopf .nr { font-family: Fraunces, serif; font-weight: 900; font-size: .9rem; color: var(--bc, var(--st1)); letter-spacing: .04em; }
.map { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); background: var(--card); border-radius: 6px; }
.map svg { display: block; height: auto; }
.map.passt { overflow-x: hidden; }
.hint { font-size: .82rem; color: var(--muted); margin-top: 8px; }
.schalter { display: flex; gap: 14px; align-items: center; font-size: .85rem; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.schalter label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
figure { margin: 0; }
figcaption { font-size: .85rem; color: var(--muted); margin-top: 8px; max-width: 62ch; }
figcaption b { color: var(--ink); }
.grafiken { display: grid; gap: 22px; margin-top: 26px; grid-template-columns: minmax(0, 1fr); }
.grafik { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 14px; overflow-x: auto; min-width: 0; }
.grafik svg { width: 100%; min-width: 560px; height: auto; display: block; margin: 0 auto; }
@media (min-width: 640px) { .grafik svg { min-width: 0; max-width: 100%; } }
.grafik .f-tag { float: right; }
svg text { font-family: Karla, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
svg .gloss { fill: var(--muted); font-size: 10.5px; }
svg .chip-t { font-size: 10.5px; font-weight: 500; }
svg .chip { fill: var(--soft); stroke: none; }
svg .root { fill: var(--ink); }
svg .root-t { fill: var(--paper); font-family: Fraunces, serif; font-weight: 700; font-size: 14px; }
svg .bt { font-weight: 700; font-size: 12.5px; }
svg .kt { font-size: 12px; font-weight: 500; }
svg .edge { fill: none; stroke-width: 1.6; opacity: .75; }
svg .box { fill: color-mix(in srgb, var(--bc) 14%, var(--card)); stroke: var(--bc); stroke-width: 1.2; }
svg .stub .box { stroke-dasharray: 3 3; }
svg a { cursor: pointer; }
svg a:hover .box, svg a:focus .box { stroke-width: 2.2; fill: color-mix(in srgb, var(--bc) 26%, var(--card)); }
svg a:focus { outline: none; }
svg .hl .box { stroke-width: 2.4; fill: color-mix(in srgb, var(--bc) 30%, var(--card)); }
svg .sprung-t { fill: var(--bc); font-size: 10px; font-weight: 700; }
.f-tag { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .03em; padding: 1px 7px; border-radius: 4px; background: var(--soft); color: var(--muted); white-space: nowrap; vertical-align: middle; font-variant-numeric: tabular-nums; }
/* Karten */
.karten { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); }
.karte { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px; border-top: 4px solid var(--bc, var(--st1)); display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.karte > *, .block > *, .tabelle { min-width: 0; }
.karte > header { display: grid; gap: 4px; grid-template-columns: minmax(0, 1fr); }
.karte > header .wer { color: var(--bc, var(--st1)); font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.karte > header .kurz { color: var(--muted); max-width: 62ch; }
.karte > header .kurz b { color: var(--ink); }
.block { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.block .text { color: var(--muted); max-width: 62ch; } .block .text b { color: var(--ink); }
dl { margin: 0; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
dl > div { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding-left: 12px; border-left: 2px solid var(--soft); }
dt { font-weight: 700; } dt .f-tag { margin-left: 6px; }
dd { margin: 0; color: var(--muted); max-width: 62ch; } dd b { color: var(--ink); font-weight: 500; } dd q, .text q { font-style: italic; }
.kritiken { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 640px) { .kritiken { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .kritiken .idee { grid-column: 1 / -1; } }
.kritik { background: var(--soft); border-radius: 6px; padding: 12px 14px; display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); }
.kritik h4 { color: var(--ink); }
.kritik ul { margin: 0; padding-left: 18px; color: var(--muted); } .kritik li { margin: 2px 0; } .kritik li b { color: var(--ink); font-weight: 500; }
.kritik.leer { border: 1.5px dashed var(--line); background: transparent; }
.kritik.idee { background: var(--idee-bg); border: 1.5px dashed var(--idee); }
.kritik.idee h4 { color: var(--idee); }
.kritik.idee .tag { display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--idee); border: 1px solid var(--idee); border-radius: 4px; padding: 0 6px; margin-left: 6px; vertical-align: middle; }
.falle { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-bg); color: var(--ink); border-radius: 6px; padding: 10px 12px; font-size: .92rem; }
.falle .ico { font-weight: 900; color: var(--warn); font-family: Fraunces, serif; flex: 0 0 auto; }
.falle b { color: var(--warn); }
/* Karten-Quiz: Sprungleiste unter den Fallen, Ziel ist der Trainer (index.html#quiz/...) */
.quiz-leiste { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .88rem; color: var(--muted); }
.quiz-leiste .ico { font-weight: 900; color: var(--bc, var(--st1)); font-family: Fraunces, serif; }
.quiz-leiste a { text-decoration: none; font-weight: 700; font-size: .85rem; padding: 5px 12px; border-radius: 999px; border: 1.5px solid var(--bc, var(--st1)); color: var(--bc, var(--st1)); background: transparent; white-space: nowrap; }
.quiz-leiste a:hover, .quiz-leiste a:focus-visible { background: var(--bc, var(--st1)); color: var(--paper); }
.kette { display: flex; flex-wrap: wrap; gap: 6px; }
.kette a { text-decoration: none; color: var(--ink); background: var(--soft); padding: 5px 11px; border-radius: 999px; font-size: .85rem; font-weight: 500; }
.kette a.aktiv { background: var(--bc, var(--st1)); color: var(--paper); }
.tabelle { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
td:first-child { font-weight: 700; white-space: nowrap; } td b { font-weight: 700; }
.legende { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: .82rem; color: var(--muted); margin-top: 10px; }
.legende span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--bc); margin-right: 6px; vertical-align: -1px; }
/* Sprungleiste unten: eine Ebene hoch, naechste Karte */
.sprung { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.sprung a { text-decoration: none; padding: 9px 14px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; font-size: .9rem; }
.sprung a.primaer { background: var(--bc, var(--st1)); color: var(--paper); border-color: transparent; }
.themen-liste { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); margin-top: 18px; }
.themen-liste .kachel .titel small { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

.stand { font-size: .82rem; color: var(--muted); border-top: 1px solid var(--line); margin-top: 40px; padding-top: 14px; max-width: 62ch; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

/* ---- Hoeren ---- */
[hidden] { display: none !important; }
.play { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; font-weight: 700; font-size: .82rem; padding: 4px 10px; border-radius: 999px; background: var(--bc, var(--st1)); color: var(--paper); white-space: nowrap; }
.play.gross { font-size: .95rem; padding: 8px 16px; }
.play.quiz { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.chips-zeile { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.hoer-start { display: flex; justify-content: space-between; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--bc); border-radius: 6px; padding: 12px 14px; margin-top: 18px; }
.hoer-start b { font-family: Fraunces, serif; font-size: 1.05rem; display: block; } .hoer-start small { color: var(--muted); display: block; max-width: 52ch; }
.hoeren { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; margin-top: 14px; }
.hoeren .rechts { display: none; }
.hoeren[data-tab="karte"] .rechts { display: block; } .hoeren[data-tab="karte"] .transkript, .hoeren[data-tab="karte"] .kapitel { display: none; }
@media (min-width: 900px) {
  .hoeren { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: start; }
  .hoeren .rechts { display: block; position: sticky; top: 60px; max-height: calc(100vh - 70px); overflow: auto; }
  .hoeren[data-tab="karte"] .transkript, .hoeren[data-tab="karte"] .kapitel { display: block; }
  .hoeren .tabs { display: none; }

  ],
  karten: [
    { id: "wozu", wer: "Einstieg · F 3 bis 7 · Wiater 2007", titel: "Wozu Schultheorien?",
      kurz: "Schultheorien sind Brillen: Sie ordnen, was man über Schule weiß, und sagen, wo man hinschauen soll.",
      bloecke: [
        { h4: "Fragen schultheoretischer Forschung", ftag: "F 3", dl: [
          { dt: "Fünf Leitfragen", dd: "Was ist Schule? Welche Faktoren (Institution, Prozesse, Produkte) kennzeichnen sie? Wie ist sie geworden, was sie ist? Welche Funktionen und Aufgaben hat sie? Wie sollte sie reformiert werden?" } ] },
        { h4: "Wozu sie dienen", ftag: "F 4 · 5", dl: [
          { dt: "Ordnungszusammenhang", dd: "alle Sachverhalte rund um Schule bekommen einen Platz" },
          { dt: "Analyse von Schule", dd: "was macht eine gute Schule aus, welche Faktoren beeinflussen Schulqualität" },
          { dt: "Bedingungen des Handelns klären", dd: "welche Herausforderungen kennzeichnen Lehrkräftehandeln" },
          { dt: "Kritische Funktion", dd: "gegenüber Schulpraxis und Bildungspolitik: was kann Schule leisten, unter welchen Bedingungen" },
          { dt: "Berufsethos begründen", dd: "welche Funktionen hat Schule in der Gesellschaft" },
          { dt: "Grundlage der Schulforschung", dd: "quantitativ und qualitativ, z. B. wie soziale Ungleichheit im Bildungssystem entsteht" } ] },
        { h4: "Nutzen für die Praxis", ftag: "F 6 · 7", dl: [
          { dt: "Zusammenhänge verstehen", dd: "zwischen schulischer Bildung und gesellschaftlichen Strukturen" },
          { dt: "Eigene Rolle reflektieren", dd: "als Lehrkraft bei der Re-Produktion von Bildungsungerechtigkeit" } ] },
      ],
      kritikAn: null, kritikSelbst: null, kritikIdee: null, fallen: [] },

    { id: "parsons", wer: "Talcott Parsons · strukturfunktionalistische Theorie · F 9 bis 19", titel: "Parsons: Schule hält die Gesellschaft stabil",
      kurz: "Schule ist ein Subsystem der Gesellschaft, das zwei Aufgaben erfüllt: Werte weitergeben und Menschen nach Leistung auf Positionen verteilen. Einordnung: 1960er/70er Jahre, stark soziologisch (F 11).",
      bloecke: [
        { h4: "Schlüsselbegriffe", dl: [
          { dt: "Subsystem", ftag: "F 9 · 10 · 12", dd: "Gesellschaft = soziales System; jedes Subsystem (Politik, Wirtschaft, Schule) leistet seinen Beitrag. Schule tauscht mit dem <b>politischen System</b> (bekommt rechtliche Rahmenbedingungen, gibt Werte und Normen zurück) und mit dem <b>Wirtschaftssystem</b> (bekommt Geld, gibt Fertigkeiten und Vorauswahl nach Leistung zurück)." },
          { dt: "Reproduktion als Problem", ftag: "F 11", dd: "Wie erhält sich eine Gesellschaft über Generationen? Das ist das Problem, <b>zu dessen Lösung Schule beiträgt</b>." },
          { dt: "AGIL-Schema", ftag: "F 12", dd: "Vier Grundfunktionen, die jedes soziale System erfüllen muss: <b>A</b>daption (Anpassung), <b>G</b>oal attainment (Zielerreichung), <b>I</b>ntegration (Verteilung vorhandener Ressourcen und Aufgaben), <b>L</b>atent pattern maintenance (Normerhaltung). Das Erziehungssystem übernimmt vor allem das <b>L</b>: Normerhalten, Verinnerlichung gesellschaftlich adaptiver Werte (F 13)." },
          { dt: "Sozialisations-/Integrationsfunktion", ftag: "F 13 · 14", dd: "Lernende setzen sich mit Werten auseinander, die ihnen ein Bestehen in der Gesellschaft ermöglichen. Folienzitat: <q>die Bereitschaft und Fähigkeit zur Erfüllung der späteren Erwachsenenrolle zu verinnerlichen</q> (Parsons 1959). Damit erfüllt das Bildungssystem <b>gegenüber dem politischen System</b> die Stabilisierung von Werten und Normen." },
          { dt: "Selektionsfunktion", ftag: "F 13 · 14", dd: "Lernende werden gemäß ihrer Fähigkeiten auf verschiedene Positionen verteilt. Folienzitat: <q>menschliche Ressourcen innerhalb der Rollenstruktur der Erwachsenengesellschaft zu verteilen</q>. Damit erfüllt das Bildungssystem <b>gegenüber dem ökonomischen System</b> die Vorauswahl qualifizierter Personen." },
          { dt: "Im Schulgesetz Brandenburg", ftag: "F 15 bis 17", dd: "Sozialisation/Integration ↔ <b>§ 4 BbgSchulG</b> „Ziele und Grundsätze der Erziehung und Bildung\". Selektion ↔ <b>§ 53 BbgSchulG</b> „Aufnahme in eine weiterführende allgemein bildende Schule\"." } ] },
      ],
      kritikAn: { ftag: "F 18 · 19", punkte: [
        "<b>Trifft die Selektion (F 18):</b> keine klare empirische Evidenz, dass die Auswahl für Berufe und Studiengänge <b>rein leistungsabhängig</b> ist. PISA zeigt: die familiäre Herkunft (sozialer Status) spielt bei der Leistungsbeurteilung eine Rolle.",
        "<b>Trifft die Normen (F 19), Kritik von Fend 1980:</b> Parsons betont Normen und Werte als „naturgegeben\". Sie sind aber <b>ideengeschichtliche Entwicklungen</b>, die man bildungstheoretisch reflektieren kann und soll." ] },
      kritikSelbst: null,
      kritikIdee: { punkte: [
        "<b>Aus Fend ableitbar (F 23):</b> Bei Parsons handeln Strukturen, nicht Menschen. Was eine einzelne Lehrkraft oder ein Kind im System tut, kommt nicht vor. Genau das ergänzt Fend 2006 mit der handlungsorientierten Sicht.",
        "<b>Aus Bourdieu ableitbar (F 36, 38):</b> Parsons beschreibt Selektion als Leistung, Bourdieu zeigt, dass Schule Herkunft belohnt („trotz formaler Chancengleichheit\"). Die Selektionsfunktion reproduziert also Ungleichheit, statt nur zu sortieren." ] },
      fallen: [ "<b>Nicht verwechseln:</b> Parsons hat <b>zwei</b> Funktionen, Fend hat <b>vier</b>. Und die beiden Kritikpunkte gehören zu je einer Funktion: Folie 18 zur Selektion, Folie 19 zur Sozialisation. Eine Aussage wie „die Kritik trifft beide Funktionen\" ist falsch." ] },

    { id: "fend", wer: "Helmut Fend · Theorie der Schule · F 21 bis 30", titel: "Fend: vier Funktionen, und das Individuum handelt",
      kurz: "Fend baut auf Parsons auf, macht daraus eine Mehrebenenanalyse und holt die handelnden Menschen zurück ins Bild: „Nicht die Institution, sondern das Individuum ist handelnd im System\" (F 23).",
      bloecke: [
        { h4: "Einordnung", dl: [
          { dt: "Zwei Bücher", ftag: "F 21 · 22", dd: "<b>1980 „Theorie der Schule\"</b>, <b>2006 weiterentwickelt zu „Neue Theorie der Schule\"</b>. Bezieht sich auf den Strukturfunktionalismus, entwickelt ihn zur <b>Mehrebenenanalyse</b> der Schule und ihrer Akteure weiter. Zwei Leitfragen 1980: Will man, dass die Schule bestimmte Funktionen für die Gesellschaft übernimmt? Ist das Bildungssystem tatsächlich ausreichend funktional?" },
          { dt: "Was 1980 neu dazukam", ftag: "F 23", dd: "<b>Legitimationsfunktion</b> (Schule reproduziert privilegierte gesellschaftliche Positionen) und <b>Enkulturationsfunktion</b> (Schule reproduziert kulturelle Sinnsysteme: Sprache, Werte)." },
          { dt: "Was 2006 neu dazukam", ftag: "F 23", dd: "Kritik an den strukturfunktionalen Ansätzen: die <b>Akteure treten hinter die Strukturen</b>. Ergänzung um die <b>handlungsorientierte Sichtweise</b>." } ] },
        { h4: "Die vier Funktionen der Schule", ftag: "F 24 bis 28", dl: [
          { dt: "1 · Qualifikationsfunktion", ftag: "F 24", dd: "Kenntnisse für den Beruf und berufsorientierte Einstellungen: <b>Fleiß, Lernbereitschaft, Mobilität</b>. Dazu das <b>humane Recht auf Bildung</b>: Fertigkeiten, die zur Teilnahme am gesellschaftlichen Leben befähigen." },
          { dt: "2 · Selektions- und Allokationsfunktion", ftag: "F 26", dd: "Schule entscheidet (idealerweise unabhängig von der Herkunft) über die künftige soziale Stellung. Im Mittelalter zählte die <b>Geburt in einen Stand</b>, in der Moderne ist die <b>schulische Leistung</b> das Verteilungsprinzip. Allokation = Zuweisung auf Positionen." },
          { dt: "3 · Integrations- und Legitimationsfunktion", ftag: "F 27", dd: "Durch Verinnerlichen von Werten und Normen werden Gesellschaftsverhältnisse als richtig anerkannt (legitimiert). Folienzitat: <q>durch hundertfaches Erbringen von Prüfungen und Leistungen</q> eignet man sich die Normen der Leistungsgesellschaft an; die Leistungsorientierung legitimiert <q>die ungleiche Verteilung knapper Güter</q>. Ergebnis: Zustimmung zum politischen Regelsystem, Stabilisierung der Gesellschaft." },
          { dt: "4 · Enkulturationsfunktion", ftag: "F 28", dd: "Enkulturation = Weitergabe der Kultur (Wertorientierungen, Symbolsysteme). Gesellschaften haben <q>eine gemeinsame Geschichte</q> mit Sinnformen, die weitertradiert werden müssen." } ] },
        { h4: "Würdigung", ftag: "F 30", text: "Fends Sicht ist handlungsorientierend (individuumzentriert <b>und</b> gesellschaftsorientiert); die große Stärke ist, Wirkungsanalysen zu bieten und zugleich praktisch relevant zu sein." },
      ],
      kritikAn: null,
      kritikSelbst: { ftag: "F 23 · 24 · 26", punkte: [
        "<b>Am Strukturfunktionalismus (F 23):</b> die Akteure verschwinden hinter den Strukturen.",
        "<b>An der Qualifikation (F 24):</b> Schule kann <b>nicht passgenau qualifizieren</b>, die gesellschaftlich-ökonomischen Anforderungen sind zu schnelllebig.",
        "<b>An der Selektion (F 26):</b> Intelligenz und soziale Herkunft sind maßgeblich für Selektionsprozesse, das verstärkt ungleiche Anlage- und Umwelteinflüsse (<b>Chancenungleichheit</b>). Fend setzt dem den <b>Selbstwert des intellektuellen Strebens</b> einzelner Individuen entgegen." ] },
      kritikIdee: { punkte: [
        "<b>Aus Folie 43 bis 46 ableitbar:</b> Fends Selektionsfunktion nennt Schule eine Instanz, die „unabhängig von sozialer Herkunft\" entscheidet. Die Empirie derselben Sitzung (Ditton 2005, Dumont 2014) zeigt das Gegenteil: bei gleicher Leistung entscheiden Herkunft und Beurteilungsverzerrungen mit.",
        "<b>Aus Bourdieu ableitbar (F 38):</b> Vier Funktionen beschreiben, was Schule <b>soll</b>. Bourdieus Kapitalbegriff erklärt, warum sie es für Kinder mit wenig kulturellem Kapital nicht einlöst, „trotz formaler Chancengleichheit\"." ] },
      fallen: [ "<b>Namensfalle:</b> Bei Parsons heißt es „Sozialisations-/<b>Integrations</b>funktion\", bei Fend „<b>Integrations</b>- und Legitimationsfunktion\". Gleiches Wort, andere Theorie. Fends Selektionsfunktion trägt immer den Zusatz „und Allokation\"." ] },

    { id: "bourdieu", wer: "Pierre Bourdieu (1930 bis 2002) · sozialisationstheoretischer Ansatz · F 34 bis 42", titel: "Bourdieu: Schule reproduziert soziale Ungleichheit",
      kurz: "Französischer Soziologe und Sozialphilosoph. These: Das Bildungswesen trägt zur Reproduktion sozialer Ungleichheit bei, weil Kapital ungleich verteilt ist. Ziel: die verborgenen Mechanismen sichtbar machen und Wege zeigen, den Kreislauf zu durchbrechen (F 36).",
      bloecke: [

        <text x="560" y="40" class="gloss">Wissen ist verknüpft</text><text x="560" y="54" class="gloss">mit Machtstrategien (F 3)</text>
        <path d="M290,90 L290,110" fill="none" stroke="var(--st2)" stroke-width="1.4" marker-end="url(#st2-pf)"/>
        <g style="--bc:var(--st2)">

          <text x="550" y="168" text-anchor="middle" class="gloss">verändertes Verhältnis zu sich und zur Gesellschaft (F 8)</text>
        </g>
        <text x="20" y="206" class="bt" font-size="12">Machtgefälle in der Schule (F 11)</text>
        <g style="--bc:var(--sr)">
          <rect class="box" x="20" y="214" width="220" height="48" rx="6"/>
          <text x="130" y="233" text-anchor="middle" class="kt">Ungleichheit von Rechten</text>
          <text x="130" y="249" text-anchor="middle" class="gloss">Volljährige vs. Minderjährige</text>
          <rect class="box" x="260" y="214" width="220" height="48" rx="6"/>
          <text x="370" y="233" text-anchor="middle" class="kt">… in den Kompetenzen</text>
          <text x="370" y="249" text-anchor="middle" class="gloss">Expert:innen vs. Schüler:innen</text>
          <rect class="box" x="500" y="214" width="220" height="48" rx="6"/>
          <text x="610" y="233" text-anchor="middle" class="kt">… von Sanktionierungsgewalt</text>

        </g>
        <path d="M370,264 L370,284" fill="none" stroke="var(--st2)" stroke-width="1.4" marker-end="url(#st2-pf)"/>
        <g style="--bc:var(--ok)">

          <text x="370" y="321" text-anchor="middle" class="gloss">damit Schule demokratische Werte vertreten kann</text>
        </g>
      </svg>`,
      caption: "<b>Zusammengezogen aus drei Textfolien.</b> Oben der Kreislauf aus F 3, in der Mitte die zwei Kästen von F 8, unten die drei Ungleichheiten von F 11. Klausurfalle: Foucault sagt <b>nicht</b>, Schule erziehe zur Freiheit. Er sagt, sie diszipliniert. Wer das umdreht, kreuzt falsch." },
    { titel: "von Hentig: fünf Merkmale rund um die polis", ftag: "F 20 · 22",
      svg: `<svg viewBox="0 0 740 330" role="img" aria-label="Von Hentigs Schulkonzeption: in der Mitte die Schule als polis und Lebens- und Erfahrungsraum, darum die fünf Merkmale Lebensraum, individualisierter Unterricht, Polis mit eigenen Regeln, fächerübergreifender Unterricht und Brücke zwischen Familie und Gesellschaft.">
        <g fill="none" stroke="var(--st2)" stroke-width="1.3" opacity=".6">

          <text x="120" y="50" text-anchor="middle" class="gloss">fördert Kreativität und Emotionen</text>
          <rect class="box" x="520" y="14" width="200" height="50" rx="6"/>
          <text x="620" y="34" text-anchor="middle" class="kt">2 · Individualisiert</text>

          <rect class="box" x="20" y="222" width="200" height="50" rx="6"/>
          <text x="120" y="242" text-anchor="middle" class="kt">3 · Polis</text>

          <rect class="box" x="520" y="222" width="200" height="50" rx="6"/>
          <text x="620" y="242" text-anchor="middle" class="kt">4 · Fächerübergreifend</text>

        </g>
        <text x="20" y="120" class="gloss">Ziel: „sich selbst</text><text x="20" y="134" class="gloss">bestimmende</text><text x="20" y="148" class="gloss">Individualität\" (F 18)</text>

      </svg>`,
      caption: "<b>Die Folie ist eine Liste, hier als Rad.</b> Alle fünf Merkmale hängen an der Idee, dass Schule ein überschaubarer Lebensraum ist, in dem man Demokratie einübt. Klausurfalle: „Disziplin\" oder „Leistungsorientierung\" als sechstes Merkmal anbieten. Beides steht nicht auf F 22." },
  ],
  karten: [
    { id: "system", wer: "Einordnung · F 2 · 12 · 25", titel: "Systematisierung: zwei Fragen, zwei Haltungen",
      kurz: "Das Regal aus Schultheorie I kommt dreimal wieder, jedes Mal mit einem anderen roten Rahmen. Schultheorie II füllt die drei Fächer, die in ST I leer geblieben sind: Foucault, Mead, von Hentig.",
      bloecke: [
        { h4: "Wer steht wo", ftag: "F 2", tabelle: { kopf: ["", "Empirisch-analytisch", "Normativ orientiert"], zeilen: [
          ["Verhältnis Schule und Gesellschaft", "Parsons, Fend, Bourdieu (ST I)", "<b>Foucault</b>: gesellschaftskritische Schultheorien"],
          ["Binnenstrukturen der Schule", "<b>Mead</b>: Symbolischer Interaktionismus und Sozialpsychologie", "<b>von Hentig</b>: Geisteswissenschaftliche Pädagogik"] ] },
          hint: "Empirisch-analytisch = beschreibt, wie Schule ist. Normativ = sagt, wie Schule sein soll. Binnenstrukturen = das Innere der Schule: Unterricht, Beziehungen, Regeln." },
        { h4: "Drei Fassungen derselben Folie", dl: [
          { dt: "F 2", dd: "rot gerahmt sind die drei Theorien dieser Sitzung (Foucault, Mead, von Hentig) mit ihren Oberkategorien. <b>Parsons, Fend und Bourdieu bleiben grau</b>, die kamen in Schultheorie I dran." },
          { dt: "F 12", dd: "rot gerahmt: Binnenstrukturen, normativ, von Hentig. Leitet zur Geisteswissenschaftlichen Pädagogik über." },
          { dt: "F 25", dd: "rot gerahmt: Binnenstrukturen, empirisch-analytisch, Mead. <b>Achtung:</b> hier heißt der linke Kasten „Strukturfunktionalistische Theorie der Schule (Parsons, Fend)\" und <b>Bourdieu fehlt</b>. Das ist eine Kurzfassung, keine neue Einordnung." } ] },
      ],
      kritikAn: null, kritikSelbst: null, kritikIdee: null,
      fallen: [
        "<b>Foucault ist normativ,</b> nicht empirisch-analytisch, obwohl er historisch arbeitet. Und er steht beim <b>Verhältnis Schule und Gesellschaft</b>, nicht bei den Binnenstrukturen.",
        "<b>Mead und von Hentig</b> teilen sich das rechte Regal. Mead = empirisch-analytisch, von Hentig = normativ. Wer die beiden tauscht, hat den häufigsten Decoy gekreuzt." ] },

    { id: "foucault", wer: "Michel Foucault (1926 bis 1984) · gesellschaftskritische Schultheorie · F 3 bis 11", titel: "Foucault: Schule diszipliniert, sie befreit nicht",
      kurz: "Französischer Philosoph, Soziologe, Historiker. Seine Frage: Wie hängen Macht und Wissen zusammen? Seine Antwort für die Schule: Sie vermittelt Wissen, um Machtstrukturen zu festigen, und ihr Ziel ist Disziplinierung, nicht Mündigkeit (F 3, F 8).",
      bloecke: [
        { h4: "Schlüsselbegriffe", dl: [
          { dt: "Macht und Wissen", ftag: "F 3", dd: "Wissen ist <b>verknüpft mit Machtstrategien</b>. Schule als <b>Disziplinarmacht</b>: sie vermittelt Wissen, um Machtstrukturen zu festigen, und die Machtstrukturen dienen wiederum der Wissensvermittlung. Ein Kreislauf. Foucaults Position: gegen ökonomisch motivierte Bildungspolitik, für die Verknüpfung von Schule und Politik." },
          { dt: "Das Zitat", ftag: "F 4", dd: "<q>Jedem Individuum seinen Platz und auf jeden Platz ein Individuum. (…) jeden Augenblick das Verhalten eines jeden überwachen, abschätzen und sanktionieren zu können; die Qualitäten und die Verdienste zu messen. Es handelt sich also um eine Prozedur zur Erkennung, zur Meisterung und zur Nutzbarmachung.</q> (Foucault 1977: 183 bis 184). Einfach: Jeder bekommt einen Platz, jeder wird ständig beobachtet und bewertet." },
          { dt: "Übung und Prüfung", ftag: "F 5", dd: "Wissensvermittlung ist Bestandteil und Funktion des Bildungssystems. Problem: Sie ist mit Machtbeziehungen verknüpft, verliert ihren <b>aufklärerischen Anspruch</b> und wird <b>zum Selektionsprozess</b>. Schule als <q>räumlich und zeitlich durchstrukturierte Institution, in der Techniken der Übung und der Prüfung das Unterrichtsgeschehen beherrschen</q>." },
          { dt: "Dispositiv der Macht", ftag: "F 6", dd: "Dispositiv = <q>umfassende Konstellation aus ‚spezifischen Orten, eigenen Regelungen, sorgfältig ausgebildeten hierarchischen Strukturen' und nicht zuletzt spezifischen Wissensregimes</q>. Einfach: die ganze Anordnung aus Räumen, Regeln, Hierarchien und dem, was als Wissen zählt. Foucault sieht <b>keine Logik des Fortschritts oder der Emanzipation</b>; Schule ist ein <b>Spiegel gesellschaftlich dominierender Machtkonfigurationen</b>." },
          { dt: "Aufklärung und Disziplinen", ftag: "F 7", dd: "<q>Die Aufklärung, welche die Freiheiten entdeckt hat, hat auch die Disziplinen erfunden</q> (Foucault 1977). Die Bildungssemantik des 19. Jahrhunderts (Kräfte üben statt Stoff pauken, z. B. Alte Sprachen am Gymnasium) steht weniger für Autonomiegewinn als für <q>Einbindung in die Disziplinargesellschaft</q>." },
          { dt: "Lernapparat", ftag: "F 7", dd: "Kritik an neuzeitlicher Didaktik: Lehrstoff wird elementarisiert, in einfachste Elemente zerlegt. <q>Schule wird zum Lernapparat, in welchem alle Schüler, alle Niveaus, alle Augenblicke bei richtiger Kombination ständig im allgemeinen Unterrichtsprozess eingesetzt sind</q>." },
          { dt: "Funktion von Schule", ftag: "F 8", dd: "<b>Schule als Disziplinarmacht:</b> <q>Nicht Erziehung zur Freiheit und Mündigkeit stehen laut Foucault im Fokus des Schulsystems, sondern Disziplinierung wird als Ziel von Schule angesehen.</q> <b>Schule als Machtverhältnis</b>, das auf Individuen einwirkt und sie <q>von innen heraus in ein verändertes Verhältnis zu sich und zur Gesellschaft setzt</q>." } ] },
        { h4: "Kritische Würdigung", ftag: "F 9", text: "Foucault beschreibt Schule als Spiegelbild sich stets verändernder Machtdynamiken und will diese aufdecken und abweisen. <b>Nutzen für das Schulsystem:</b> Die Erkenntnis solcher Mechanismen erlaubt, damit verbundene <b>Machtdeformationen aufzuzeigen und ihnen entgegenzuwirken</b>. Die Folie heißt „Kritische Würdigung\", enthält aber keinen Einwand gegen Foucault, nur den Nutzen." },
        { h4: "Schule ist kein wertneutraler Ort", ftag: "F 10", text: "Diese Folie fehlt im Textextrakt, sie besteht aus einem Buchcover („Macht in der Schule\", Texte in Leichter Sprache) und einem KMK-Zitat: <q>Kinder und Jugendliche brauchen ein Wertesystem, in dem sie sich orientieren können. Schule ist dafür verantwortlich, ihnen eines zu vermitteln, das den freiheitlichen und demokratischen Grund- und Menschenrechten entspricht. (…) Somit ist auch Schule kein wertneutraler Ort. Das pädagogische Handeln in Schulen ist von demokratischen Werten und Haltungen getragen</q> (KMK 2009, 3)." },
        { h4: "Machtgefälle in der Schule", ftag: "F 11", dl: [
          { dt: "Drei Ungleichheiten", dd: "von <b>Rechten</b> (Volljährige/Mündige vs. Minderjährige), in den <b>Kompetenzen</b> (Expert:innen vs. Schüler:innen), von <b>Sanktionierungsgewalt</b> (nur Lehrkräfte können bewerten, Leistung auszeichnen, aber auch strafen)." },
          { dt: "Folge", dd: "Weder Schulkultur noch organisatorische Strukturen noch pädagogische Praktiken (Erziehen, Unterrichten, Beurteilen) sind frei von Machtverhältnissen." },
          { dt: "Wie damit umgehen", dd: "Damit Schule demokratische Werte vertreten kann, braucht es Raum für <b>kritische Reflexion</b> der schulischen Konzeption und Organisation, <b>hohe Transparenz</b> und einen angemessenen Grad an <b>Mitwirkung</b> von Schüler:innen und Eltern." } ] },
      ],
      kritikAn: null,
      kritikSelbst: { ftag: "F 3 · 5 · 7 · 8", punkte: [
        "<b>An der Bildungspolitik (F 3):</b> Position gegen ökonomisch motivierte Bildungspolitik.",
        "<b>An der Wissensvermittlung (F 5):</b> sie ist mit Macht verknüpft, verliert den aufklärerischen Anspruch und wird zum Selektionsprozess.",
        "<b>An der Aufklärung (F 7):</b> sie hat die Freiheiten entdeckt und zugleich die Disziplinen erfunden; die Kräfte-Bildung des 19. Jahrhunderts bindet in die Disziplinargesellschaft ein.",
        "<b>An der Didaktik (F 7):</b> Elementarisierung macht Schule zum Lernapparat.",
        "<b>Am Ziel der Schule (F 8):</b> nicht Freiheit und Mündigkeit, sondern Disziplinierung." ] },
      kritikIdee: { punkte: [
        "<b>Aus Folie 10 ableitbar:</b> Die KMK sagt, Schule sei „kein wertneutraler Ort\" und ihr Handeln sei von demokratischen Werten getragen. Wenn das stimmt, ist Disziplinierung nicht das einzige Ziel von Schule. Foucaults Bild ist dann einseitig.",
        "<b>Aus Folie 11 ableitbar:</b> Die Folie nennt selbst Wege, mit dem Machtgefälle umzugehen (Reflexion, Transparenz, Mitwirkung). Das setzt voraus, dass Schule Macht auch begrenzen kann. Foucault beschreibt die Macht, aber kaum, wie man sie in der Schule konkret abbaut.",
        "<b>Aus Folie 28 ableitbar (Mead):</b> Die Lehrperson, die mir Können attestiert, macht mich nicht nur gefügig, sie lässt mich erfahren, dass ich begabt bin. Interaktion in der Schule bildet Identität, nicht nur Disziplin." ] },
      fallen: [
        "<b>Zwei echte Begriffe, nicht dasselbe:</b> <b>Disziplinarmacht</b> (F 3, 8) ist die Rolle der Schule: Wissen vermitteln, um Macht zu festigen. <b>Dispositiv der Macht</b> (F 6) ist die Anordnung aus Orten, Regeln, Hierarchien und Wissensregimen. Ein Decoy bietet gern nur einen davon als „falsch\" an.",
        "<b>Umkehr-Decoy:</b> „Foucault: Schule erzieht zur Freiheit und Mündigkeit\" ist falsch. Die Folie sagt ausdrücklich <b>nicht</b> Freiheit, <b>sondern</b> Disziplinierung (F 8, F 34)." ] },

    { id: "gwp", wer: "Geisteswissenschaftliche Pädagogik · Kontext zu von Hentig · F 13 bis 16", titel: "Geisteswissenschaftliche Pädagogik: sagen, wie Schule sein soll",
      kurz: "Die Richtung, aus der von Hentig kommt. Sie formuliert Ziele statt Befunde und war lange die dominierende Pädagogik in Deutschland. Der Exkurs zu Nohl zeigt ihre dunkle Seite.",
      bloecke: [
        { h4: "Einordnung", ftag: "F 13", dl: [
          { dt: "Zeit", dd: "dominierende pädagogische Richtung in der <b>Weimarer Republik</b> und der alten Bundesrepublik nach 1945 <b>bis ca. 1960</b>." },
          { dt: "Vertreter", dd: "<b>Nohl, Spranger, Wilhelm</b>." },
          { dt: "Normative Ausrichtung", dd: "Formulierung von Zielen, <q>wie Schule sein soll</q>." } ] },
        { h4: "Aufgabe und Ziel der Schule", ftag: "F 14", dl: [
          { dt: "Aufgabe", dd: "<q>Überführung des Kindes aus der Gebundenheit an die Familie in die Willensform des öffentlichen Lebens</q>, <q>die Kräfte in ihm [dem Kind] zu entwickeln, die alle Organisationen tragen</q> (Nohl 1963, S. 197). Einfach: Das Kind soll aus der Familie in die Öffentlichkeit hineinwachsen." },
          { dt: "Ziel der Institution Schule", dd: "Entwicklung des Kindes im Sinne der <b>optimalen Entfaltung aller seiner Möglichkeiten</b> (Blömeke et al. 2009, S. 22)." } ] },
        { h4: "Exkurs: Herman Nohl und der Nationalsozialismus", ftag: "F 15 · 16", dl: [
          { dt: "Lebensdaten", dd: "1879 Berlin bis 1960 Göttingen. Philosophiestudium, Privatdozent bis 1914, Hochschulgründung in Thüringen, Professur in Göttingen." },
          { dt: "1933 bis 1947", dd: "1933 <b>Begrüßung der NS-Machtübernahme</b> als Gelegenheit zur Umsetzung der völkischen Pädagogik; „Zugeständnisse\" in Vor- und Nachworten, rechtsradikale Äußerungen in Vorlesungen. <b>1937 Zwangsemeritierung</b> durch die Nationalsozialisten aus unbekannten Gründen. 1945 Rückkehr an den Lehrstuhl, 1947 Ruhestand." },
          { dt: "Prinzipien", dd: "Erziehung als Entfaltung körperlicher und geistiger Kräfte; <b>Autonomie der Erziehung</b> gegenüber anderen Kultursystemen; Anhänger der „Deutschen Bewegung\": hoher Stellenwert der „Gemeinschaft\", dennoch Wahrung der Autonomie des Individuums." },
          { dt: "Kontroverse", dd: "1936 Appell in der Kölnischen Zeitung gegen Zwang; aber 1933/34 Verurteilung „ungesunder Ehen\" und Sterilisation zur „Stärkung der Volksgesundheit\"." } ] },
      ],
      kritikAn: null, kritikSelbst: null,
      kritikIdee: { punkte: [
        "<b>Aus Folie 15 und 16 ableitbar:</b> Eine normative Pädagogik sagt, wie Schule sein soll. Woher die Ziele kommen, prüft sie nicht empirisch. Nohls Beispiel zeigt, wie schnell so eine Pädagogik die Ziele der herrschenden Ideologie übernimmt.",
        "<b>Aus Folie 6 ableitbar (Foucault):</b> Nohl fordert „Autonomie der Erziehung gegenüber anderen Kultursystemen\" (F 16). Foucault würde sagen: Schule ist nie autonom, sie spiegelt die dominierenden Machtkonfigurationen." ] },
      fallen: [
        "<b>Wer gehört wohin:</b> Nohl, Spranger, Wilhelm sind die historischen Vertreter (F 13). In der Systematik (F 2) steht bei „Geisteswissenschaftliche Pädagogik\" aber <b>von Hentig</b>. Nohl taucht im Regal nicht auf.",
        "<b>Zahlen-Decoy:</b> bis <b>ca. 1960</b> dominierend, Nohl <b>1937</b> zwangsemeritiert, <b>1945</b> zurück." ] },

    { id: "hentig", wer: "Hartmut von Hentig (*1925) · Geisteswissenschaftliche Pädagogik · F 17 bis 22", titel: "von Hentig: Schule als polis, Demokratie im Kleinen",
      kurz: "Erziehungswissenschaftler und Publizist, ab 1968 Professor für Pädagogik in Bielefeld. Das Individuum steht im Zentrum, geprägt durch Sozialisationsinstanzen und geschichtliche Entwicklungen (F 17). Schule soll ein überschaubarer Lebensraum sein, in dem man Demokratie einübt.",
      bloecke: [
        { h4: "Bildungsbegriff", ftag: "F 18", dl: [
          { dt: "Bildung ist ein Prozess", dd: "durch den ein Mensch eine <q>sich selbst bestimmende Individualität</q> wird und als solche <q>die Menschheit bereichert</q>. → <b>Neuhumanistische Tradition</b>. Einfach: Bildung macht mich zu jemandem, der selbst bestimmt, wer er ist." },
          { dt: "Ziel", dd: "Fähigkeit und Wille, sich zu verständigen, und ein <q>Bewusstsein von der Geschichtlichkeit der eigenen Existenz</q>. Bildung wird dort zuteil, wo einem die eigene <q>Gefühls- und Meinungsausstattung</q> bewusst wird und man das Verhalten daraufhin selbst steuert und verantwortet." } ] },
        { h4: "Funktion und Bedeutung der Schule", dl: [
          { dt: "Emanzipatorisch gedacht", ftag: "F 19", dd: "Schule wird vom emanzipatorischen Denken her konzipiert. Ist sie keine emanzipatorische Institution, <q>wird sie bald keine Schule mehr sein, sondern ein sozialpädagogisches Heim einerseits und eine Berufsvorbereitungsanstalt andererseits</q>. → <b>Kritisiert die Qualifikationsfunktion</b> von Schule. Emanzipation = sich aus Abhängigkeit befreien." },
          { dt: "Kritisches Denken und Wissen um seiner selbst willen", ftag: "F 20", dd: "Eine Schule, in der kritisches Denken neben dem erfahrungsgesättigten Leben für Schüler:innen <b>und</b> Lehrkräfte gleichermaßen konstitutiv ist. Schule soll Kulturtechniken vermitteln und <q>einen beträchtlichen Anteil an Wissen, das für sich wichtig ist und nicht zu etwas</q>." },
          { dt: "Schule zur polis machen", ftag: "F 20", dd: "Gemeinschaftsleben soll bildenden Charakter haben: <q>Man muss die Schule…zur polis machen</q>. → Schule als <b>überschaubarer Lebens- und Erfahrungsraum, in dem die Demokratie im Kleinen erlebt und eingeübt werden kann</b>. Polis = die griechische Stadtgemeinschaft, in der Bürger gemeinsam entscheiden." },
          { dt: "Nicht nur Kenntnisse", ftag: "F 21", dd: "Schule sollte nicht ausschließlich Kenntnisse und Fertigkeiten vermitteln, sondern als <b>Schonraum</b> für die natürliche Entwicklung fungieren, als Institution zur <b>Erziehung</b> dienen oder über die <b>gesellschaftliche Verteilung</b> von Berechtigungen entscheiden, und sie versteht sich als <q>Lebens- und Erfahrungsraum</q>." } ] },
        { h4: "Fünf Merkmale seiner Schulkonzeption", ftag: "F 22", tabelle: { kopf: ["Nr.", "Merkmal", "Folienwortlaut"], zeilen: [
          ["1", "<b>Lebensraum</b>", "Schule als Lebensraum fördert Kreativität und Emotionen"],

    { titel: "Comenius und Rousseau: zwei Vierer auf der Altersachse", ftag: "F 6 · 14",

    { titel: "Humboldt: Unterricht in drei Stadien", ftag: "F 24",
      svg: `<svg viewBox="0 0 720 262" role="img" aria-label="Drei gestapelte Kästen wie auf der Folie: oben Universitätsunterricht als Ort der freien geistigen Begegnung mit Einheit von Forschung und Lehre, in der Mitte Schulunterricht mit gymnastischer, ästhetischer und didaktischer Bildung, unten Elementarunterricht als Vermittlung elementarer Kulturtechniken.">

  karten: [
    { id: "leitfragen", wer: "Einstieg · F 1 · 2", titel: "Drei Fragen an vier Klassiker", color: "var(--ink)",
      kurz: "Die Sitzung stellt drei Fragen an Comenius, Rousseau, Humboldt und Herbart. Jede Breakdown-Karte beantwortet sie für einen der vier.",
      bloecke: [
        { h4: "Fragen zur Sitzung", ftag: "F 2", dl: [
          { dt: "Spannungsfeld gesellschaftlicher Mächte", dd: "Wie verorten neuzeitliche Klassiker die Schule im Spannungsfeld von <b>Kirche, Staat und Ökonomie</b>? Einfach: Wer darf bestimmen, was Schule tut?" },
          { dt: "Allgemeine Menschenbildung", dd: "Was verstehen die Klassiker darunter? Einfach: Bildung des ganzen Menschen, nicht Ausbildung für einen Beruf oder Stand (vgl. F 35)." },
          { dt: "Relevanz für die Gegenwart", dd: "Inwiefern sind die Klassiker auch für heutige Überlegungen zu Schule relevant? Antwort steht bei jedem in der „Kritischen Würdigung\" (F 9, 16, 25, 33)." } ] },
        { h4: "Was „neuzeitlich\" hier heißt", ftag: "F 3 · 10 · 19 · 26", text: "17. Jahrhundert (Comenius), 18. Jahrhundert (Rousseau), 19. Jahrhundert (Humboldt und Herbart). Die Sitzung geht in Zeitfolge durch die vier." },
