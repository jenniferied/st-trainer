  karten: [
    { id: "staat", wer: "Einstieg · Rechtsquellen, Grundgesetz, Schulaufsicht · F 6 bis 13, 85 bis 88", titel: "Der Staat setzt den Rahmen: zwei Artikel und ein Satz",
      kurz: `Art. 6 GG gibt den Eltern das Erziehungsrecht, Art. 7 GG gibt dem Staat die Aufsicht. Dann kommt der Satz „Bildung ist Ländersache“ (F 13): Alles Weitere steht im Landesgesetz, in Brandenburg im BbgSchulG. Die staatliche Aufsicht wird dort zweistufig ausgeübt: Ministerium und Schulämter.`,
      bloecke: [
        { h4: "Wo finde ich das Recht?", ftag: "F 6 · 7", dl: [
          { dt: "Schulgesetze der Länder", dd: `Übersicht bei der KMK. Brandenburg: Neufassung des BbgSchulG vom 02.08.2002, zuletzt geändert 2022 (bravors.brandenburg.de). Berlin hat ein eigenes SchulG von 2004.` },
          { dt: "Rechtliche Erkenntnisquellen", dd: `Die Rechtsabteilung der Landesschulbehörde oder des Kultusministeriums; die Rechtsinformationssysteme der Länder (Landesnormen, Erlasse, Rundschreiben mit Kommentierungen); Bundesrecht auf gesetze-im-internet.de; Entscheidungen der Bundesgerichte (BVerfG, BVerwG, BGH).` } ] },
        { h4: "Schule im Grundgesetz", ftag: "F 9 · 10", dl: [
          { dt: "Zwei Bereiche", dd: `Das Grundgesetz teilt sich in <b>Grundrechte</b> und <b>Staatsorganisationsrecht</b>. Für Behörden und Schulen sind die Grundrechte besonders wichtig. <b>Art. 6 und Art. 7 GG regeln schulische Grundrechte.</b>` },
          { dt: "Art. 6 Abs. 2 GG", dd: `<q>Pflege und Erziehung der Kinder sind das natürliche Recht der Eltern und die zuvörderst ihnen obliegende Pflicht. Über ihre Betätigung wacht die staatliche Gemeinschaft.</q> Einfach: Zuerst erziehen die Eltern, der Staat schaut zu und greift ein, wenn nötig.` },
          { dt: "Art. 7 Abs. 1 GG", dd: `<q>Das gesamte Schulwesen steht unter der Aufsicht des Staates.</q> Auf der Folie rot hinterlegt. Aus diesem Satz werden später die Schulpflicht (F 12) und das Unparteilichkeitsgebot für Lehrkräfte (F 61) hergeleitet.` } ] },
        { h4: "Schulpflicht: länderübergreifend", ftag: "F 12 · 13", dl: [
          { dt: "Nicht im Grundgesetz", dd: `Das GG enthält <b>keine expliziten Vorgaben</b> zur Schulpflicht. Sie wird <b>meist durch Art. 7 Abs. 1 GG</b> hergeleitet und ist in den Landesverfassungen und Landesgesetzen geregelt.` },
          { dt: "Beispiel auf der Folie: Berlin", dd: `Die Folie zitiert als Beispiel Berlin, § 42 Abs. 1 SchulG: <q>Mit Beginn eines Schuljahres (1. August) werden alle Kinder schulpflichtig, die das sechste Lebensjahr vollendet haben oder bis zum folgenden 30. September vollenden.</q> Für Brandenburg gilt der fast gleiche Text in § 37 BbgSchulG (F 24).` },
          { dt: "Bildung ist Ländersache", dd: `Der Merksatz von F 13. Deshalb heißt die Sitzung ab hier „Ausgewählte Aspekte des Schulrechts in Brandenburg“.` } ] },
        { h4: "Schulverwaltung und Schulaufsicht", ftag: "F 86 bis 88", dl: [
          { dt: "Zweistufig in Brandenburg", ftag: "F 87", dd: `<b>Oberste Schulaufsicht:</b> Ministerium für Bildung, Jugend und Sport (MBJS), Abteilung „Schule und Lehrerbildung“. <b>Untere Schulaufsicht:</b> 4 staatliche Schulämter (auf der Karte: Neuruppin, Brandenburg an der Havel, Frankfurt (Oder), Cottbus). Die Schulaufsicht umfasst <q>die Gesamtheit der staatlichen Aufgaben zur inhaltlichen, organisatorischen und planerischen Gestaltung und die Beaufsichtigung des Schulwesens</q>.` },
          { dt: "Aufgaben der staatlichen Schulämter", ftag: "F 88", dd: `Ausstattung der Schulen mit Lehrerstellen; Schulrätinnen und Schulräte führen <b>Fachaufsicht</b> über Förderschulen, Gesamtschulen, Grundschulen, Gymnasien, Oberschulen, Einrichtungen des 2. Bildungswegs, berufliche Schulen und Schulen in freier Trägerschaft; Beratung der Schulen in pädagogischen und organisatorischen Fragen; Aufsicht über Schulen in öffentlicher und freier Trägerschaft; die <b>Leiter:innen der Schulämter sind Dienstvorgesetzte</b> von Lehrkräften, Schulleitung und sonstigem pädagogischen Personal.` },
          { dt: "Allgemeines Schema", ftag: "F 86", dd: `Die Folie zeigt daneben ein allgemeines Bild: Staatliche Schulämter für Grundschulen, Hauptschulen, Sonderschulen; Kultusministerium für sonstige Schulen einschließlich beruflicher Schulen. Das ist <b>nicht</b> die Brandenburger Aufteilung (siehe F 88).` } ] },
        { h4: "Wo steht was im BbgSchulG (Zwischenfolien)", ftag: "F 15 · 19 · 22 · 26 · 33 · 39 · 42 · 75 · 81 · 83", tabelle: { kopf: ["Teil des Gesetzes", "Abschnitt", "Paragrafen in der Sitzung"], zeilen: [
          ["Teil 2 Schulgestaltung", "1 Stellung der Schulen", "§ 6 Rechtsstellung, § 7 Selbstständigkeit"],
          ["Teil 3 Schulaufbau", "1 Schulstruktur", "§ 15 innere, § 16 äußere Organisation, § 17 Abschlüsse"],
          ["Teil 4 Schulpflicht", "", "§ 36 Grundsätze, § 37 Beginn, § 38 Vollzeitschulpflicht"],
          ["Teil 5 Schulverhältnis", "1 Allgemeine Vorschriften", "§ 44 Rechte und Pflichten, § 46 Information, § 47 Meinungsfreiheit"],
          ["Teil 5 Schulverhältnis", "3 Leistungsbewertung", "§ 57 Grundsätze, § 58 Zeugnisse"],
          ["Teil 5 Schulverhältnis", "4 Erziehungs- und Ordnungsmaßnahmen", "§ 63 Grundsätze, § 64 Ordnungsmaßnahmen"],
          ["Teil 6 Schulpersonal", "", "§ 67 Lehrkräfte"],
          ["Teil 7 Mitwirkungsrechte", "1 Allgemein · 2 Eltern · 3 Schüler", "§ 74 Ziel, § 81 Elternversammlung, § 83 Klassensprecher"] ] },
          hint: "Die Zwischenfolien zeigen jeweils das Inhaltsverzeichnis des Gesetzes. Nützlich, wenn eine Frage nur den Teil nennt („Teil 4“) statt des Paragrafen." },
      ],
      kritikAn: null, kritikSelbst: null, kritikIdee: null,
      fallen: [
        `<b>Artikel-Falle:</b> Art. <b>6</b> GG = Recht der <b>Eltern</b>, Art. <b>7</b> GG = Aufsicht des <b>Staates</b>. Und die Schulpflicht steht in <b>keinem</b> Artikel des Grundgesetzes ausdrücklich drin, sie wird nur aus Art. 7 Abs. 1 hergeleitet (F 12).`,
        `<b>§ 42-Falle:</b> Auf F 12 ist § 42 das <b>Berliner</b> Schulgesetz (Schulpflichtbeginn). Im <b>BbgSchulG</b> ist § 42 laut Inhaltsverzeichnis (F 22) „Ordnungswidrigkeiten“. Der Brandenburger Schulpflichtbeginn ist § 37 BbgSchulG.` ] },

    { id: "schule", wer: "BbgSchulG Teil 2 und Teil 7 · Stellung, Selbstständigkeit, Mitwirkung · F 15 bis 18, 75 bis 84", titel: "Die Schule: Anstalt des Schulträgers, aber selbstständig, und alle wirken mit",
      kurz: `§ 6 sagt, was die Schule rechtlich ist. § 7 sagt, was sie selbst entscheiden darf. § 74 knüpft genau daran an: Ziel der Mitwirkung ist, <q>die Selbstständigkeit jeder Schule gemäß § 7 zu fördern</q> (F 77).`,
      bloecke: [
        { h4: "§ 6 BbgSchulG: Rechtsstellung", ftag: "F 16", dl: [
          { dt: "Abs. 1", dd: `<q>Die Schulen sind nichtrechtsfähige öffentliche Anstalten des Schulträgers.</q> Einfach: Die Schule ist keine eigene juristische Person, sie gehört zum Schulträger. Mit Bevollmächtigung durch den Schulträger kann sie trotzdem Rechtsgeschäfte abschließen, Verpflichtungen eingehen und Verträge über Räume und Grundstücke schließen.` },
          { dt: "Schulträger (§ 100)", dd: `Die <b>Gemeinde</b> bei Grundschulen, der <b>Landkreis</b> oder die <b>kreisfreie Stadt</b> bei weiterführenden Schulen.` },
          { dt: "Abs. 2", dd: `Der Schulträger kann die Schule <b>versuchsweise</b> in einer abweichenden öffentlich-rechtlichen Organisationsform organisieren. Er bleibt für die Aufgaben nach Teil 8 zuständig; die Erprobung braucht die Genehmigung des Ministeriums im Einvernehmen mit der obersten Kommunalaufsichtsbehörde.` } ] },
        { h4: "§ 7 BbgSchulG: Selbstständigkeit", ftag: "F 17 · 18", dl: [
          { dt: "Abs. 1", dd: `Selbstbestimmung der <b>pädagogischen, fachlichen, didaktischen und organisatorischen</b> Tätigkeit → Profilierung, z. B. naturwissenschaftlich-technisches Schulprofil, <b>in Abstimmung mit Schulträger und Schulamt</b>. Dabei Wahrung von Chancengleichheit und Anerkennung von Abschlüssen.` },
          { dt: "Abs. 2", dd: `Pädagogische Ziele und Schwerpunkte werden im <b>Schulprogramm</b> festgelegt; regelmäßige Überprüfung der Ziele → <b>interne und externe Evaluationen</b>.` },
          { dt: "Abs. 5", dd: `Die staatlichen Schulämter <b>sollen</b> den Schulen Entscheidungsbefugnisse über die Verwendung von Personalmitteln einräumen; Personalmittel selbst bewirtschaften, mit sachgerechtem Ausgleich zwischen den Schulen (§ 109 Abs. 4).` },
          { dt: "Abs. 6", dd: `Schule im <b>partnerschaftlichen Zusammenwirken</b> von Eltern, Schüler:innen (ihrem Alter entsprechend), Lehrkräften und sonstigen an der Schule tätigen Personen; enge Zusammenarbeit mit Schulträger und Schulbehörden.` } ] },
        { h4: "§ 74 BbgSchulG: Mitwirkungsrechte", ftag: "F 76 · 77", dl: [
          { dt: "Ziel (Abs. 1)", dd: `<q>Ziel der Mitwirkung ist es, die Selbstständigkeit jeder Schule gemäß § 7 zu fördern und das notwendige partnerschaftliche Zusammenwirken aller Beteiligten in der Bildungs- und Erziehungsarbeit zu stärken. An der Gestaltung eines demokratischen Schullebens wirken Eltern, Schülerinnen und Schüler ihrem Alter entsprechend sowie Lehrkräfte mit.</q>` },
          { dt: "Wer darf Elternrechte wahrnehmen?", dd: `Auch der <b>nicht personensorgeberechtigte</b> Elternteil; wer mit den Personensorgeberechtigten und dem Kind in einem <b>familiären Zusammenhang</b> lebt; wer im Rahmen der <b>Hilfen zur Erziehung</b> damit beauftragt ist.` },
          { dt: "Das Schema von F 76", dd: `Eltern, SchülerInnen und Lehrkräfte ↔ Mitwirkung (Möglichkeiten nutzen, sich einbringen, etwas bewegen, konstruktiv zusammenarbeiten) → <b>in Gremien, im Schulleben, im Unterricht</b>.` } ] },
        { h4: "§ 81: Elternversammlung", ftag: "F 82", dl: [
          { dt: "Wer", dd: `Die Eltern jeder Klasse bilden zusammen die Elternversammlung. Voraussetzung: Zu Beginn des Schuljahres ist die <b>Mehrzahl der Schülerschaft minderjährig</b>.` },
          { dt: "Wann", dd: `Auf Wunsch von <b>mindestens einem Fünftel</b> der Eltern. Die Versammlung dient dem Informations- und Meinungsaustausch über schulische Angelegenheiten.` },
          { dt: "Was sie entscheidet (Abs. 2)", dd: `<q>Die Elternversammlung entscheidet im Einvernehmen mit der Klassenkonferenz über die schriftlichen Informationen zur Lernentwicklung anstelle der Notengebung sowie über das Aufrücken in die nächsthöhere Jahrgangsstufe an Stelle der Versetzung. Angelegenheiten einzelner Schülerinnen und Schüler dürfen nur mit Einverständnis ihrer Eltern behandelt werden.</q>` },
          { dt: "Elternvertreter", dd: `Die Eltern wählen <b>zwei</b> Elternvertreter; diese laden mit der Klassenleitung <b>mindestens dreimal im Jahr</b> zur Elternversammlung ein.` } ] },
        { h4: "§ 83: Klassensprecherinnen und Klassensprecher", ftag: "F 84", dl: [
          { dt: "Ab Jahrgang 4", dd: `Wahl von <b>zwei</b> Klassensprecherinnen oder Klassensprechern.` },
          { dt: "Freistellung (Abs. 2)", dd: `<q>Die Sprecherinnen und Sprecher der Klassen und Jahrgangsstufen sind für die Vorbereitung und die Teilnahme an Gremiensitzungen in der Regel zwei Stunden je Schulmonat vom Unterricht freizustellen.</q>` },
          { dt: "Jahrgangsstufen 1 bis 3", dd: `Werden ihrem Alter entsprechend an die Formen der Mitwirkung <b>herangeführt</b>. Wenn die Schülerschaft es wünscht, können auch hier schon Klassensprecher gewählt werden.` } ] },
        { h4: "Fallbeispiele zur Mitwirkung", ftag: "F 78 bis 80", dl: [
          { dt: "Rheinland-Pfalz: Schülervertreter fordern", ftag: "F 78 · 79", dd: `Schülervertreter wenden sich gegen Frontalunterricht und ein zwei- oder dreigliedriges Schulsystem; die Ministerin kündigt ein Schulgesetz mit deutlich gestärkten Schülerrechten an. Frage der Folie: Hat sich das Schulgesetz durch die Mitwirkung geändert? Gezeigt wird § 3 Abs. 4 SchulG RLP: Schüler werden ihrem Alter und ihrer Entwicklung entsprechend in Entscheidungen über Unterricht, außerunterrichtlichen Bereich und Schulgemeinschaft eingebunden.` },
          { dt: "spickmich.de", ftag: "F 80", dd: `Schüler benoten Lehrkräfte auf einem Portal (Kriterien wie „motiviert“, „menschlich“, „gelassen“). Der <b>BGH</b> bestätigt das: Die Bewertungen <q>stellen Meinungsäußerungen dar, die die berufliche Tätigkeit der Klägerin betreffen</q>. Die freie Meinungsäußerung ist hier wichtiger als das Recht der Lehrerin auf Anonymität; bei Privatsphäre wäre der Schutz stärker.` } ] },
      ],
      kritikAn: null, kritikSelbst: null,
      kritikIdee: { punkte: [
        `<b>Aus Folie 17 und 18 ableitbar:</b> Die Selbstständigkeit nach § 7 ist gewährt, nicht garantiert. Das Schulprofil gilt nur „in Abstimmung mit Schulträger und Schulamt“, und Personalmittel bekommt die Schule nur, wenn die Schulämter ihr Befugnisse „einräumen“ (Soll-Vorschrift). Die Schule bleibt eine nichtrechtsfähige Anstalt (§ 6).`,
        `<b>Aus Folie 84 ableitbar:</b> § 74 sagt nur „ihrem Alter entsprechend“. Was das heißt, legt erst § 83 fest: Wahl ab Jahrgang 4, davor nur Heranführen. Für Jahrgang 1 bis 3 bleibt Mitwirkung also weitgehend eine Kann-Regel.` ] },
      fallen: [
        `<b>Paragrafen-Falle § 46 vs. § 74:</b> § 46 ist „Informations- und Beteiligungsrechte“ (Beratung, Unterricht besuchen, F 30). Die <b>Mitwirkung</b> in Gremien ist § 74 (F 77). Wer „Mitwirkung = § 46“ ankreuzt, liegt falsch.`,
        `<b>Zahlen-Falle § 81 vs. § 83:</b> Eltern: <b>ein Fünftel</b> ruft ein, <b>zwei</b> Vertreter, <b>dreimal</b> im Jahr. Schüler: <b>ab Jahrgang 4</b>, <b>zwei</b> Sprecher, <b>zwei Stunden je Schulmonat</b> frei. Die „zwei“ kommt in beiden vor, das „dreimal“ nur bei den Eltern.` ] },

    { id: "pflicht", wer: "BbgSchulG Teil 3 und Teil 4 · Schulstruktur und Schulpflicht · F 19 bis 25", titel: "Sechs Jahre Grundschule, zehn Jahre Schulpflicht",
      kurz: `Die Struktur (§§ 15 bis 17) erklärt die Dauer der Schulpflicht (§ 38): Grundschule (Jahrgangsstufen 1 bis 6) plus ein Bildungsgang der Sekundarstufe I (7 bis 10) ergibt zehn Jahre Vollzeitschulpflicht. Wann sie beginnt, steht in § 37; für wen sie gilt, in § 36.`,
      bloecke: [
        { h4: "Schulstruktur", ftag: "F 20 · 21", dl: [
          { dt: "§ 15 innere Organisation", dd: `Wird durch die <b>Bildungsgänge</b> geprägt. Jeder Bildungsgang hat gemeinsame Bildungsziele für alle Schülerinnen und Schüler.` },
          { dt: "§ 16 äußere Organisation", dd: `Gliederung nach <b>Schulstufen und Jahrgangsstufen</b>: Jahrgangsstufen <b>1 bis 6 = Primarstufe</b>, <b>7 bis 10 = Sekundarstufe I</b>, gymnasiale Oberstufe + berufliche Schulen = <b>Sekundarstufe II</b>.` },
          { dt: "Schulformen", dd: `Grundschule; weiterführende allgemeinbildende Schule (<b>Gesamtschule, Gymnasium, Oberschule</b>); berufliche Schule (Oberstufenzentrum); Förderschule; Schule des 2. Bildungsweges.` },
          { dt: "§ 17 Abschlüsse und Berechtigungen", ftag: "F 21", dd: `Hauptschulabschluss/Berufsbildungsreife; erweiterter Hauptschulabschluss/erweiterte Berufsbildungsreife; Realschulabschluss/Fachoberschulreife; Berechtigung zum Besuch der gymnasialen Oberstufe; Fachhochschulreife; allgemeine Hochschulreife/Abitur; Berufsabschluss nach Berufsbildungsgesetz oder Handwerksordnung in schulischer Form; schulischer Teil eines solchen Berufsabschlusses; Berufsabschluss nach Landesrecht; Fachschulabschluss; Abschluss der Schule mit dem sonderpädagogischen Förderschwerpunkt „Lernen“. Jeder Abschluss hat zwei Namen (Schulname/Reifename), z. B. Realschulabschluss = Fachoberschulreife.` } ] },
        { h4: "§ 36 BbgSchulG: Grundsätze", ftag: "F 23", dl: [
          { dt: "Abs. 1", dd: `<q>Die allgemeine Schulpflicht gewährleistet die schulische Erziehung und Bildung jedes jungen Menschen. Schulpflichtig ist, wer im Land Brandenburg seine Wohnung oder seinen gewöhnlichen Aufenthalt oder seine Ausbildungs- oder Arbeitsstätte hat. Völkerrechtliche Abkommen und zwischenstaatliche Vereinbarungen bleiben unberührt.</q> Drei Anknüpfungspunkte: <b>Wohnung, gewöhnlicher Aufenthalt, Ausbildungs- oder Arbeitsstätte</b>.` },
          { dt: "Abs. 2", dd: `<q>Schulpflichtig sind auch die ausländischen jungen Menschen, denen aufgrund eines Asylantrags der Aufenthalt im Land Brandenburg gestattet ist oder die hier geduldet werden.</q>` } ] },
        { h4: "§ 37 BbgSchulG: Beginn der Schulpflicht", ftag: "F 24", dl: [
          { dt: "Vor Beginn", dd: `<q>Vor Beginn der Schulpflicht besteht für alle Kinder die Pflicht, an einer schulärztlichen Untersuchung durch die Gesundheitsämter und zum Beginn des der Einschulung vorhergehenden Schuljahres an einer Sprachstandsfeststellung teilzunehmen.</q> Zwei Pflichten vor der Schule: <b>schulärztliche Untersuchung</b> (Gesundheitsamt) und <b>Sprachstandsfeststellung</b> (ein Jahr vorher).` },
          { dt: "Regelkinder", dd: `Kinder, die <b>bis zum 30. September</b> das <b>sechste</b> Lebensjahr vollendet haben, werden <b>am 1. August desselben Kalenderjahres</b> schulpflichtig.` },
          { dt: "Antragskinder", dd: `Kinder, die <b>vom 1. Oktober bis 31. Dezember</b> sechs werden, werden <b>auf Antrag der Eltern</b> aufgenommen; der Antrag braucht <b>Nachweise über den Entwicklungsstand</b> des Kindes.` } ] },
        { h4: "§ 38 BbgSchulG: Dauer und Erfüllung der Vollzeitschulpflicht", ftag: "F 25", dl: [
          { dt: "Zehn Jahre", dd: `Pflicht zum Besuch des <b>Bildungsgangs der Grundschule</b> und <b>eines Bildungsgangs der Sekundarstufe I</b> (gemäß § 36) → Vollzeitschulpflicht = <b>10 Jahre</b> (gemäß § 38).` },
          { dt: "Befreiung", dd: `<q>In begründeten Einzelfällen kann eine Schülerin oder ein Schüler nach der Jahrgangsstufe 8 und nach neun Schulbesuchsjahren auf Antrag der Eltern von der Vollzeitschulpflicht befreit werden, wenn der weitere Schulbesuch eine Förderung nicht mehr erwarten lässt und eine gleichwertige berufliche Förderung möglich ist.</q> Vier Bedingungen: nach Jahrgangsstufe 8 <b>und</b> nach neun Schulbesuchsjahren <b>und</b> Antrag der Eltern <b>und</b> keine Förderung mehr zu erwarten, aber gleichwertige berufliche Förderung möglich.` } ] },
      ],
      kritikAn: null, kritikSelbst: null, kritikIdee: null,
      fallen: [
        `<b>Datums-Falle § 37:</b> Stichtag ist der <b>30. September</b>, Beginn der <b>1. August</b>, Alter <b>sechs</b>. Antragskinder sind vom <b>1. Oktober bis 31. Dezember</b> geboren. Ein Kind, das am 15. Oktober sechs wird, ist <b>nicht</b> automatisch schulpflichtig, die Eltern müssen beantragen (F 24).`,
        `<b>Zahlen-Falle § 38:</b> „nach der Jahrgangsstufe <b>8</b>“ und „nach <b>neun</b> Schulbesuchsjahren“ sind zwei verschiedene Zahlen, und beide müssen erfüllt sein. Die Vollzeitschulpflicht selbst dauert <b>zehn</b> Jahre (F 25).` ] },

    { id: "verhaeltnis", wer: "BbgSchulG Teil 5 · Schulverhältnis · F 26 bis 41", titel: "Schulverhältnis: Rechte, Pflichten, Zeugnisse und die Treppe der Ordnungsmaßnahmen",
      kurz: `Was Schüler dürfen und müssen (§§ 44, 46, 47), wie Leistung bewertet wird (§§ 57/58) und was die Schule tun darf, wenn Regeln gebrochen werden (§§ 63/64). Der Kern für die Klausur: Erziehung geht vor Ordnung, und für jede Ordnungsmaßnahme gibt es genau eine zuständige Stelle.`,
      bloecke: [
        { h4: "§ 44 BbgSchulG: Rechte und Pflichten aus dem Schulverhältnis", ftag: "F 27", dl: [
          { dt: "Anspruch (Abs. 2)", dd: `Schülerinnen und Schüler haben <b>Anspruch auf Unterricht und Ferien in sinnvollen Abständen</b>.` },
          { dt: "Pflicht (Abs. 3)", dd: `<q>Die Schülerinnen und Schüler sind insbesondere verpflichtet, regelmäßig am Unterricht und an sonstigen für verbindlich erklärten Schulveranstaltungen teilzunehmen sowie die für verbindlich erklärten Arbeiten und die Hausaufgaben anzufertigen.</q>` },
          { dt: "Außerdem", dd: `Pflicht zur Teilnahme an <b>Tests, Untersuchungen und Befragungen</b>.` } ] },
        { h4: "Fallbeispiel: Nichtversetzung bei Schweigen im Unterricht", ftag: "F 28 · 29", text: `Ein Oberstufenschüler (Jahrgangsstufe 12) hat in 4 Fächern „mangelhaft“, unter anderem wegen der Teilnote „sonstige Mitarbeit“, und wird nicht versetzt. Seine Klage hatte keinen Erfolg (Verwaltungsgericht Aachen, 22.09.2010). Begründung: Es ist <b>nicht Aufgabe der Lehrkräfte, Leistungen im Bereich der sonstigen Mitarbeit aktiv vom Schüler zu verlangen</b>. Schüler sind selbst verpflichtet, an ihrer Bildung mitzuwirken (das ist § 44 Abs. 3). Wer kaum oder gar nicht mitarbeitet, darf mit „mangelhaft“ oder schlechter bewertet werden.` },
        { h4: "§ 46 BbgSchulG: Informations- und Beteiligungsrechte", ftag: "F 30 · 31", dl: [
          { dt: "Recht auf Information und Beratung", dd: `Für Eltern und Schüler, zu Schulangelegenheiten wie: Aufbau und Gliederung der Schule und der Bildungsgänge; Lernentwicklung, Leistungsstand, Arbeits- und Sozialverhalten; Leistungsbewertung und Versetzung; Maßnahmen bei Entwicklungsauffälligkeiten und Lernschwierigkeiten.` },
          { dt: "Unterricht besuchen", dd: `Eltern haben das Recht, <b>nach vorheriger Anmeldung</b> und unter Berücksichtigung der pädagogischen Situation der Klasse Unterricht zu besuchen.` },
          { dt: "Volljährige Schüler", ftag: "F 31", dd: `Eltern dürfen sich über den schulischen Ausbildungsweg informieren. Auskünfte (z. B. Leistungsstand) nur, wenn der Schüler die <b>Erlaubnis</b> gibt (Recht auf Verweigerung); über die Verweigerung werden die Eltern informiert. <b>Ausnahme:</b> Über wichtige persönliche schulische Angelegenheiten sollen Eltern <b>unabhängig von der Erlaubnis</b> informiert werden, z. B. bei bevorstehender oder erfolgter <b>Entlassung</b>, <b>schwerwiegendem Fehlverhalten</b>, <b>langanhaltenden unentschuldigten Fehlzeiten</b>.` } ] },
        { h4: "§ 47 BbgSchulG: Meinungsfreiheit, Werbung und Zuwendungen Dritter", ftag: "F 32", dl: [
          { dt: "Abs. 1 Meinungsfreiheit", dd: `<q>Jede Schülerin und jeder Schüler hat das Recht, in der Schule die eigene Meinung in Wort, Schrift und Bild frei zu äußern.</q> Auch im sachlichen Zusammenhang zum Unterricht. Schranken: allgemeine Gesetze, Jugendschutz, Recht auf persönliche Ehre, gesetzlicher Auftrag der Schule.` },
          { dt: "Abs. 2 Politische Werbung", dd: `<q>Politische Werbung ist während des Schulbetriebs nicht gestattet.</q>` },
          { dt: "Abs. 4 Sponsoring", dd: `Schulen dürfen Spenden und Zuwendungen mit dem Ziel der Werbung oder Öffentlichkeitsarbeit (<b>Sponsoring</b>) annehmen, unter Beachtung der Rechte der Schulträger. Der Erziehungs- und Bildungsauftrag darf nicht beeinträchtigt werden.` } ] },
        { h4: "§§ 57/58 BbgSchulG: Leistungsbewertung, Versetzung, Zeugnisse", ftag: "F 34 bis 38", dl: [
          { dt: "Wie bewertet wird", ftag: "F 34", dd: `Durch <b>Noten, Punkte oder schriftliche Informationen zur Lernentwicklung</b> (Klasse 1 und Schulen mit Förderschwerpunkt geistige Entwicklung). Die Bewertung bezieht sich auf die <b>im Unterricht vermittelten</b> Kenntnisse, Fähigkeiten und Fertigkeiten; Leistungsstand der Lerngruppe und des Individuums werden berücksichtigt.` },
          { dt: "Verwaltungsvorschriften", ftag: "F 35 · 36", dd: `<b>VV-Zeugnisse</b> (24.11.2011): Gestaltung der Formulare, Unterschriftsberechtigung, Eintragung, Ausgabe und Verwahrung; besondere Vorschriften für einzelne Zeugnisarten. <b>VV-Leistungsbewertung</b> (21.07.2011): Grundlagen der Leistungsbewertung, gilt für Primarstufe, Sek I, gymnasiale Oberstufe, Förderschwerpunkt „Lernen“ und berufliche Bildungsgänge.` },
          { dt: "Drei Zeugnisarten", ftag: "F 38", dd: `<b>Abschlusszeugnis</b>: ein Bildungsgang wurde erfolgreich abgeschlossen (außer in der Grundschule). <b>Abgangszeugnis</b>: ein Bildungsgang wird nach Erfüllung der Schulpflicht verlassen, ohne Abschlusszeugnis. <b>Überweisungszeugnis</b>: Schulwechsel innerhalb einer Schulstufe. Zeugnis oder Bescheinigung gibt es am Ende jedes Schuljahres und Schulhalbjahres.` } ] },
        { h4: "§§ 63/64 BbgSchulG: Erziehungs- und Ordnungsmaßnahmen, Grundsätze", ftag: "F 40 · 41", dl: [
          { dt: "Zweck", dd: `Sicherung des gesetzlichen Auftrags der Schule und <b>Schutz von Personen und Sachen</b>.` },
          { dt: "Erziehung vor Ordnung", dd: `<q>Erziehungsmaßnahmen richten sich vor allem an die Einsicht der Schülerinnen und Schüler und gehen in der Regel Ordnungsmaßnahmen vor.</q>` },
          { dt: "Verboten", dd: `<q>Die körperliche Züchtigung sowie andere entwürdigende Maßnahmen sind verboten.</q>` },
          { dt: "Wann eine Ordnungsmaßnahme zulässig ist", dd: `Nur wenn <b>schwerwiegend</b> gegen Rechtsvorschriften, Verwaltungsvorschriften oder die Ordnung der Schule verstoßen wurde <b>und</b> eine Erziehungsmaßnahme sich als wirkungslos erwiesen hat oder nicht geeignet ist. Zwei Bedingungen, beide nötig.` },
          { dt: "Anhörung", ftag: "F 41", dd: `<b>Schüler oder Schülerin ist vor der Entscheidung anzuhören!</b> (Sprechblase auf der Folie.)` } ] },
        { h4: "§ 64 Abs. 2: die sechs Ordnungsmaßnahmen und wer entscheidet", ftag: "F 41", tabelle: { kopf: ["Nr.", "Ordnungsmaßnahme", "Wer entscheidet"], zeilen: [
          ["1", "schriftlicher Verweis", "Klassenlehrerin oder Klassenlehrer, in besonders schweren Fällen die <b>Klassenkonferenz</b>"],
          ["2", "Überweisung in eine parallele Klasse oder Unterrichtsgruppe", "<b>Konferenz der Lehrkräfte</b>"],
          ["3", "vorübergehender Ausschluss vom Unterricht oder von einzelnen schulischen Veranstaltungen <b>bis zu zwei Wochen</b>", "<b>Klassenkonferenz</b>"],
          ["4", "Überweisung in eine andere Schule", "<b>staatliches Schulamt</b> auf Antrag der Konferenz der Lehrkräfte"],
          ["5", "Entlassung von einer Schule", "<b>staatliches Schulamt</b> auf Antrag der Konferenz der Lehrkräfte"],
          ["6", "Verweisung von allen Schulen in öffentlicher Trägerschaft des Landes, <b>nach Ablauf der Schulpflicht</b>", "staatliches Schulamt auf Antrag der Konferenz der Lehrkräfte <b>mit Zustimmung des Ministeriums</b>"] ] },
          hint: "Merkhilfe: Stufe 1 bis 3 bleibt in der Schule (Klassenlehrer, Konferenz der Lehrkräfte, Klassenkonferenz), ab Stufe 4 entscheidet das Schulamt, bei Stufe 6 kommt das Ministerium dazu." },
      ],
      kritikAn: null, kritikSelbst: null,
      kritikIdee: { punkte: [
        `<b>Aus Folie 40 ableitbar:</b> Das Gesetz zählt die sechs Ordnungsmaßnahmen genau auf, sagt aber nicht, was eine „Erziehungsmaßnahme“ ist. Gerade die Stufe, die „in der Regel vorgeht“, bleibt im Wortlaut offen, obwohl sie Voraussetzung für jede Ordnungsmaßnahme ist.`,
        `<b>Aus Folie 29 ableitbar:</b> § 44 Abs. 3 verpflichtet zur Mitarbeit, und das Gericht sagt, Lehrkräfte müssen Leistungen nicht aktiv abrufen. Zusammen mit § 46 (Beratungspflicht bei Lernschwierigkeiten, F 30) entsteht eine Spannung: Wo endet die Beratungspflicht der Schule und wo beginnt die Eigenverantwortung des Schülers?` ] },
      fallen: [
        `<b>Zuständigkeits-Falle:</b> Der Ausschluss <b>bis zu zwei Wochen</b> ist Sache der <b>Klassenkonferenz</b>. Die <b>Überweisung in eine parallele Klasse</b> macht die <b>Konferenz der Lehrkräfte</b>. Der <b>schriftliche Verweis</b> kommt vom <b>Klassenlehrer</b>. Alles, was die Schule verlässt (andere Schule, Entlassung, Verweisung), entscheidet das <b>Schulamt</b>, nie die Schule allein (F 41).`,
        `<b>Zeugnis-Falle:</b> <b>Abgangs</b>zeugnis heißt: gegangen <b>ohne</b> Abschluss (nach Erfüllung der Schulpflicht). <b>Abschluss</b>zeugnis heißt: Bildungsgang geschafft, aber nicht in der Grundschule. <b>Überweisungs</b>zeugnis nur beim Schulwechsel <b>innerhalb einer Schulstufe</b> (F 38).` ] },

    { id: "lehrkraefte", wer: "BbgSchulG Teil 6 § 67 · Fortbildung · Aufsichtspflicht · F 42 bis 51, 65 bis 74", titel: "Lehrkräfte: in eigener Verantwortung, aber mit Pflichten",
      kurz: `§ 67 gibt Lehrkräften pädagogische Freiheit und verlangt zugleich, dass sie unterrichten, erziehen und sich ständig fortbilden. Dazu kommt die Aufsichtspflicht (§ 146, VV-Aufsicht), die zu den Dienstpflichten gehört und im Einzelfall entschieden wird.`,
      bloecke: [
        { h4: "Wer ist Lehrkraft?", ftag: "F 43 · 44", dl: [
          { dt: "Definition", dd: `<q>Lehrkraft ist, wer an einer Schule selbstständig Unterricht erteilt.</q> Lehrkräfte haben eine besondere Verantwortung und diverse Pflichten, die gesetzlich klar geregelt sind.` },
          { dt: "Was Lehrkräfte sollten", dd: `<b>Wissen</b>, was im Schulgesetz und den ergänzenden Verordnungen und Erlassen steht; es <b>anwenden</b> können; sich über alle rechtlichen Bestimmungen mit Schulbezug <b>informieren</b>.` } ] },
        { h4: "§ 67 BbgSchulG: Rechte und Dienstpflichten", ftag: "F 45 · 46", dl: [
          { dt: "Abs. 2 Unterrichten und erziehen", dd: `<q>Die Lehrkräfte unterrichten und erziehen in eigener Verantwortung im Rahmen der Bildungs- und Erziehungsziele sowie der Rechts- und Verwaltungsvorschriften und der Beschlüsse der schulischen Gremien.</q> Das ist Recht und Pflicht zugleich (F 45 und F 46 zitieren denselben Absatz).` },
          { dt: "Pädagogische Freiheit", ftag: "F 45", dd: `<q>Ihre pädagogische Freiheit darf nicht unnötig oder unzumutbar eingeschränkt werden.</q>` },
          { dt: "Abs. 3 Fortbildung", ftag: "F 46", dd: `<q>Die Lehrkräfte aktualisieren ständig ihre Kenntnisse und Fähigkeiten und können auch in der unterrichtsfreien Zeit in angemessenem Umfang zu Fortbildungsmaßnahmen herangezogen werden.</q> Fortbildungsangebote des Landes stehen bei freien Kapazitäten auch Lehrkräften an Ersatzschulen offen.` } ] },
        { h4: "Fortbildungspflicht: Grundlagen und Länder", ftag: "F 48 bis 51", dl: [
          { dt: "BbgLeBiG § 9", ftag: "F 48", dd: `Brandenburgisches Lehrerbildungsgesetz, Abschnitt 3: Die Fortbildung <q>dient der Erhaltung, der Festigung und der Erweiterung der in Ausbildung und Berufspraxis erworbenen Kenntnisse und Fähigkeiten</q>. Ziel: die Qualifikationen den sich verändernden Rahmenbedingungen und Anforderungen des Berufs anpassen.` },
          { dt: "Wer kontrolliert? (KMK-Tabelle)", ftag: "F 49", dd: `Die Tabelle „Verantwortlich für die Umsetzung der Fortbildungsverpflichtung“ zeigt je Land Kreuze. Für <b>Brandenburg (BB, rot markiert): Schulaufsicht und Schulleitung</b>. Baden-Württemberg: nicht formal, vorrangig über kooperative Personalführung durch die Schulleitung. Bayern: Schulleitung und andere, Überprüfung in der periodischen dienstlichen Beurteilung.` },
          { dt: "Bundesweit", ftag: "F 50", dd: `Professionelle Weiterentwicklung ist Aufgabe von Lehrkräften und <b>bundesweit allgemeine Fortbildungspflicht</b> (Avenarius & Füssel 2010; DVLfB 2018). Nur in <b>drei Ländern (HH, HB, BY)</b> gibt es konkrete Angaben zum zeitlichen Umfang (Richter et al. 2012, 2013). In einigen Ländern Nachweispflicht, z. T. als <b>Portfolio</b> (z. B. Sachsen-Anhalt). Schulleitungen müssen <b>schulinterne Fortbildungspläne</b> erstellen, die den Qualifikationsbedarf der Einzelschule berücksichtigen (Richter 2016; DVLfB 2018).` } ] },
        { h4: "Die drei Länder mit Zeitumfang", ftag: "F 51", tabelle: { kopf: ["Bundesland", "Umfang der Fortbildungspflicht", "Nachweis"], zeilen: [
          ["Hamburg", "<b>30 h pro Jahr</b>", "in Form eines <b>Portfolios</b>"],
          ["Bremen", "<b>30 h pro Jahr</b>", "wird gefordert, keine Formvorgabe"],
          ["Bayern", "<b>12 Tage</b> (à 5 h je 60 min.) <b>über 4 Jahre</b>", "wird gefordert, keine Formvorgabe"] ] },
          hint: "Quelle auf der Folie: Kuschel et al. 2020. Nur Hamburg schreibt die Form (Portfolio) vor." },
        { h4: "Rolle der Schulleitung", ftag: "F 65 · 66", dl: [
          { dt: "Mitarbeitergespräche mit Portfolio", dd: `Schulleitungen gehen auf Professionalisierungsbedarfe ein (Bayern, Hessen, Mecklenburg-Vorpommern, Sachsen-Anhalt, Thüringen).` },
          { dt: "Überprüfung der Fortbildungsverpflichtung", dd: `Berlin, <b>Brandenburg</b>, Bremen, Hamburg, Hessen, Mecklenburg-Vorpommern, Thüringen.` },
          { dt: "Anordnung einer Fortbildung", dd: `Schulleitungen sind dazu berechtigt in Bremen, Hessen, Rheinland-Pfalz, Schleswig-Holstein, Sachsen-Anhalt, Thüringen. <b>Brandenburg steht hier nicht.</b>` } ] },
        { h4: "Aufsichtspflicht", ftag: "F 68 bis 71", dl: [
          { dt: "Weite Begriffe", ftag: "F 68", dd: `Die Ländervorschriften verwenden weitgefasste Begriffe: <b>Gefährdung, Entwicklungsstand, Verantwortungsbewusstsein</b>. Ob eine Verletzung vorliegt, kann nur <b>im konkreten Einzelfall</b> unter Berücksichtigung aller Umstände entschieden werden (Böhm, Grundkurs Schulrecht I).` },
          { dt: "§ 146 BbgSchulG und VV-Aufsicht (VVAUFs)", ftag: "F 71", dd: `Die Verwaltungsvorschrift steht auf Grundlage des § 146. Abs. 1: <q>Die Fürsorge- und Aufsichtspflicht umfasst angemessene Maßnahmen, Vorkehrungen und Anordnungen, die zu treffen sind, um die Schülerinnen und Schüler vor Schaden zu bewahren und zu verhindern, dass andere Personen durch sie Schaden erleiden. Sie gehört zu den Dienstpflichten der Lehrkräfte und zu den Aufgaben anderer mit der Durchführung oder Begleitung schulischer Veranstaltungen beauftragter Personen.</q> Zwei Richtungen: Schüler <b>vor</b> Schaden bewahren und Schaden <b>durch</b> Schüler verhindern.` },
          { dt: "Geltungsbereich (Screenshot)", ftag: "F 69", dd: `Gilt an Schulen in öffentlicher Trägerschaft. <b>Auf dem Schulweg</b> (Wohnung oder Hort ↔ Schule) ist <b>grundsätzlich keine Aufsicht</b> auszuüben. Aufsicht gilt (a) auf dem <b>Unterrichtsweg</b> zwischen Orten schulischer Veranstaltungen, (b) eine angemessene Zeit <b>vor, nach und zwischen</b> Veranstaltungen (Pausen, Unterrichtsausfall, Freistunden), (c) <b>in</b> der Veranstaltung. Sie besteht gegenüber allen <b>minderjährigen</b> sowie volljährigen geistig behinderten Schülern; sonstige Volljährige haben nur Anspruch auf <b>Fürsorge</b> (Hinweis auf Gefahren). <b>Keine Aufsichtspflicht</b>, wenn sich der Schüler unerlaubt entfernt oder die Eltern sich schriftlich mit dem Verzicht einverstanden erklärt haben.` },
          { dt: "§ 67 Abs. 2 als Grundlage", ftag: "F 70", dd: `Lehrkräfte unterrichten und erziehen in eigener Verantwortung, das schließt die Aufsicht ein.` } ] },
        { h4: "Zwei Fallbeispiele mit gegensätzlichem Ausgang", ftag: "F 72 bis 74", dl: [
          { dt: "Radiergummi, erblindetes Auge (BGH 1972)", ftag: "F 72", dd: `Klassenlehrerin fällt aus; der Schulleiter ordnet an, dass die nebenan unterrichtende Kollegin die achte Klasse mit beaufsichtigt. Sie öffnet beide Türen, ist kurz im Raum, dann übernehmen die Klassensprecher. Es kommt zur Kreide-, Bleistift- und Radiergummischlacht, eine Schülerin verliert das Augenlicht. <b>BGH: Der Schulleiter</b> hat seine Pflicht verletzt, für genügende Beaufsichtigung zu sorgen; die Entwicklung war vorherzusehen und zu verhindern.` },
          { dt: "Steinwürfe vom Schulhof", ftag: "F 73 · 74", dd: `Grundschüler werfen in der Pause Steine in den Pool des Nachbarn; die Aufsicht führende Lehrerin achtet vor allem auf die Kletteranlage; die Frau des Nachbarn hatte mehrfach Lehrerinnen am Zaun hingewiesen. <b>Klage abgewiesen:</b> <q>Das Ausmaß der notwendigen Beaufsichtigung ist von den konkreten Umständen des Einzelfalls abhängig.</q> Grundschulkindern wird ein Unrechtsbewusstsein zugetraut; eine permanente und vollständige Überwachung aller Kinder ist unmöglich; es besteht keine Pflicht, Beschwerden weiterzuleiten; der Nachbar hätte die Beschwerde direkt bei der Schulleitung vortragen müssen.` } ] },
      ],
      kritikAn: null, kritikSelbst: null,
      kritikIdee: { punkte: [
        `<b>Aus Folie 49 und 51 ableitbar:</b> Brandenburg hat eine Fortbildungspflicht (§ 67 Abs. 3) ohne Zeitumfang und ohne Formvorgabe; kontrolliert wird sie durch Schulaufsicht und Schulleitung. Eine Pflicht, die niemand messen kann, ist schwer zu prüfen und schwer einzuklagen.`,
        `<b>Aus Folie 72 und 74 ableitbar:</b> Zwei Fälle, zwei Ergebnisse: einmal haftet der Schulleiter, einmal wird die Klage abgewiesen. „Einzelfall“ (F 68) heißt für die Lehrkraft auch Rechtsunsicherheit: Sie weiß vorher nicht sicher, wie viel Aufsicht genug ist.` ] },
      fallen: [
        `<b>Länder-Falle:</b> Hamburg und Bremen haben beide <b>30 h pro Jahr</b>, aber nur <b>Hamburg</b> verlangt ein <b>Portfolio</b>. Bayern hat <b>12 Tage über 4 Jahre</b>. Die Fortbildungspflicht gilt <b>bundesweit</b>, nur diese drei Länder nennen einen Zeitumfang (F 50, 51).`,
        `<b>Wege-Falle:</b> Auf dem <b>Schulweg</b> (nach Hause) gibt es keine Aufsichtspflicht, auf dem <b>Unterrichtsweg</b> (zwischen zwei Veranstaltungsorten) schon (F 69). Und: Die Aufsichtspflicht steht in § <b>146</b> und der VV-Aufsicht, nicht in § 67 (F 71).` ] },

    { id: "neutral", wer: "Beamtenrecht und Politikdidaktik · Mythos Neutralitätsgebot · F 52 bis 64", titel: "Neutralität: Mäßigung ja, Schweigen nein",
      kurz: `<q>Eine völlige Pflicht zur Neutralität leitet sich nicht ab.</q> (F 56) Lehrkräfte müssen ihre Meinung mäßigen (BeamtStG § 33 Abs. 2), nicht verbergen. Sie dienen dem ganzen Volk, nicht einer Partei (§ 33 Abs. 1). Der Beutelsbacher Konsens sagt, wie man politisch unterrichtet, ohne zu überwältigen.`,
      bloecke: [
        { h4: "Die zwei Fragen der Folie", ftag: "F 53", dl: [
          { dt: "Frage 1", dd: `<q>Wie ist das Verhältnis von Meinungsfreiheit (Art. 5 GG) zu schulischer Neutralitätspflicht in politischen Diskussionen geregelt?</q>` },
          { dt: "Frage 2", dd: `<q>Verstößt das Anbringen politischer Sticker auf dem Laptop, der Trinkflasche oder anderen persönlichen Gegenständen einer Lehrkraft im Unterricht gegen das Neutralitätsgebot bzw. stellt es unzulässige politische Werbung gemäß § 47 Abs. 2 BbgSchulG dar?</q>` } ] },
        { h4: "Was das Recht sagt", ftag: "F 54 bis 57, 61", dl: [
          { dt: "Art. 5 GG (Screenshot)", ftag: "F 54", dd: `Abs. 1: Jeder hat das Recht, seine Meinung in Wort, Schrift und Bild frei zu äußern. Abs. 2: Schranken sind die allgemeinen Gesetze, der Jugendschutz und das Recht der persönlichen Ehre.` },
          { dt: "BeamtStG § 33 Abs. 2: Mäßigung", ftag: "F 56", dd: `<q>Beamtinnen und Beamte haben bei politischer Betätigung diejenige Mäßigung und Zurückhaltung zu wahren, die sich aus ihrer Stellung gegenüber der Allgemeinheit und aus der Rücksicht auf die Pflichten ihres Amtes ergibt.</q> Folgerung der Folie: Die persönliche Meinung muss <b>nicht völlig verborgen oder unterdrückt</b>, sondern <b>im angemessenen Umfang gemäßigt</b> werden.` },
          { dt: "Wrase 2020", ftag: "F 56", dd: `<q>Es ist [...] nicht nur zulässig [Recht auf Meinungsfreiheit GG §5], sondern im Sinne des politischen Bildungs- und Erziehungsauftrags sinnvoll [Vermeidung des Eindruckes von Anteilslosigkeit], dass Pädagog*innen in Diskussionen auch eigene Positionen vertreten, soweit sie die Schüler*innen damit nicht einseitig beeinflussen.</q>` },
          { dt: "BeamtStG § 33 Abs. 1: Unparteilichkeit", ftag: "F 61", dd: `<q>Beamtinnen und Beamte dienen dem ganzen Volk, nicht einer Partei. Sie haben ihre Aufgaben unparteiisch und gerecht zu erfüllen und ihr Amt zum Wohl der Allgemeinheit zu führen.</q> Sie müssen sich zur freiheitlichen demokratischen Grundordnung bekennen und für sie eintreten. <b>Gilt ebenso für nicht verbeamtete Lehrkräfte.</b> Ermöglicht durch <b>Art. 7 Abs. 1 GG</b> (Aufsicht des Staates). Zweck: einer einseitigen Beeinflussung von Kindern und Jugendlichen durch die im staatlichen Auftrag Erziehenden vorbeugen.` },
          { dt: "§ 4 BbgSchulG (Screenshot)", ftag: "F 57", dd: `Abs. 1: Die Schule trägt zur Achtung und Verwirklichung der Werteordnung des Grundgesetzes und der Landesverfassung bei. Abs. 2: Sie achtet das Recht und die Pflicht der Eltern zur Erziehung und fördert Werte und Eigenverantwortung.` },
          { dt: "Aus dem bpb-Artikel (Screenshots)", ftag: "F 55 · 58 bis 60", dd: `Der Rechtswissenschaftler Joachim Wieland spricht vom <b>„Mythos“</b> Neutralität. Verletzt wird das Gebot, wenn Lehrkräfte <b>einseitig oder provokativ für eine bestimmte politische Auffassung oder Partei werben</b>, auch bei Anti-Werbung gegen demokratische Parteien. Eine <b>kritische Auseinandersetzung</b> mit politischen Positionen, besonders mit rechtspopulistischen, diskriminierenden und rassistischen, ist dagegen <b>durch den Bildungsauftrag ausdrücklich gefordert</b> (F 60). Lehrkräfte dürfen weder im noch außerhalb des Unterrichts Parteipolitik betreiben; für angestellte Lehrkräfte gilt im Wesentlichen das Gleiche (F 55).` } ] },
        { h4: "Beutelsbacher Konsens (1976)", ftag: "F 62 · 63", dl: [
          { dt: "Herkunft", dd: `Entstanden auf einer Tagung von Politikdidaktiker*innen im Ort Beutelsbach. Gilt heute als <b>didaktisches Grundprinzip</b> politischer Bildung.` },
          { dt: "1 · Überwältigungsverbot", dd: `<q>Schüler*innen dürfen nicht im Sinne erwünschter Meinungen beeinflusst oder überrumpelt werden.</q> Einfach: keine Indoktrination.` },
          { dt: "2 · Kontroversitätsgebot", dd: `<q>Was in Wissenschaft und Politik kontrovers ist, muss auch im Unterricht kontrovers dargestellt werden.</q>` },
          { dt: "3 · Schülerorientierung (Lernendenorientierung)", dd: `<q>Schüler*innen sollen befähigt werden, politische Situationen und die eigene Interessenlage zu analysieren, sowie Möglichkeiten der Einflussnahme im Sinne eigener Interessen zu erkennen und zu nutzen.</q>` },
          { dt: "Rechtliche Bedeutung", ftag: "F 63", dd: `Die Rechtsprechung bezieht sich <b>nicht direkt</b> auf die drei Prinzipien. Dennoch gilt als implizite Regel: <q>Je weniger die Prinzipien des Beutelsbacher Konsenses beachtet werden, desto wahrscheinlicher liegt eine einseitige Beeinflussung vor</q>, ggf. ein Verstoß gegen das Gebot politischer Mäßigung und Zurückhaltung.` } ] },
      ],
      kritikAn: null, kritikSelbst: null,
      kritikIdee: { punkte: [
        `<b>Aus Folie 60 und 56 ableitbar:</b> Zwei Gebote ziehen in verschiedene Richtungen. Das Mäßigungsgebot (§ 33 Abs. 2 BeamtStG) sagt: zurückhalten. Der Bildungsauftrag (F 60) sagt: rechtspopulistische und diskriminierende Positionen kritisch bearbeiten. Folie 63 gibt die Brücke: Wer die Beutelsbacher Prinzipien beachtet (kontrovers darstellen, nicht überwältigen), bleibt auf der sicheren Seite.`,
        `<b>Aus Folie 53 und 32 ableitbar:</b> § 47 Abs. 2 („Politische Werbung ist während des Schulbetriebs nicht gestattet“) steht im Schüler-Paragrafen. Folie 53 fragt aber nach Stickern einer <b>Lehrkraft</b>. Die Folien geben darauf keine ausdrückliche Antwort; der Weg führt über § 33 BeamtStG und F 59 (einseitiges oder provokatives Werben für eine Partei).` ] },
      fallen: [
        `<b>Müssen-vs-dürfen-Falle:</b> „Lehrkräfte <b>müssen</b> politisch neutral sein“ ist falsch. Richtig: Sie <b>dürfen</b> eigene Positionen vertreten, müssen aber <b>Mäßigung und Zurückhaltung</b> wahren und dürfen nicht einseitig beeinflussen (F 56). Abs. 1 = Unparteilichkeit (dem ganzen Volk dienen), Abs. 2 = Mäßigung bei politischer Betätigung (F 56, 61).`,
        `<b>Beutelsbach-Falle:</b> Der Konsens ist ein <b>didaktisches Prinzip</b>, kein Gesetz; Gerichte beziehen sich nicht direkt darauf (F 63). Und es sind <b>drei</b> Prinzipien: Überwältigungsverbot, Kontroversitätsgebot, Schülerorientierung. „Neutralitätsgebot“ ist keines davon.` ] },

          { dt: "Introjiziert", dd: "Stufe 2 extrinsisch: die Erwartung ist verinnerlicht, aber nicht angenommen („introjizieren\" = etwas in sich hineinnehmen). <q>Ich erledige das, weil es eben dazugehört.</q>" },

          { dt: "Integriert", dd: "Stufe 4 extrinsisch: passt zu meinen eigenen Werten. <q>Ich arbeite an dieser Aufgabe, weil ich es wichtig finde.</q>" },
          { dt: "Intrinsische Motivation", dd: "die Tätigkeit selbst ist der Grund. <q>Ich löse eine Aufgabe, weil es mir Spaß macht und mich interessiert.</q>" } ] },
      ],
      kritikAn: null, kritikSelbst: null,
      kritikIdee: { punkte: [
        "<b>Aus Folie 10 und 11 ableitbar:</b> Folie 10 sagt pauschal „extrinsisch → geringe Ausdauer, geringes Interesse\". Folie 11 zeigt aber, dass identifizierte und integrierte Motivation direkt neben der intrinsischen stehen. „Extrinsisch = schlecht\" ist nach dem eigenen Kontinuum der Folien zu grob.",
        "<b>Naheliegend:</b> Die Stufen werden über Beispielsätze erklärt, nicht über Kriterien. Ob „weil ich es wichtig finde\" integriert oder schon identifiziert ist, lässt sich aus dem Satz allein kaum entscheiden." ] },
      fallen: [
        "<b>Reihenfolge:</b> external → introjiziert → identifiziert → integriert. „Ich lerne, weil ich einen Abschluss machen möchte\" ist <b>identifiziert</b> (nicht intrinsisch, nicht integriert). „…weil es eben dazugehört\" ist <b>introjiziert</b> (nicht external).",
        "<b>Amotivation ist nicht extrinsisch.</b> Sie steht links außerhalb des Balkens „Extrinsische Motivation\" (F 11). Ein Distraktor nennt sie „fünfte Stufe extrinsischer Motivation\"." ] },

    { id: "absinken", wer: "Motivationsentwicklung · Fredricks & Eccles 2002, Havighurst 1972, Eccles et al. 1993 · F 12 bis 16", titel: "Motivation sinkt im Schulverlauf, und zwar aus zwei Gründen",
      kurz: "Grundschulkinder sind oft intrinsisch motiviert, in der Sekundarstufe sinkt das ab. Die Folien geben zwei Erklärungen: eine aus der Entwicklung des Jugendlichen, eine aus der fehlenden Passung zwischen Jugendlichem und Schule.",
      bloecke: [
        { h4: "Befund", ftag: "F 12 · 13 · 15", dl: [
          { dt: "Fredricks & Eccles 2002", dd: "<q>Während Grundschulkinder häufig intrinsisch motiviert sind, nimmt diese Form der Motivation im Laufe der Jahre ab.</q> Zwei Diagramme von Klasse 3 bis 12: Wichtigkeit und Interesse Mathematik (F 12), Interesse und Wichtigkeit Sport (F 13). Das Interesse fällt durchgehend; die Wichtigkeit Mathematik fällt bis etwa Klasse 9 und steigt danach leicht wieder." },
          { dt: "Besonders stark im Jugendalter", dd: "Anderman & Midgley 1997; Jacobs et al. 2002 (F 15)." } ] },
        { h4: "Erklärung 1: entwicklungspsychologisch", ftag: "F 15", dl: [
          { dt: "Entwicklungsaufgaben der Adoleszenz (Havighurst 1972)", dd: "Die Bedeutung der Schule nimmt ab, weil Jugendliche andere Aufgaben bewältigen müssen: <b>Autonomieentwicklung</b> (Beziehungen zu Lehrkräften und Eltern verändern sich, Ablösung vom Elternhaus), <b>zunehmende Bedeutsamkeit von Peerbeziehungen</b>, <b>Identitätsfindung</b> (Definition der eigenen sozialen Rolle), <b>Entwicklung persönlicher Werte und Moralvorstellungen</b>. Die Folie schreibt „Havinghurst\"." } ] },
        { h4: "Erklärung 2: sozialkognitiv", ftag: "F 16", dl: [
          { dt: "Stage-Environment-Fit Theory (Eccles et al. 1993; Eccles & Roeser 2009)", dd: "<b>Mangelnde Passung zwischen Person und Umwelt.</b> Nach dem Übergang in die Sekundarstufe passt das Autonomiebedürfnis der Adoleszenz nicht zu den Merkmalen der Lernumgebung: <b>neue Lehrkräfte, neue Klassenzusammensetzungen, größere Klassen; stärkere Orientierung an Kompetenz und Leistung; abnehmende Qualität der Lehrer-Schüler-Beziehung</b>. Einfach: Der Jugendliche will mehr Freiheit, die Schule gibt gleichzeitig weniger." } ] },
      ],
      kritikAn: null, kritikSelbst: null,
      kritikIdee: { punkte: [
        "<b>Aus dem PISA-Diagramm ableitbar (PDF 37, ohne Foliennummer):</b> PISA zeigt, dass Freude und Interesse an Mathematik auch <b>zwischen den Jahrgängen</b> 2003, 2012 und 2022 sinken, bei gleicher Altersgruppe. Entwicklungsaufgaben allein (F 15) können das nicht erklären, dort geht es um das Alter, nicht um die Zeit.",
        "<b>Aus Folie 16 ableitbar:</b> Stage-Environment-Fit nennt strukturelle Ursachen (größere Klassen, neue Lehrkräfte). Die Unterrichtsmerkmale ab F 20 setzen bei der einzelnen Lehrkraft an, die diese Strukturen nicht ändern kann." ] },
      fallen: [ "<b>Zwei Erklärungen, zwei Etiketten:</b> Havighurst = <b>entwicklungspsychologisch</b> (Entwicklungsaufgaben). Eccles = <b>sozialkognitiv</b> (Stage-Environment-Fit, Passung). Ein Distraktor hängt die Passungstheorie an Havighurst oder nennt Stage-Environment-Fit „entwicklungspsychologisch\"." ] },

    { id: "sdt", wer: "Deci & Ryan · Selbstbestimmungstheorie der Motivation · F 18", titel: "Drei Grundbedürfnisse: Autonomie, Kompetenz, Eingebundenheit",
      kurz: "Die Kernfolie der Sitzung. Menschen haben drei psychologische Grundbedürfnisse. Werden sie im Unterricht erfüllt, entsteht intrinsische Motivation. Das ist die Antwort auf die Frage von F 17: Wie kann Unterricht dem Absinken entgegenwirken?",
      bloecke: [
        { h4: "Die drei Grundbedürfnisse", ftag: "F 18", dl: [
          { dt: "1 · Bedürfnis nach Autonomie", dd: "<q>Bedürfnis nach Gefühl, selbst Ursprung des Handelns zu sein</q>. Einfach: Ich entscheide selbst, was ich tue." },
          { dt: "2 · Bedürfnis nach Kompetenz", dd: "<q>Gefühl, kompetent zu sein: Situationen erfahren, in denen man das eigene Können zeigen kann</q>. Einfach: Ich kann etwas, und ich darf es zeigen." },
          { dt: "3 · Bedürfnis nach Eingebundenheit", dd: "<q>Gefühl der Zugehörigkeit, Interesse an der eigenen Person erfahren</q>. Einfach: Ich gehöre dazu, jemand interessiert sich für mich." },
          { dt: "Folge", dd: "<q>Befriedigung der Grundbedürfnisse fördert intrinsische Motivation</q>." } ] },
        { h4: "Wie die Bedürfnisse in den Unterricht kommen", ftag: "F 19 bis 22", text: "Jedes Grundbedürfnis bekommt ein Unterrichtsmerkmal: Autonomie → Autonomieförderung (F 20), Kompetenz → Kompetenzerleben fördern (F 21), Eingebundenheit → <b>Unterstützendes Klima</b> (F 22, Untertitel „Soziale Eingebundenheit fördern durch…\"). Die Grafik auf F 19 zeigt genau diese drei Kästen mit Pfeil auf „Intrinsische Motivation\"." },
      ],
      kritikAn: null, kritikSelbst: null,
      kritikIdee: { punkte: [
        "<b>Aus Folie 7 und 8 ableitbar:</b> Lernmotivation hat laut Spinath mehrere Konstrukte (Interesse, Erwartungen und Werte, Ziele, Leistungsmotiv). Die Selbstbestimmungstheorie deckt nur den Teil intrinsisch/extrinsisch ab; Erfolgserwartung und Wertüberzeugung (F 8) erklärt sie nicht.",
        "<b>Aus Folie 16 ableitbar:</b> Wenn die Schule nach dem Übergang strukturell weniger Autonomie bietet (größere Klassen, Leistungsorientierung), reicht die Bedürfnisbefriedigung durch eine einzelne Lehrkraft nur begrenzt." ] },
      fallen: [ "<b>Es sind drei, nicht vier oder fünf.</b> „Persönliche Relevanz\" und „Motivationsförderliches Feedback\" sind <b>Unterrichtsmerkmale</b> (F 28), keine Grundbedürfnisse. „Leistung\" kommt in der Liste gar nicht vor. Und das dritte heißt <b>Eingebundenheit</b>, nicht „Klima\": Klima ist das Unterrichtsmerkmal dazu." ] },

    { id: "merkmale", wer: "Deci & Ryan 2000, Hartinger 2006, Klieme et al. 2006, Lazarides, Juang & Ittel 2015, Lipowsky 2015 · F 19 bis 28", titel: "Fünf Merkmale motivationsförderlichen Unterrichts",
      kurz: "Die Grafik „Was fördert Motivation im Unterricht?\" wächst über drei Folien: drei Kästen (F 19), vier (F 23), fünf (F 28). Am Ende: Autonomie, Kompetenz, Unterstützendes Klima, Persönliche Relevanz, Motivationsförderliches Feedback → intrinsische Motivation.",
      bloecke: [
        { h4: "Die fünf Merkmale und ihre Konkretisierung", tabelle: { kopf: ["Merkmal", "Konkret im Unterricht", "Quelle · Folie"], zeilen: [
          ["<b>Autonomie</b>", "Mitbestimmungsmöglichkeiten (z. B. Auswahl des Lernstoffes); Freiräume (z. B. Projektunterricht); selbstständige Wahl von Aufgaben; je nach Leistungsniveau offene Lerngelegenheiten; Kritikförderung durch Diskussionsformate, offene Fragen, Raum für Kritik und Nachfragen", "Schiefele 2015 · F 20"],
          ["<b>Kompetenz</b>", "Leistungsrückmeldungen, regelmäßiges und aufgabenbezogenes Feedback; Übersicht über eigenen Lernfortschritt (Lerntagebücher, Portfolios); Aufgabenklarheit, Verständlichkeit der Lehrinhalte; kompetenzförderliches Feedback", "Deci & Ryan 2004 · F 21"],
          ["<b>Unterstützendes Klima</b>", "= soziale Eingebundenheit fördern: zugewandtes, interessiertes, anteilnehmendes Verhalten; partnerschaftliches Verhältnis, z. B. gemeinsame Festlegung von Klassenregeln für wertschätzenden, respektvollen Umgang", "Deci & Ryan 2004 · F 22"],
          ["<b>Persönliche Relevanz</b>", "Bezug der Lerninhalte zur Lebenswelt der SuS; persönliche, gesellschaftliche oder berufliche Dimension einbeziehen; Aufgaben in alltagsbezogene Kontexte einbetten; gegenwärtige und zukünftige Bedürfnisse abdecken", "Stuckey et al. 2014 · F 24"],
          ["<b>Motivationsförderliches Feedback</b>", "feed up, feed back, feed forward; günstige Attribution", "Hattie & Timperley 2007, Weiner, Schuster 2017 · F 29 bis 31 (eigene Karte)"] ] },
          hint: "Die ersten drei Merkmale heißen auf den Folien „Anwendung der Selbstbestimmungstheorie der Motivation im Unterricht\" (F 20 bis 22). Relevanz und Feedback stehen unter einer anderen Überschrift: „Der Alltagsbezug im Erwartungs-Wert-Modell\" (F 25, 26)." },
        { h4: "Relevanz: die Studien", ftag: "F 25 (PDF 25 und 26)", dl: [
          { dt: "Schreier et al. 2014, Ergebnisse", dd: "Studie zu relevanzbezogenen Unterrichtsmerkmalen im Mathematikunterricht. <b>„Themeneinführung mit Alltagsbeispielen\"</b> → Abnahme der Kostenüberzeugung. <b>„Demonstration von Sachverbindungen\"</b> (fächerübergreifend) → positiver Zusammenhang mit Wertüberzeugung. <b>„Praxisorientierung im Mathematikunterricht\"</b> → förderte den intrinsischen Wert sowie Wichtigkeits- und Nützlichkeitsüberzeugungen, Abnahme der Kostenüberzeugungen." },
          { dt: "Relevanz-Intervention (Umsetzung)", dd: "Lernende schreiben am Ende der Unterrichtseinheit <b>kurze Texte über die persönliche Relevanz</b> von Aufgaben, Fächern oder Themen. Kette auf der Folie: kurze Intervention → Förderung der Nützlichkeitsüberzeugungen (<q>Der Inhalt ist nützlich für mein Leben, weil…</q>) → höheres Interesse (<q>Die Auseinandersetzung mit dem Lerninhalt macht mir Spaß</q>). Gilt als erfolgreiche Interventionsstrategie." } ] },
        { h4: "ARCS-Modell (Keller 1983)", ftag: "F 27", dl: [
          { dt: "Vier Kriterien relevanten Unterrichts", dd: "<b>Schaffung authentischer Situationen</b> (Anwendungsmöglichkeiten zeigen, Beispiele aus dem realen Leben); <b>gut dosierte Mischung von neuen und vertrauten Informationen</b> (Geschichten um den Lerninhalt mit vertrauten und neuen Kontexten); <b>Personalisieren der vorgestellten Personen</b> (Abstraktheit abbauen, Bezug zu sich selbst erkennen); <b>Schaffung von Spannungssituationen</b> (Ende einer Geschichte offen lassen, szenischer Einstieg). Quelle auf der Folie: Mietzel 2017." } ] },
      ],
      kritikAn: null, kritikSelbst: null,
      kritikIdee: { punkte: [
        "<b>Aus den Relevanz-Folien ableitbar (F 25, PDF 25 und 26):</b> Relevanz wirkt laut Folie über Nützlichkeits- und Wertüberzeugungen, also über das <b>Erwartungs-Wert-Modell</b>, nicht über die drei Grundbedürfnisse. Die Fünferliste auf F 28 mischt damit zwei Theorien, ohne das zu sagen.",
        "<b>Aus Folie 25 ableitbar:</b> Die Belege zur Relevanz stammen aus dem <b>Mathematikunterricht</b>. Ob die Effekte in anderen Fächern gleich ausfallen, sagen die Folien nicht." ] },
      fallen: [
        "<b>Namen zuordnen:</b> Autonomie ↔ Schiefele 2015; Kompetenz und Klima ↔ Deci & Ryan 2004; Relevanz ↔ Stuckey et al. 2014; Studie und Intervention ↔ Schreier et al. 2014; ARCS ↔ Keller 1983 (nach Mietzel 2017). Ein Distraktor hängt ARCS an Deci & Ryan.",
        "<b>„Kollaborative Lernformen\"</b> stehen nur in der Take-Home-Folie (F 38), nicht in der Fünferliste (F 28). Wer sie als sechstes Merkmal der Grafik ankreuzt, liegt daneben." ] },

    { id: "feedback", wer: "Hattie & Timperley 2007, Weiner, Schuster 2017 · Motivationsförderliches Feedback · F 29 bis 31", titel: "Feedback in drei Richtungen und die Kunst der günstigen Ursache",
      kurz: "Das fünfte Merkmal hat zwei Teile. Erstens: Gutes Feedback beantwortet drei Fragen (Ziel, Stand, nächster Schritt). Zweitens: Feedback kann verändern, worauf Lernende ihren Erfolg und Misserfolg zurückführen (Attribution).",
      bloecke: [
        { h4: "Hattie & Timperley 2007: drei Fragen", ftag: "F 29", dl: [
          { dt: "1. feed up", dd: "<q>Was ist das Ziel?</q> Der Zielzustand muss für Lehrperson und Lernende klar sein." },
          { dt: "2. feed back", dd: "<q>Wie geht's voran?</q> Gibt Auskunft über den aktuellen Lernzustand des Lernenden." },
          { dt: "3. feed forward", dd: "<q>Was kommt als Nächstes?</q> Welche weiteren Schritte sind erforderlich, um dem Ziel näher zu kommen." } ] },
        { h4: "Attributionstheorie nach Weiner", ftag: "F 30 (PDF 30)", tabelle: { kopf: ["", "internale Kontrollüberzeugung", "externale Kontrollüberzeugung"], zeilen: [
          ["<b>stabil</b>", "Ursache für das Ergebnis liegt in mir und ist zeitlich überdauernd", "Ursache liegt in Umwelteinflüssen, die ich nicht beeinflussen kann und die zeitlich stabil sind"],
          ["<b>variabel</b>", "Ursache für das Ergebnis liegt in mir und ist zeitlich veränderbar", "Ursache liegt an von mir nicht beeinflussbaren Umwelteinflüssen, die veränderbar sind"] ] },
          hint: "Attribution = Ursachenzuschreibung: Worauf führe ich mein Ergebnis zurück? Internal = in mir, external = außen. Stabil = bleibt so, variabel = kann sich ändern." },
        { h4: "Die Beispielsätze", ftag: "F 30 (PDF 32, 33)", tabelle: { kopf: ["", "Erfolg (PDF 32)", "Misserfolg (PDF 33)"], zeilen: [
          ["internal-stabil", "„In Mathe bin ich einfach richtig gut!\"", "„Mathe kann ich einfach nicht!\""],
          ["internal-variabel", "„Ich hatte mich richtig gut auf den Test vorbereitet.\"", "„Ich hatte keine Lust auf den Test und habe mir auch keine Mühe gegeben.\""],
          ["external-stabil", "„Unsere Lehrerin bewertet immer so freundlich.\"", "„Die Aufgaben, die wir bekommen, sind immer zu schwer!\""],
          ["external-variabel", "„Oh man, war das ein Glück!\"", "„Die Testaufgaben waren dieses Mal ganz unverständlich formuliert!\""] ] } },
        { h4: "Günstige Attribution (Schuster 2017)", ftag: "F 31", dl: [
          { dt: "Ziel", dd: "durch Lern-Feedback der Lehrkräfte <b>SuS-Ursachenzuschreibungen verändern</b>; Motivation durch veränderte Selbstwahrnehmung begünstigen." },
          { dt: "Erfolg", dd: "auf <b>internale und stabile</b> (Begabung) oder <b>internale und variable</b> (Anstrengung/Lernen) Ursachen zurückführen." },
          { dt: "Misserfolg", dd: "auf <b>internale und variable</b> (fehlende Anstrengung/Vorbereitung) oder <b>externale und variable</b> (Schwierigkeit der Aufgaben) Ursachen zurückführen." } ] },
      ],
      kritikAn: null, kritikSelbst: null,
      kritikIdee: { punkte: [
        "<b>Aus Folie 21 ableitbar:</b> Kompetenzförderliches Feedback soll <b>aufgabenbezogen</b> sein. Erfolg auf Begabung zurückzuführen (internal-stabil, laut F 31 günstig) ist aber personenbezogen, nicht aufgabenbezogen. Die beiden Folien passen an dieser Stelle nicht ganz zusammen.",
        "<b>Naheliegend:</b> Misserfolg auf „die Aufgaben waren unverständlich\" zu schieben (external-variabel, laut F 31 günstig) schützt zwar das Selbstbild, gibt dem Lernenden aber keinen Hinweis, was er selbst ändern könnte." ] },
      fallen: [
        "<b>Reihenfolge und Frage:</b> 1. feed <b>up</b> = Ziel, 2. feed <b>back</b> = Stand, 3. feed <b>forward</b> = nächste Schritte. Auf der Folie steht „2. feed back\" links und „1. feed up\" rechts, die Nummer zählt, nicht die Position.",
        "<b>Nie günstig:</b> Misserfolg internal-stabil („Mathe kann ich einfach nicht\"). Und Misserfolg soll auf <b>variable</b> Ursachen gehen, egal ob internal oder external; Erfolg soll <b>internal</b> sein, egal ob stabil oder variabel. Das Schema ist nicht symmetrisch." ] },

      fallen: [ "<b>Take Home ≠ Fünferliste.</b> F 38 nennt vier Dinge in eigenen Worten (Feedback, Mitbestimmung, Lebensweltbezug und authentische Situationen, kollaborative Lernformen). F 28 nennt fünf Merkmale (Autonomie, Kompetenz, Klima, Relevanz, Feedback). Eine Frage kann die eine Liste mit Begriffen der anderen verunreinigen." ] },

<script>
// ============ Hilfen ============
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tw = (s, px) => Math.ceil(String(s).length * px * 0.53) + 4;
const thema = (id) => THEMEN.find((t) => t.id === id);
const ftag = (f) => (f ? ` <span class="f-tag">${esc(f)}</span>` : "");
let zeigeChips = true;

// ============ Layout: zweiseitige Mind-Map ============
// Jeder Knoten kann ein Sprungziel tragen (href) — die Wurzel nicht.
function layoutSide(branches, opt) {
  const out = []; let y = 0;
  for (const b of branches) {
    const titleW = Math.max(tw(b.label, 12.5), b.sub ? tw(b.sub, 10.5) : 0) + 22;
    const titleH = b.sub ? 40 : 28;
    const rows = []; let ry = 0;
    for (const k of b.kinder) {
      const hasGloss = !!k.gloss; const chips = (opt.chips && k.chips) || [];
      const boxW = Math.max(tw(k.label, 12), hasGloss ? tw(k.gloss, 10.5) : 0) + 18;
      const boxH = hasGloss ? 36 : 24;
      const lines = []; let cur = [], curW = 0;
      for (const c of chips) {
        const w = tw(c, 10.5) + 14;
        if (curW + w + 6 > opt.chipMax && cur.length) { lines.push(cur); cur = []; curW = 0; }
        cur.push({ t: c, w }); curW += w + 6;
      }
      if (cur.length) lines.push(cur);
      const chipsH = lines.length ? lines.length * 22 + 2 : 0;
      rows.push({ k, y: ry, boxW, boxH, lines, chipsH });
      ry += boxH + chipsH + 8;
    }
    const kidsH = ry - 8;
    const blockH = Math.max(titleH, kidsH);
    out.push({ b, y, titleW, titleH, rows, kidsH, blockH });
    y += blockH + opt.gap;
  }
  return { blocks: out, h: y - opt.gap };
}

function mindmap(spec, opt) {
  const o = Object.assign({ gap: 26, chipMax: 300, rootW: 190, rootGap: 70, kidGap: 40, pad: 16, chips: true }, opt);
  const L = layoutSide(spec.left, o), R = layoutSide(spec.right, o);
  const sideW = (side) => Math.max(0, ...side.blocks.map((bl) => bl.titleW + o.kidGap + Math.max(0, ...bl.rows.map((r) => Math.max(r.boxW, ...r.lines.map((ln) => ln.reduce((a, c) => a + c.w + 6, 0)))))));
  const wL = sideW(L), wR = sideW(R);
  const H = Math.max(L.h, R.h, 60) + o.pad * 2;
  const cx = o.pad + wL + o.rootGap + o.rootW / 2;
  const W = cx + o.rootW / 2 + o.rootGap + wR + o.pad;
  const cy = H / 2;
  let s = ""; let hlX = null;
  const geo = (z, x, y, w, h, name) => z ? ` data-ziel="${esc(z)}" data-name="${esc(name || "")}" data-x="${x}" data-y="${y}" data-w="${w}" data-h="${h}"` : "";
  const plus = (z, x, y) => (o.notizen && z) ? `<g class="plus" data-ziel="${esc(z)}" transform="translate(${x},${y})"><circle r="8"/><text y="3.5" text-anchor="middle">+</text></g>` : "";
  const wrap = (href, inner, cls, g) => href ? `<a href="${esc(href)}" class="${cls || ""}"${g || ""}>${inner}</a>` : `<g class="${cls || ""}"${g || ""}>${inner}</g>`;
  const drawSide = (S, dir) => {
    const y0 = cy - S.h / 2;
    for (const bl of S.blocks) {
      const col = bl.b.color;
      const tx0 = cx + dir * (o.rootW / 2 + o.rootGap);
      const tx = dir > 0 ? tx0 : tx0 - bl.titleW;
      const ty = y0 + bl.y + bl.blockH / 2 - bl.titleH / 2;
      s += `<g style="--bc:${col}" class="${bl.b.stub ? "stub" : ""}">`;
      const rx = cx + dir * (o.rootW / 2), tX = tx0, tY = ty + bl.titleH / 2;
      s += `<path class="edge" stroke="${col}" d="M${rx},${cy} C${rx + dir * 30},${cy} ${tX - dir * 30},${tY} ${tX},${tY}"/>`;
      let inner = `<rect class="box" x="${tx}" y="${ty}" width="${bl.titleW}" height="${bl.titleH}" rx="6"/>`
        + `<text class="bt" x="${tx + bl.titleW / 2}" y="${ty + (bl.b.sub ? 17 : 18)}" text-anchor="middle">${esc(bl.b.label)}</text>`
        + (bl.b.sub ? `<text class="gloss" x="${tx + bl.titleW / 2}" y="${ty + 31}" text-anchor="middle">${esc(bl.b.sub)}</text>` : "");
      const isHl = (o.hl && bl.b.id === o.hl) || !!bl.b.hl;
      if (isHl) hlX = tx + bl.titleW / 2;
      s += wrap(bl.b.href, inner, isHl ? "hl" : "", geo(bl.b.ziel, tx, ty, bl.titleW, bl.titleH, bl.b.label)) + plus(bl.b.ziel, tx + bl.titleW, ty);
      const kx0 = dir > 0 ? tx + bl.titleW + o.kidGap : tx - o.kidGap;
      const ky0 = y0 + bl.y + bl.blockH / 2 - bl.kidsH / 2;
      const fromX = dir > 0 ? tx + bl.titleW : tx;
      for (const r of bl.rows) {
        const bx = dir > 0 ? kx0 : kx0 - r.boxW, by = ky0 + r.y;
        const eY = by + r.boxH / 2;
        s += `<path class="edge" stroke="${col}" d="M${fromX},${tY} C${fromX + dir * 20},${tY} ${kx0 - dir * 20},${eY} ${kx0},${eY}"/>`;
        let kin = `<rect class="box" x="${bx}" y="${by}" width="${r.boxW}" height="${r.boxH}" rx="5"/>`
          + `<text class="kt" x="${bx + 9}" y="${by + 16}">${esc(r.k.label)}</text>`
          + (r.k.gloss ? `<text class="gloss" x="${bx + 9}" y="${by + 29}">${esc(r.k.gloss)}</text>` : "");
        s += wrap(r.k.href, kin, o.hl && r.k.id === o.hl ? "hl" : "", geo(r.k.ziel, bx, by, r.boxW, r.boxH, r.k.label)) + plus(r.k.ziel, bx + r.boxW, by);
        let ly = by + r.boxH + 4;
        for (const ln of r.lines) {
          let lx = dir > 0 ? bx : bx + r.boxW;
          for (const c of ln) {
            const cxp = dir > 0 ? lx : lx - c.w;
            s += `<rect class="chip" x="${cxp}" y="${ly}" width="${c.w}" height="18" rx="9"/>`;
            s += `<text class="chip-t" x="${cxp + c.w / 2}" y="${ly + 12.5}" text-anchor="middle">${esc(c.t)}</text>`;
            lx += dir * (c.w + 6);
          }
          ly += 22;
        }
      }
      s += "</g>";
    }
  };
  drawSide(L, -1); drawSide(R, 1);
  s += `<rect class="root" x="${cx - o.rootW / 2}" y="${cy - 26}" width="${o.rootW}" height="52" rx="10"${geo(spec.ziel, cx - o.rootW / 2, cy - 26, o.rootW, 52, spec.root[0])}/>` + plus(spec.ziel, cx + o.rootW / 2, cy - 26);
  s += `<text class="root-t" x="${cx}" y="${cy - 3}" text-anchor="middle">${esc(spec.root[0])}</text>`;
  s += `<text class="root-t" x="${cx}" y="${cy + 15}" text-anchor="middle" style="font-size:11.5px;font-weight:500">${esc(spec.root[1])}</text>`;
  return { svg: `<svg viewBox="0 0 ${Math.ceil(W)} ${Math.ceil(H)}" width="${Math.ceil(W)}" role="img" aria-label="${esc(o.aria || "Mind-Map")}">${s}</svg>`, cx, hlX, W, H };
}

// Karte einsetzen und so scrollen, dass die Wurzel (oder der markierte Ast) sichtbar ist
function setzeMap(el, m) {
  el.innerHTML = m.svg;
  // Die Karte wird so weit herausgezoomt, dass sie in die Breite passt (Jennifer, 15.09.).
  // Nur wenn das unter 45 Prozent Groesse waere (Handy), bleibt sie in Originalgroesse und scrollt.
  const svg = el.querySelector("svg");
  if (svg && el.clientWidth && el.clientWidth / m.W >= 0.45) {
    svg.removeAttribute("width"); svg.style.width = Math.round(100 * (el.zoom || 1)) + "%"; el.classList.toggle("passt", (el.zoom || 1) <= 1);
    if ((el.zoom || 1) > 1) { el.scrollLeft = Math.max(0, (m.hlX ?? m.cx) / m.W * el.scrollWidth - el.clientWidth / 2); }
    return;
  }
  el.classList.remove("passt");
  const ziel = m.hlX ?? m.cx;
  const scale = el.clientWidth ? Math.min(1, el.scrollWidth / m.W) : 1;
  el.scrollLeft = Math.max(0, ziel * scale - el.clientWidth / 2);
}

// ============ Ansichten ============
const KURZ = { st1: "ST I", st2: "ST II", st3: "ST III", sq: "Schulqualität", sr: "Schulrecht", um: "Motivation" };

function gesamtSpec() {
  const mk = (t) => ({ id: t.id, label: t.label, sub: t.sub, color: t.color, href: `#thema/${t.id}`, ziel: t.id,
    kinder: t.aeste.map((a) => ({ id: a.id, label: a.label, gloss: a.sub, chips: a.chips, href: `#thema/${t.id}/${a.id}`, ziel: `${t.id}/${a.id}` })) });
  const ids = THEMEN.map((t) => t.id);
  const left = ["st1", "st2", "st3"].filter((i) => ids.includes(i)).map((i) => mk(thema(i)));
  const right = ["sq", "sr", "um"].filter((i) => ids.includes(i)).map((i) => mk(thema(i)));
  return { root: ["Schultheorie &", "Bildungsforschung"], ziel: "gesamt", left, right };
}

// Drei runde Knoepfe je Thema: Hoeren, Aeste-Quiz, Grafik-Quiz, mit gruenem Haken wenn erledigt
function aktionen(track, t) {
  const m = MANIFEST[track]; const da = m && m.dur;
  const hoer = `<a class="rund ${da ? "" : "aus"}" href="#hoeren/${track}" title="${da ? "Anhören · " + minuten(m.dur) : "Noch nicht vertont, nur Text"}">▶${haken("hoeren:" + track)}</a>`;
  const aeste = `<a class="rund" href="#quiz/${t ? t.id : "gesamt"}" title="Äste-Quiz">✎${haken("quiz:" + (t ? t.id : "gesamt"))}</a>`;
  const graf = t ? `<a class="rund ${t.grafiken.length ? "" : "aus"}" href="#thema/${t.id}/grafiken" title="Grafiken ausfüllen">▦${haken("gquiz:" + t.id)}</a>` : `<a class="rund" href="#bquiz/gesamt" title="Begriffe-Quiz">Aa${haken("begriffe:gesamt")}</a>`;
  return `<div class="aktionen">${hoer}${aeste}${graf}</div>`;
}
function viewGesamt(mitMap) {
  const n = THEMEN.reduce((a, t) => a + t.karten.length, 0);
  return `
  <header class="kopf">
    <div class="eyebrow">Schultheorie und Bildungsforschung · Klausur 18.09.</div>
    <h1>Schultheorie-Karte</h1>
    <p class="lead">Alles, was hier steht, steht so auf den Vorlesungsfolien. <b>F 14</b> heißt: Folie 14 der Sitzung. Nur die blau gestrichelten Kästen „nicht auf den Folien" sind Vorschläge für Kritik, die man selbst ableiten kann. Antippen zoomt rein: Thema → Themenkarte → einzelne Karte. Der Zurück-Knopf zoomt wieder raus.</p>
  </header>
  <div class="stufe-kopf"><div class="nr">STUFE 1</div><h2>Die ganze Klausur auf einen Blick</h2>
    <p class="lead">Sechs Oberthemen, ${THEMEN.reduce((a, t) => a + t.aeste.length, 0)} Unterthemen, ${n} Karten. Seitlich scrollen, am Handy zoomen, alles ist antippbar.</p></div>
  ${mitMap ? `<div class="map" id="map-gesamt"></div>` : ""}
  <div class="legende">${THEMEN.map((t) => `<span style="--bc:${t.color}">${esc(t.label)}</span>`).join("")}</div>
  <div class="themen-liste">
    <div class="kachel gesamt" style="--bc:var(--ink)"><a class="titel" href="#hoeren/gesamt"><b>Die ganze Vorlesung in einem Kapitel</b><small>Stufe 1 · ${MANIFEST.gesamt && MANIFEST.gesamt.dur ? minuten(MANIFEST.gesamt.dur) : "Text"} · Karte bleibt verdeckt, am Ende trägst du die sechs Äste ein</small></a>${aktionen("gesamt", null)}</div>
    ${THEMEN.map((t) => `<div class="kachel" style="--bc:${t.color}"><a class="titel" href="#thema/${t.id}"><b>${esc(t.label)}</b><small>${esc(t.sub)} · ${t.aeste.length} Unterthemen, ${t.karten.length} Karten</small></a>${aktionen(trackId(t), t)}</div>`).join("")}
  </div>
  <p class="hint">Schulgeschichte, Unterrichtsqualität und Schulevaluation fehlen absichtlich: laut Rose nicht klausurrelevant, und es gibt dazu keinen Foliensatz.</p>
  <p class="stand">Stand 14.09.2026. Quelle: Vorlesungsfolien „Schultheorie und Bildungsforschung" (Lazarides, Uni Potsdam), jede Angabe mit Folientext und Folienbild abgeglichen. Bei Schulqualität und Schulrecht springen die aufgedruckten Nummern; angegeben ist immer die Nummer, die auf der Folie steht.</p>`;
}

function themaSpec(t) {
  const mk = (a) => ({ id: a.id, label: a.label, sub: a.sub, color: a.color || t.color, href: `#karte/${t.id}/${a.karte}`, ziel: `${t.id}/${a.id}`,
    kinder: a.kinder.map((k, i) => ({ label: k.label, gloss: k.gloss, chips: k.chips, href: `#karte/${t.id}/${k.karte || a.karte}`, ziel: `${t.id}/${a.id}/${i}` })) });
  return { root: [t.label, t.sub], ziel: t.id, left: t.aeste.filter((a) => a.seite !== "right").map(mk), right: t.aeste.filter((a) => a.seite === "right").map(mk) };
}

function viewThema(t, astId, mitMap) {
  return `
  <div class="stufe-kopf" style="--bc:${t.color}"><div class="nr">STUFE 2 · ${esc(t.label).toUpperCase()}</div><h2>${esc(t.sub)}</h2>
    <p class="lead">${t.intro} Folien ${esc(t.folien)}.</p>${aktionen(trackId(t), t)}</div>
  ${mitMap ? `<div class="map" id="map-thema"></div>` : ""}
  <p class="hint">Jeder Knoten in der Karte oben: Fachbegriff, darunter in einfachen Worten, was er meint. Antippen öffnet die Karte dazu.</p>
  <div class="stufe-kopf" style="--bc:${t.color}"><h3>Karten dieses Themas</h3></div>
  <div class="kette" style="--bc:${t.color}">${t.karten.map((k) => `<a href="#karte/${t.id}/${k.id}">${esc(k.titel.split(":")[0])}${MANIFEST && MANIFEST[trackId(t, k)] ? " ▶" : ""}</a>`).join("")}<a href="#alle/${t.id}">Alle untereinander</a></div>
  ${t.grafiken.length ? `<div class="stufe-kopf" style="--bc:${t.color}"><div class="mit-quiz"><h3>Die Grafiken der Folien, nachgezeichnet</h3>${haken("gquiz:" + t.id) ? '<i class="haken statisch" title="alle Grafiken richtig ausgefüllt">✓</i>' : `<span class="hint">${t.grafiken.filter((_, i) => erledigt(`gquiz:${t.id}:${i}`)).length} von ${t.grafiken.length} gelöst</span>`}</div></div>
  <div class="grafiken" id="grafiken">${t.grafiken.map((g, i) => grafikHtml(t, i)).join("")}</div>` : ""}
  <div class="sprung" style="--bc:${t.color}"><a href="#gesamt">‹ Gesamtkarte</a><a class="primaer" href="#karte/${t.id}/${t.karten[0].id}">Erste Karte ›</a></div>`;
}

function block(b) {
  let inner = "";
  if (b.dl) inner = `<dl>${b.dl.map((d) => `<div><dt>${esc(d.dt)}${ftag(d.ftag)}</dt><dd>${d.dd}</dd></div>`).join("")}</dl>`;
  if (b.tabelle) inner = `<div class="tabelle"><table><thead><tr>${b.tabelle.kopf.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.tabelle.zeilen.map((z) => `<tr>${z.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if (b.text) inner = `<p class="text">${b.text}</p>`;
  return `<div class="block"><h4>${esc(b.h4)}${ftag(b.ftag)}</h4>${inner}${b.hint ? `<p class="hint">${b.hint}</p>` : ""}</div>`;
}

function kritikBox(titel, k, cls, leerText) {
  if (!k) return leerText ? `<div class="kritik leer"><h4>${esc(titel)}</h4><ul><li>${leerText}</li></ul></div>` : "";
  return `<div class="kritik ${cls || ""}"><h4>${esc(k.titel || titel)}${ftag(k.ftag)}${cls === "idee" ? '<span class="tag">nicht auf den Folien</span>' : ""}</h4><ul>${k.punkte.map((p) => `<li>${p}</li>`).join("")}</ul></div>`;
}

// ============ Karten-Quiz: Fragenzahl je Karte ============
// data/karten-fragen.json (scripts/baue-karten-fragen.py) liegt neben dem Trainer:
// je Karte die freien Fragen-Ids, `gruppen` = Zahl verschiedener Fragen. Ohne die
// Datei gibt es einfach keine Leiste. Einstieg: index.html#quiz/<thema>/<karte>?n=5
let KARTEN_FRAGEN = null;
async function ladeKartenFragen() {
  if (KARTEN_FRAGEN) return KARTEN_FRAGEN;
  try { KARTEN_FRAGEN = await (await fetch("data/karten-fragen.json", { cache: "no-cache" })).json(); } catch (e) { KARTEN_FRAGEN = {}; }
  return KARTEN_FRAGEN;
}
function quizLeiste(t, k) {
  const e = KARTEN_FRAGEN && KARTEN_FRAGEN[`${t.id}/${k.id}`];
  const n = e ? (e.gruppen || 0) : 0;
  if (!n) return "";
  const link = (z) => `<a href="index.html#quiz/${t.id}/${k.id}?n=${z}">${z} Fragen</a>`;
  return `<div class="quiz-leiste"><span class="ico">⏵</span>${link(Math.min(5, n))}${n >= 10 ? link(10) : ""}<span>${n === 1 ? "1 Klausurfrage" : n + " Klausurfragen"} zu dieser Karte im Trainer</span></div>`;
}

function karteHtml(t, k) {
  const name = k.titel.split(":")[0];
  const hatKritik = k.kritikAn || k.kritikSelbst || k.kritikIdee;
  return `<article class="karte" id="k-${esc(k.id)}" style="--bc:${k.color || t.color}">
    <header><div class="wer">${esc(k.wer)}</div><h3>${esc(k.titel)}</h3><p class="kurz">${k.kurz}</p>${playChip(trackId(t, k)) ? `<div class="chips-zeile">${playChip(trackId(t, k))}</div>` : ""}</header>

function parseParas(text) {

    t = t.replace(/^\[aside\]\s*/, () => { aside = true; return ""; });

}

// Welche Grafiken zu einem Kapitel gehoeren: Stufe-3-Kapitel die per [grafik:N] markierten, der Ueberblick nur die uebrigen

function quizNach(info) {

// ============ Grafik-Quiz: die grossen Begriffe einer Grafik ausblenden ============
// Luecken = die fetten Beschriftungen (.bt). Aufeinanderfolgende .bt-Zeilen im selben <g> sind EIN Begriff
// ("Politisches" + "System"). Hoechstens sechs Luecken je Grafik, sonst wird es zu tief.
// Grafik-Luecken: ein Stichwort reicht. Trifft die Eingabe ein langes Wort des Begriffs (ab 7 Zeichen)
// oder die Haelfte seiner Woerter, gilt die Luecke als getroffen ("Wirtschaft" fuer "Wirtschafts- und Beschaeftigungssystem").
function passtLocker(input, begriff) {
  const a = norm(input); if (a.length < 3) return false; if (passt(input, [norm(begriff)])) return true;
  const at = a.split(" "); const wt = norm(begriff).split(" ").filter((w) => w.length >= 4);
  const hit = (w) => at.some((x) => x === w || (x.length >= 5 && (x.includes(w) || w.includes(x))) || lev(x, w) <= Math.floor(w.length / 4));
  const treffer = wt.filter(hit);
  return treffer.some((w) => w.length >= 7) || (wt.length && treffer.length >= Math.ceil(wt.length / 2));
}
function gquizVorbereiten(svgHtml) {

  const gruppen = []; const gesehen = new Set();

  const klasse = svg.querySelectorAll("text.bt").length >= 3 ? "bt" : "kt";
  for (const txt of svg.querySelectorAll(`text.${klasse}`)) {
    if (gesehen.has(txt)) continue;

    const begriff = teile.map((x) => x.textContent.trim()).join(" ").replace(/\s+/g, " ");
    if (begriff.length < 3 || /^[\d\s.,:;–-]+$/.test(begriff)) continue;
    gruppen.push({ begriff, teile });

  const wahl = gruppen.length > 6 ? gruppen.sort(() => Math.random() - 0.5).slice(0, 6) : gruppen;
  wahl.forEach((g, i) => { g.nr = i + 1; g.teile.forEach((x, j) => { x.textContent = j === 0 ? `(${g.nr})` : ""; x.classList.add("luecke"); }); });

}

// ============ Begriffe-Quiz je Hoerkapitel: Gruppen mit 2 bis 4 Saetzen, Begriff eintragen ============
const begriffeFuer = (track) => BEGRIFFE[track] || [];

function passtBegriff(v, it) {

  const num = (it.begriff.match(/\b(\d+)\b/) || [])[1];
  if (num && /^(§|art\.?|artikel|paragraf)/i.test(it.begriff)) return (norm(v).match(/\b\d+\b/g) || []).includes(num);

// ============ Notizen: an Dinge geheftet (Thema, Unterthema, Begriff) oder frei auf einer Karte ============
// ziel = "st1" | "st1/parsons" | "st1/parsons/2" | "frei:gesamt" | "frei:thema:st1". Eine Notiz an "st1" erscheint
// in der Gesamtkarte am Ast Schultheorie I UND in der Themenkarte an der Wurzel (Vererbung in beide Richtungen).
let NOTIZEN_AN = lesen("notizenAn", false);

const CFG = window.ST_CONFIG || {};
const NOTIZ_RAUM = "rose";
const notizRemote = () => !!(CFG.supabaseUrl && CFG.supabaseAnonKey && CFG.syncCode);   // auf localhost aus (Testschutz)
const notizHdr = () => ({ apikey: CFG.supabaseAnonKey, Authorization: "Bearer " + CFG.supabaseAnonKey, "Content-Type": "application/json" });

async function notizenLaden() {
  if (!notizRemote()) return;
  try {
    const r = await fetch(`${CFG.supabaseUrl}/rest/v1/karten_notizen?raum=eq.${NOTIZ_RAUM}&select=id,ziel,text,x,y,deleted,updated`, { headers: notizHdr() });
    if (!r.ok) return;
    const fern = await r.json(); let geaendert = false;
    for (const f of fern) {
      const ts = Date.parse(f.updated); const l = NOTIZEN.find((n) => n.id === f.id);
      if (!l || ts > (l.updated || 0)) { const n = { id: f.id, ziel: f.ziel, text: f.text, x: f.x, y: f.y, deleted: f.deleted, updated: ts }; if (l) Object.assign(l, n); else NOTIZEN.push(n); geaendert = true; }
    }
    if (geaendert) { notizenLokal(); notizenZeichnen(); }
  } catch (e) {}
}
async function notizSenden(n) {
  if (!notizRemote()) return;
  try { await fetch(`${CFG.supabaseUrl}/rest/v1/karten_notizen`, { method: "POST", headers: { ...notizHdr(), Prefer: "resolution=merge-duplicates" }, body: JSON.stringify({ id: n.id, raum: NOTIZ_RAUM, ziel: n.ziel, text: n.text, x: n.x, y: n.y, deleted: !!n.deleted }) }); } catch (e) {}
}

}
