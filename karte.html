      kritikAn: null, kritikSelbst: null, kritikIdee: null, fallen: [] },

    { id: "comenius", wer: "Jan Amos Comenius (1592 bis 1670) · 17. Jahrhundert · F 3 bis 9", titel: "Comenius: Allen alles lehren, weil alle Ebenbild Gottes sind",
      kurz: "Philosoph, Theologe und Pädagoge mit Kontakt zu Descartes, schreibt während des Dreißigjährigen Kriegs (1618 bis 1648). Philosophie soll politisch wirken, für eine bessere Gesellschaft (F 3). Hauptwerk: <b>Didactica Magna 1657</b> (F 4).",
      bloecke: [
        { h4: "Menschenbild", ftag: "F 3 · 4", dl: [
          { dt: "Bestimmung des Menschen", ftag: "F 3", dd: "Alles Existierende hat einen Daseinszweck. Der Mensch ist von Natur aus zum <q>Auszug aus dem Labyrinth der unvollkommenen Welt</q> bestimmt, er soll <b>Vernunftwesen</b> werden, als Ebenbild Gottes." },
          { dt: "Religiöse Denkfiguren", ftag: "F 4", dd: "Sie sind entscheidend für Menschenbild und Bildungsverständnis. Bild eines <b>ursprünglich guten Menschen</b>; Anfang und Ende der Erziehung liegen in Gott." },
          { dt: "Selbstentwicklung mit Anleitung", ftag: "F 4", dd: "Aufgabe des Menschen ist Selbstentwicklung. Erziehung ist nötig, um anzuleiten, und mit <b>methodischem Vorgehen</b> können tatsächlich alle Menschen erreicht werden." },
          { dt: "Alle sollen die Schule besuchen", ftag: "F 4", dd: "Alle Menschen sind Ebenbild Gottes und alle bedürfen Bildung. Folienzitat: <q>Alle Menschen, so sehr sie sich auch in ihren geistigen Anlagen voneinander unterscheiden, haben doch die gleiche Natur</q>." },
          { dt: "Allgemeine Didaktik", ftag: "F 4", dd: "<q>die vollständige Kunst, allen Menschen alles zu lehren auf sichere und vorzügliche Art und Weise</q>. Didaktik = die Lehre vom Lehren." } ] },
        { h4: "Funktion der Schule", ftag: "F 5", dl: [
          { dt: "Werkstätten der Menschlichkeit", dd: "Schulen sind <q>Werkstätten der Menschlichkeit, indem sie eben bewirken, dass der Mensch Mensch werde</q>." },
          { dt: "Allen alles", dd: "In den Schulen soll allen „alles\" gelehrt werden: <b>Sprachen, Wissenschaft, Künste</b>. Zuerst die „Grundlagen der Allgemeinbildung\" (jede Sprache, Wissenschaft und Kunst von den Anfangsgründen aus), später Vertiefung." },
          { dt: "Frontalunterricht", dd: "Der Schwerpunkt liegt auf Frontalunterricht: Es solle <q>nur ein Lehrer einer Schule oder wenigstens einer Klasse vorstehen</q>. Frontal = eine Lehrkraft spricht zu allen." } ] },
        { h4: "Schule: Didaktik und Stufen", ftag: "F 6", dl: [
          { dt: "Didaktik als geordnete Vermittlung", dd: "Der Zögling soll sich durch <b>eigene Anschauung</b> entwickeln und wird selbstständig im Bildungsprozess. Der Mensch strebt <q>von sich selbst heraus nach Wissen</q>." },
          { dt: "Ganzheit auf jeder Stufe", dd: "Nicht stückchenweise Wissen anhäufen, das erst am Ende ein Ganzes ergibt. Jede Entwicklungsstufe vermittelt eine <b>Ganzheit</b>." } ],
        },
        { h4: "Vier Stufen des Unterrichts, je sechs Jahre", ftag: "F 6", tabelle: { kopf: ["Stufe", "Was dort geschieht"], zeilen: [
          ["1 · Mutterschule", "Schärfung der <b>äußeren Sinne</b>"],
          ["2 · Muttersprachenschule", "Übung der <b>inneren Sinne</b>: Rechnen, Lesen, Schreiben, basales religiöses, politisches oder geschichtliches Wissen"],
          ["3 · Lateinschule", "klassische Sprachen und verschiedene Wissenschaften"],
          ["4 · Universität", "aktueller Stand von Wissen und Forschung"] ] },
          hint: "Vier Stufen mal sechs Jahre = 24 Jahre. Die Folie nennt Dauer und Schulformen, keine Altersgrenzen." },
        { h4: "Bildungsbegriff", ftag: "F 7 · 8", dl: [
          { dt: "Drei Ziele von Bildung", ftag: "F 7", dd: "<b>Gelehrige Bildung</b> (Wissen), <b>Bildung zu Sittlichkeit und Tugend</b> (gutes Handeln), <b>Bildung der Frömmigkeit</b> (Glaube). Bildung führt den Menschen aus dem Zustand der „rohen Unvollkommenheit\" heraus." },
          { dt: "Ziel: Menschwerdung", ftag: "F 7", dd: "Ziel von Bildung ist Menschwerdung, das heißt: <q>sich seines Menschseins bewusst werden</q>." },
          { dt: "Wissensvermittlung statt Wissenskonstruktion", ftag: "F 8", dd: "Folienzitat: <q>Kaum gibt es einen so unreinen Spiegel, dass er nicht auf irgendeine Weise Bilder aufnähme, kaum eine so rauhe Tafel, dass sich nicht irgendwie darauf schreiben ließe</q>. Statt konstruktivistischem Verständnis („Schüler konstruieren Wissen selbst\") geht es darum, <b>„den Docht zu entzünden\"</b>: frontale Vermittlung von Wissensinhalten. Bildungsprozesse sind ein <b>„Gebildet-Werden\"</b>." },
          { dt: "Wachs-Metapher", ftag: "F 8", dd: "<q>Das Gehirn gleicht dem Wachs, das es ermögliche dass Abbilder der Dinge dem Gehirn eingedrückt werden</q>. Einfach: Wissen wird eingeprägt, nicht selbst gebaut." } ] },
        { h4: "Kritische Würdigung", ftag: "F 9", dl: [
          { dt: "Das Einende des Menschseins", dd: "Comenius betont, was alle Menschen verbindet, vor aller Verschiedenheit. Gegenwartsbezug: Verantwortung von Schule für <b>chancengleiche Bildung</b> angesichts sozialer Ungleichheiten." },
          { dt: "Vorwegnahme neuzeitlicher Pädagogik", dd: "Konzept einer vernünftigen Bildung als <q>Herauskriechen/Auszug aus der Bewusstlosigkeit gesellschaftlich bedingter Determination</q>. Einfach: Bildung befreit von dem, was die Herkunft vorgibt." },
          { dt: "Methodisierung des Unterrichts", dd: "Maßgeblicher Beitrag dazu, dass Unterricht nach Methode abläuft." } ] },
      ],
      kritikAn: null,
      kritikSelbst: null,
      kritikIdee: { punkte: [
        "<b>Aus Folie 10 und 15 ableitbar (Rousseau):</b> Comenius setzt auf Frontalunterricht und das „Entzünden des Dochts\" (F 5, 8). Rousseau hält dagegen: Schüler müssen den Nutzen eines Gegenstands <b>selbst entdecken</b>, es gibt keinen Zwang zu lernen, und was auf dem Schulhof gelernt wird, ist „hundertmal nützlicher\" als der Unterricht in der Klasse.",
        "<b>Aus Folie 28 ableitbar (Herbart):</b> Die Wachs-Metapher (Abbilder werden eingedrückt, F 8) macht den Lernenden passiv. Herbarts Bildsamkeit sagt: der Mensch <b>bildet sich</b> aktiv. Dass Comenius auf F 6 zugleich „eigene Anschauung\" und Selbstständigkeit nennt, ist eine Spannung in seinem eigenen Konzept.",
        "<b>Aus Folie 33 ableitbar:</b> Die Kritik an Herbarts Formalstufen (stark schematisches Vorgehen widerspricht der Komplexität menschlicher Bildung) lässt sich auf Comenius übertragen, dessen Beitrag laut F 9 gerade die <b>Methodisierung</b> des Unterrichts ist." ] },
      fallen: [
        "<b>Nicht verwechseln:</b> Comenius hat <b>vier Stufen à sechs Jahre</b> mit Schulformen (Mutterschule, Muttersprachenschule, Lateinschule, Universität). Rousseau hat <b>vier Phasen mit Altersgrenzen</b> (5, 12, 15, 20). Taucht „Lateinschule\" oder „sechs Jahre\" auf, ist Comenius gemeint.",
        "<b>Comenius ist kein Konstruktivist.</b> F 8 sagt das ausdrücklich: „Wissensvermittlung statt Wissenskonstruktion\". Eine Option wie „Comenius: Schüler konstruieren ihr Wissen selbst\" ist ein Decoy. Und: <b>drei</b> Ziele der Bildung, nicht vier (vier Kräfte sind Humboldt)." ] },

    { id: "rousseau", wer: "Jean-Jacques Rousseau (1712 bis 1778) · 18. Jahrhundert · F 10 bis 18", titel: "Rousseau: Erziehung soll die natürliche Entwicklung nicht stören",
      kurz: "Vertreter der Aufklärung, Gesellschaftskritiker und Wegbereiter der Französischen Revolution. Sein Erziehungsroman <b>„Émile oder Über die Erziehung\" (1762)</b>. Folienzitat: <q>Was die Schüler auf dem Schulhof untereinander lernen, ist hundertmal nützlicher als alles, was man ihnen in der Klasse sagen kann.</q> (F 10)",
      bloecke: [
        { h4: "Schulkritik", ftag: "F 11", dl: [
          { dt: "Schule befördert Eigennutz, Eitelkeit und Habsucht", dd: "Haltungen, die nach Rousseau in der <b>korrumpierten Gesellschaft</b> insgesamt vorherrschen. Korrumpiert = verdorben." },
          { dt: "Kritik am Katechismusunterricht", dd: "In Schulen sind Schüler <q>daran gewöhnt, Worte auszusprechen, die sie nicht verstehen</q>. Folge: Menschen bleiben <b>unverständig, manipulierbar</b> und dem äußeren Zwang der regierenden Mächte ausgesetzt. Katechismus = Glaubenslehre zum Auswendiglernen." } ] },
        { h4: "Negative Erziehung", ftag: "F 12", dl: [
          { dt: "Was „negativ\" heißt", dd: "Erziehung verfolgt <b>keine positiven (= gesetzten) Zielsetzungen</b>. Sie hat nicht die Absicht, aus dem Zögling etwas Bestimmtes zu machen. Sie zielt nur darauf, dass die <b>natürliche Entwicklung nicht behindert</b> wird. Daraus folgt Kritik am Schulsystem, das zu stark in gesellschaftlich vorgegebene Zwecksetzungen eingebunden ist." },
          { dt: "Schein der Freiheit", dd: "Der Erzieher muss dem Zögling den <q>Schein der Freiheit</q> erhalten, muss aber selbst <b>Herr der Lage</b> sein. Diese Herrschaft ist keine Tyrannei, weil sie den natürlichen Bedürfnissen des Kindes Rechnung trägt." },
          { dt: "Erfahrungen zum Wachsen", dd: "Erziehung ermöglicht dem Zögling, nur solche Erfahrungen zu machen, an denen er wachsen kann." } ] },
        { h4: "Menschenbild", ftag: "F 13", dl: [
          { dt: "Frei, empfindsam, vernünftig", dd: "Der Mensch ist wesentlich frei, empfindsam und vernünftig. Rousseau sucht Bedingungen, unter denen der Heranwachsende sein Wesen, seine Natur sukzessiv verwirklichen kann. Die Entfaltung gipfelt in seiner <b>Vernünftigkeit</b>." },
          { dt: "Das Zitat", dd: "<q>Alles ist gut, wie es aus den Händen des Schöpfers kommt, alles entartet unter den Händen des Menschen</q>." },
          { dt: "Aktiver Erkennender und Handelnder", dd: "Mensch als aktives, intelligentes Sinnes- und Geisteswesen." },
          { dt: "Gesellschaft als entartet", dd: "Die Gesellschaft erzieht nicht zu einer natürlichen Ordnung, in der alle Menschen gleich sind und sich als Gleiche dem Ganzen einordnen. Stattdessen geht es um <b>Herrschen und Beherrscht werden</b>." } ] },
        { h4: "Vier Entwicklungsphasen", ftag: "F 14", tabelle: { kopf: ["Phase", "Im Vordergrund", "Alter"], zeilen: [
          ["1", "<b>Körper</b>", "ca. bis 5. Lebensjahr"],
          ["2", "<b>Sinne</b>", "ca. bis 12. Lebensjahr"],
          ["3", "<b>Geistige Fähigkeiten und Wissenserwerb</b>", "ca. bis 15. Lebensjahr"],
          ["4", "<b>Eingliederung in die Gesellschaft</b>, moralisches und religiöses Bewusstsein", "ca. bis 20. Lebensjahr"] ] },
          hint: "In jeder Phase steht ein Moment der Entwicklung im Vordergrund. Eine der Natur gemäße Erziehung stellt sich auf die jeweils vorherrschenden natürlichen Bedürfnisse ein." },
        { h4: "Konsequenzen für den Unterricht", ftag: "F 15", dl: [
          { dt: "Nicht jeder Gegenstand in jeder Phase", dd: "Der Stoff muss zur Entwicklungsphase passen." },
          { dt: "Nutzen selbst entdecken", dd: "Schüler_innen müssen selbst den Nutzen und Wert des Gegenstandes entdecken können." },
          { dt: "Kein Zwang, aber Arrangement", dd: "Kein Zwang zu lernen. Der Erzieher arrangiert aber Lernumgebung und Erkenntnisprozesse so, dass der Zögling Vernünftiges <b>entdecken</b> kann." } ] },
        { h4: "Kritische Würdigung: Einfluss", ftag: "F 16", dl: [
          { dt: "Kulturpessimismus als Verdienst", dd: "Maßgebliche Bedeutung für schultheoretische Betrachtungen: Rousseau legt die <b>Instrumentalisierung von Erziehung und Bildung für willkürliche Herrschaftsinteressen</b> offen." },
          { dt: "Entdeckendes Lernen, offener Unterricht", dd: "Beeinflusst heutige Diskurse um „entdeckendes Lernen\" und reformpädagogische Bemühungen um offenen Unterricht." } ] },
      ],
      kritikAn: { ftag: "F 16 · 17 · 35", punkte: [
        "<b>Entwicklungsphasen (F 16):</b> aktuelle entwicklungspsychologische Erkenntnisse sprechen gegen die <b>ausschließliche Fokussierung des Körpers</b> in den ersten Lebensjahren.",
        "<b>Geschlechtsspezifische Erziehung (F 17, auf dem Bild mit „19\" beschriftet):</b> Nach Rousseau brauchen Mädchen eine andere Erziehung als Jungen, weil sie „von anderer Natur\" sind. Der Junge: Respekt seines Eigenrechts, kann öffentlichem Urteil Trotz bieten. Die Mädchen: <q>all ihre Launen bezähmen, um sich den Willen anderer zu unterwerfen</q> (Rousseau 1762/1979, S. 483); <q>Fast von Geburt an lieben Mädchen den Putz</q>; die Prinzipien der Wissenschaft seien <q>nicht die Sache der Frauen</q>. Quelle der Kritik: Schmid 1992, „Rousseau Revisited\".",
        "<b>Pädagogische Sonderwelt (F 35):</b> Rousseaus Antwort koppelt pädagogische Bildungsansprüche von den realen gesellschaftlichen Bedingungen ab und erschafft eine „pädagogische Sonderwelt\"." ] },
      kritikSelbst: { ftag: "F 11 · 12 · 13", punkte: [
        "<b>An der Schule (F 11):</b> sie befördert Eigennutz, Eitelkeit und Habsucht; der Katechismusunterricht lässt Worte sprechen, die niemand versteht, und macht manipulierbar.",
        "<b>Am Schulsystem (F 12):</b> es ist zu stark in gesellschaftlich vorgegebene Zwecksetzungen eingebunden.",
        "<b>An der Gesellschaft (F 13):</b> sie ist entartet; statt natürlicher Ordnung unter Gleichen geht es um Herrschen und Beherrscht werden." ] },
      kritikIdee: { punkte: [
        "<b>Aus Folie 29 ableitbar (Herbart):</b> Beim „Schein der Freiheit\" bleibt der Erzieher Herr der Lage und arrangiert alles (F 12, 15). Herbart verlangt dagegen, dass die Lehrperson das Gegenüber <b>nicht nach ihrem Willen formt</b>, sondern anerkennt, dass es sich eigene Zwecke setzt. Rousseaus Freiheit ist also inszeniert.",
        "<b>Aus Folie 13 ableitbar (eigene Folie):</b> Rousseau will eine natürliche Ordnung, „in der alle Menschen gleich sind\". Seine Mädchenerziehung (F 17) widerspricht dem: Frauen sollen sich dem Willen anderer unterwerfen. Sein Menschenbild und seine Erziehungslehre passen nicht zusammen." ] },
      fallen: [
        "<b>„Negative Erziehung\" heißt nicht Strafe und nicht „keine Erziehung\".</b> Es heißt: keine gesetzten Ziele, die natürliche Entwicklung nicht behindern. Der Erzieher ist sehr aktiv, er arrangiert die Lernumgebung (F 12, 15).",
        "<b>Zahlenfalle:</b> Körper bis <b>5</b>, Sinne bis <b>12</b>, Geist bis <b>15</b>, Gesellschaft bis <b>20</b>. Decoys tauschen 5 gegen 6 oder 12 gegen 15. Und: Das sind Entwicklungsphasen nach Alter, keine Unterrichtsstufen (Comenius) und keine Formalstufen (Herbart)." ] },

    { id: "humboldt", wer: "Wilhelm von Humboldt (1767 bis 1835) · 19. Jahrhundert · F 19 bis 25", titel: "Humboldt: Schule als allgemeine Menschenbildung, nicht als Staatsdienst",
      kurz: "Gelehrter und Bildungsreformer, 1809 bis 1810 Leiter der preußischen Sektion für Kultus und Unterricht. Bildung heißt für ihn: Der Mensch bildet seine Kräfte, ohne äußeren Zweck. Die Schule soll ihn zum Menschen machen, nicht zum Bürger oder zur Arbeitskraft.",
      bloecke: [
        { h4: "Bildungsbegriff", ftag: "F 19 bis 21", dl: [
          { dt: "Das Zitat", ftag: "F 19", dd: "<q>Im Mittelpunkt aller besonderer Arten der Thätigkeit nehmlich steht der Mensch, der ohne alle, auf irgend etwas Einzelnes gerichtete Absicht, nur die Kräfte seiner Natur stärken und erhöhen, seinem Wesen Werth und Dauer verschaffen will.</q> Einfach: Bildung hat kein Ziel außerhalb des Menschen. Er stärkt seine Kräfte um ihrer selbst willen." },
          { dt: "Allgemeine Menschenbildung", ftag: "F 20", dd: "besteht darin, <b>dass der Mensch seine Kräfte bildet</b>." },
          { dt: "Formung der Persönlichkeit", ftag: "F 21", dd: "Ideal einer Aufklärung und Kultur umfassenden Formung der Persönlichkeit durch die Entwicklung ihrer Kräfte und den Gewinn von Kenntnissen über die Welt." },
          { dt: "Gesinnung und Charakter", ftag: "F 21", dd: "Bildung als <q>Bildung der Gesinnungen und des Charakters</q>, sie ermöglicht <b>Selbstständigkeit und Freiheit</b>." } ] },
        { h4: "Vier Kräfte", ftag: "F 20", tabelle: { kopf: ["Kraft", "Was sie ist"], zeilen: [
          ["1 · Physische Kraft", "körperliche Vitalität, innerer Antrieb, Energie"],
          ["2 · Denkkraft", "formale Denkstrukturen, Logik"],
          ["3 · Einbildungskraft", "Abbildung der äußeren Welt in sich selbst → ein <b>konsistentes Bild von der Welt</b> erlangen"],
          ["4 · Moralische Kraft", "Fähigkeit zu handeln: Handeln als Reflektieren, sich von <b>reizbedingten Reaktionen distanzieren</b> können"] ] },
          hint: "Einbildungskraft heißt hier nicht Fantasie, sondern: die Welt in sich abbilden." },
        { h4: "Schulkritik und Schulpläne", ftag: "F 22 · 23", dl: [
          { dt: "Ständewesen", ftag: "F 22", dd: "Das vorherrschende Ständewesen bestimmt, welche Bildung Einzelne erfahren: <b>Ritterakademien</b> und <b>Gelehrtenschulen</b> für Adel und Klerus, <b>Dorfschulen</b> für Bauern und Handwerker." },
          { dt: "Der Staat erzieht zum Bürger, nicht zum Menschen", ftag: "F 22", dd: "An existierenden Schulformen wird keine Menschenbildung betrieben, sondern es werden staatsspezifische Interessen verfolgt. Diese Kritik fließt in seine Lehrpläne ein (1809 bis 1810)." },
          { dt: "Königsberger und Litauischer Schulplan 1809", ftag: "F 23", dd: "Konzeption einer allgemeinbildenden Schule. Distanziert sich von staatlichen und gesellschaftlich-ökonomischen Erwartungen an Schule." },
          { dt: "Gegliederte Einheitsschule", ftag: "F 23", dd: "Nicht auf <b>Abnehmerinteressen</b> potentieller Schulabgänger ausgerichtet (also nicht auf das, was Staat und Wirtschaft brauchen), sondern am inneren Entwicklungsgang des Bildungsprozesses." },
          { dt: "Lernen des Lernens", ftag: "F 23", dd: "Ziel von Schule, um frei und unabhängig zu werden: <b>urteilskräftig, ausdrucksfähig, empfindsam und körperlich beweglich</b> → den Menschen zum Menschen machen. Dazu allgemeine Kenntnisse, deren jeder aufgeklärte Mensch und Bürger bedarf." } ] },
        { h4: "Unterricht in drei Stadien", ftag: "F 24", tabelle: { kopf: ["Stadium", "Inhalt"], zeilen: [
          ["1 · Elementarunterricht", "Vermittlung elementarer Kulturtechniken"],
          ["2 · Schulunterricht", "gymnastische, ästhetische und didaktische (mathematische und philosophische) Bildung; Übung der Fähigkeiten und Kenntniserwerb als Grundlage wissenschaftlicher Einsicht"],
          ["3 · Universitätsunterricht", "Ort der freien geistigen Begegnung gebildeter Individuen; angeleitetes Forschen; Unterricht hat keine Grenze, das Ende der mündlichen Anleitung hängt allein vom Subjekt ab; <b>Einheit von Forschung und Lehre</b>"] ] },
          hint: "Schule als Institution allgemeiner, nicht spezifischer Bildung. Auf der Folie steht die Universität oben, der Elementarunterricht unten." },
        { h4: "Kritische Würdigung: Wirkung", ftag: "F 25", text: "Maßgeblicher Einfluss der Idee, Schule aus der Bildung heraus zu entwickeln; breite Wirkung der Humboldt'schen Bildungstradition, <b>besonders auf Gymnasien</b>. Seine Ideen trafen kurzfristig den Nerv der vorrestaurativen Reformzeit in Preußen." },
      ],
      kritikAn: { ftag: "F 25 · 35", punkte: [
        "<b>Nicht umsetzbar (F 25):</b> viele Ideen erschienen damals nicht umsetzbar oder erfuhren massiven Gegenwind durch restaurative Kräfte.",
        "<b>Abstraktion (F 25):</b> Eine Schule, die aus der reinen Idee der Bildung abgeleitet wird, grenzt gesellschaftliche, religiöse, politische und ökonomische Einflusssphären aus. Einfach: Sie tut so, als gäbe es die Welt drumherum nicht.",
        "<b>„Fiktive Innerlichkeit\" (F 25):</b> Die Abtrennung schulischer Bildungsgüter von späterer Verwendbarkeit erwies sich als schwierig und wurde als Abgrenzung zur technisch-ökonomischen Entwicklung kritisiert.",
        "<b>Pädagogische Sonderwelt (F 35):</b> Humboldts Antwort koppelt Bildungsansprüche von realen gesellschaftlichen Bedingungen ab. Die Spannung zwischen gesellschaftlicher Bedingtheit von Schule und individuellen Freiheitsansprüchen bleibt offen." ] },
      kritikSelbst: { ftag: "F 22 · 23", punkte: [
        "<b>Am Ständewesen (F 22):</b> Die Herkunft (Stand) bestimmt, welche Schule man besucht.",
        "<b>Am Staat (F 22):</b> <q>der Staat erziehe zum Bürger nicht zum Menschen</q>; an existierenden Schulen wird keine Menschenbildung betrieben.",
        "<b>An Abnehmerinteressen (F 23):</b> Schule darf sich nicht danach richten, was Staat und Wirtschaft von den Abgängern wollen." ] },
      kritikIdee: null,
      fallen: [
        "<b>Vier Kräfte, drei Stadien.</b> Nicht umgekehrt. Die Kräfte (F 20) sind physisch, Denk-, Einbildungs-, moralische Kraft. Die Stadien (F 24) sind Elementar-, Schul-, Universitätsunterricht.",
        "<b>„Harmonische Ausbildung aller Kräfte\"</b> klingt nach Humboldt, steht aber wörtlich auf der <b>Herbart-Folie 29</b> („ähnlich wie bei Humboldt\"). Humboldts eigene Folien sagen „seine Kräfte bildet\" (F 20). Wer in einer Frage nach dem Folienwortlaut gefragt wird: F 29 ist Herbart." ] },

    { id: "herbart", wer: "Johann Friedrich Herbart (1776 bis 1841; die Folie druckt *1767) · 19. Jahrhundert · F 26 bis 33", titel: "Herbart: erziehender Unterricht für einen Menschen, der sich selbst bildet",
      kurz: "Philosoph, Psychologe, Pädagoge. Unterrichtsentwicklung und didaktische Rezeption orientieren sich an seiner Idee des <b>erziehenden Unterrichts</b>. Er sieht das Verhältnis von Erziehung, Schule, Staat und Gesellschaft als problematisch (F 26).",
      bloecke: [
        { h4: "Menschenbild", ftag: "F 27", dl: [
          { dt: "Innere Freiheit", dd: "Der Mensch besitzt die Fähigkeit zu innerer Freiheit: <q>nicht tun zu müssen, wozu man geneigt ist, sondern die verschiedenen Bestrebungen zu beurteilen und sich bewusst entscheiden zu können</q>. Sie ist Voraussetzung dafür, den eigenen Willen beurteilen zu können." },
          { dt: "Rechtlichkeit und Güte", dd: "Zwei moralische Prinzipien zur Beurteilung des eigenen Willens. <b>Rechtlichkeit</b>: das Gegenüber stets als gleichberechtigt betrachten. <b>Güte</b>: ihm mit Wohlwollen begegnen." } ] },
        { h4: "Bildung und Bildsamkeit", ftag: "F 28 · 29", dl: [
          { dt: "Konzept der Bildsamkeit", ftag: "F 28", dd: "Betont die Selbstbestimmtheit des Menschen. Entwicklung ist <b>weder gänzlich durch natürliche Anlagen noch durch das soziale Umfeld</b> bestimmt, sondern: der <q>Mensch sich bildet</q> (aktiver, sich selbst bildender Mensch). Bildsamkeit = die Fähigkeit, gebildet zu werden und sich zu bilden." },
          { dt: "Idee der Menschenbildung", ftag: "F 28", dd: "Die ursprüngliche <b>Unbestimmtheit</b> des Menschen wird durch Bildung zur Festigung von Persönlichkeit und Charakter geformt: feste Entschlossenheit des Willens, der begründet entscheidet und nicht einseitig gesteuert wird." },
          { dt: "Das Problem der Einflussnahme", ftag: "F 28", dd: "Erziehung ist bewusst gestaltete Einflussnahme auf die Bildsamkeit. Sie muss klären, was ihr legitimes Ziel ist, denn <b>äußere Einflussnahme widerspricht der Selbstbestimmung und Freiheit</b> des Menschen." },
          { dt: "Legitimation durch Rechtlichkeit und Güte", ftag: "F 29", dd: "Pädagogisches Wirken ist legitim, wenn es an Rechtlichkeit und Güte ausgerichtet ist. Wohlwollen heißt hier: Die Lehrperson <b>formt das Gegenüber nicht nach ihrem Willen</b>, sondern anerkennt, dass es sich als bildsames Wesen eigene Zwecke setzt und so seine eigene Bestimmung findet." },
          { dt: "Harmonische Ausbildung aller Kräfte", ftag: "F 29", dd: "Unterricht ist an der „Idee der Menschenbildung\" ausgerichtet: natürliche Begehren sollen <b>vielseitigen Interessen</b> weichen. <q>ähnlich wie bei Humboldt ist die „Harmonische Ausbildung aller Kräfte\" das Ziel von Bildung und Erziehung</q>. Diese Formel steht wörtlich auf der Herbart-Folie." } ] },
        { h4: "Erziehender Unterricht", ftag: "F 30", dl: [
          { dt: "Wozu", dd: "Um das Ziel der „Allgemeinen Menschenbildung\" zu erreichen, wird Unterricht als <b>„erziehender Unterricht\"</b> konzipiert." },
          { dt: "Ästhetische Darstellung der Welt", dd: "Der Zusammenhang zwischen Erkenntnisgegenständen wird zu Bewusstsein gebracht; eine Anhäufung unverbunden nebeneinander stehender Vorstellungen wird vermieden." },
          { dt: "An der Individualität ausgerichtet", dd: "Unterricht knüpft dort an, wo das Individuum aufgrund seiner Anlagen und Erfahrungen steht." },
          { dt: "Mehr als Wissensvermittlung", dd: "Unterricht muss Erwerb von Erkenntnissen <b>und</b> Fähigkeit zur Teilnahme gewährleisten." },
          { dt: "Doppelte Aufgabe", dd: "den <b>Gedankenkreis</b> des Zöglings <b>zu erweitern und zu ordnen</b>. Gedankenkreis = alles, was jemand denkt und weiß." } ] },
        { h4: "Formalstufentheorie", ftag: "F 31", tabelle: { kopf: ["Stufe", "Was geschieht"], zeilen: [
          ["1 · Klarheit", "Lernende setzen sich ein Ziel und verschaffen sich Klarheit über den Lerninhalt"],
          ["2 · Assoziation", "Bildung neuer Begriffe als Wechselwirkung zwischen <b>Anschauung (Erfahrung)</b> und <b>vorhandenen Begriffen (Denken)</b>; beide werden aufeinander bezogen"],
          ["3 · System", "Anschauung und vorhandene Begriffe werden integriert"],
          ["4 · Methode", "Anwendung des veränderten Begriffsumfangs"] ] },
          hint: "Herbart (1806/1965): beim Lernen werden qualitativ unterschiedliche geistige Akte vollzogen, an denen sich Unterricht orientieren sollte. → Konsequenzen für Lehrerausbildung und Schule." },
        { h4: "Schule", ftag: "F 32", dl: [
          { dt: "Über Begehrlichkeiten hinaus", dd: "Unterricht als an praktischen Ideen ausgerichtete Erziehung muss über unmittelbare Begehrlichkeiten und gesellschaftliche Einseitigkeiten hinausführen." },
          { dt: "Bedürfnisse erforschen", dd: "Die Erforschung der Bedürfnisse des Zöglings ist Voraussetzung, um einen Lehrplan zu entwerfen." },
          { dt: "Nicht durch Anordnung", dd: "Erziehung verfährt nicht durch Anordnung, sondern durch ästhetisch darzubietenden Unterricht. Sie schwört nicht auf herrschende Verhältnisse ein, sondern befähigt, <b>aus innerer Einsicht zu handeln</b> und sich zunehmend eigenständig zu bestimmen." } ] },
        { h4: "Kritische Würdigung", ftag: "F 33", dl: [
          { dt: "„Schule heißt Muße\"", dd: "Herbarts schulkritische Äußerungen betonen den pädagogischen Sinn der Schule angesichts gegenläufiger <b>politischer und ökonomischer Einflussnahmen</b>. Muße = freie Zeit zum Nachdenken, kein Nutzdruck." },
          { dt: "Kants Morallogik", dd: "Herbart bezieht sie auf den Kontext der Erziehung: Der Wille führt nicht unmittelbar zur Handlung, sondern nur durch <b>Einsicht</b> → <b>kein Zwang zur Bildung</b>. (Mehr zu Kant steht nicht auf den Folien.)" } ] },
      ],
      kritikAn: { ftag: "F 33", punkte: [
        "<b>Freiwilliger Unterricht?</b> Ist es der Wille des Lernenden, wenn ein Schüler sich entscheidet, nicht am Unterricht teilzunehmen? Entspricht Herbarts Ideen wirklich ein „freiwilliger Unterricht\", oder ist die Pflicht zur Teilnahme nicht auch die moralisch gebotene Forderung, sich selbst zu bilden, um urteilsfähig zu werden?",
        "<b>Formalstufentheorie:</b> stark schematisches Vorgehen im Lehr-Lernprozess widerspricht der Komplexität menschlicher Bildung." ] },
      kritikSelbst: { ftag: "F 26 · 32 · 33", punkte: [
        "<b>Am Verhältnis Erziehung, Schule, Staat, Gesellschaft (F 26):</b> Herbart hält es für problematisch bestimmt.",
        "<b>Am Schulsystem des 19. Jahrhunderts (F 32):</b> Erziehung darf nicht durch Anordnung verfahren und nicht auf die gerade herrschenden Verhältnisse einschwören.",
        "<b>An politischer und ökonomischer Einflussnahme (F 33):</b> „Schule heißt Muße\"; kein Zwang zur Bildung." ] },
      kritikIdee: { punkte: [
        "<b>Aus Folie 28 und 29 ableitbar (eigene Folien):</b> Herbart nennt das Problem selbst: Jede Einflussnahme widerspricht der Selbstbestimmung (F 28). Seine Antwort, Rechtlichkeit und Güte (F 29), ist eine <b>Haltung</b>, kein Verfahren. Woran erkennt eine Lehrkraft in der Praxis, ob sie das Gegenüber „nach ihrem Willen formt\" oder nur seinen Gedankenkreis ordnet (F 30)? Die Grenze bleibt unscharf." ] },
      fallen: [
        "<b>Geburtsjahr:</b> Auf Folie 26 steht für Herbart <b>*1767</b>. Das ist ein Tippfehler auf der Folie, Herbart ist <b>1776</b> geboren. Falls die Klausur das Jahr abfragt, ist 1776 richtig; nicht die Folienzahl auswendig lernen.",
        "<b>Formalstufen sind keine Entwicklungsphasen.</b> Klarheit, Assoziation, System, Methode beschreiben Schritte im Unterricht (F 31). Rousseaus Phasen (F 14) beschreiben das Alter des Kindes. Und die <b>Bildsamkeit</b> (F 28) heißt: weder Anlage <b>noch</b> Umfeld allein bestimmen die Entwicklung. Eine Option „Herbart: die Anlagen bestimmen die Entwicklung\" ist ein Decoy." ] },

    { id: "vergleich", wer: "Zum Schluss · F 34 · 35 Take Home", titel: "Die vier nebeneinander", color: "var(--ink)",
      kurz: "Take Home der Folien: Der neuzeitliche Blick sieht den Menschen im <b>Spannungsfeld von Anlagen und Umwelt</b> und die Schule als <b>Ort allgemeiner Menschenbildung</b>. Alle vier kritisieren den Zugriff gesellschaftlicher Mächte (Kirche, Staat, Ökonomie) auf die Schule und unterscheiden <b>Bildung</b> (allgemeine Menschenbildung) von <b>Ausbildung</b> (berufs- oder standesspezifisch).",
      bloecke: [
        { h4: "Take Home Messages", ftag: "F 34 · 35", dl: [
          { dt: "Anlagen und Umwelt", ftag: "F 34", dd: "Neuzeitliche Betrachtung von Schule und Bildung ist geprägt durch den Menschen im Spannungsfeld von Anlagen und Umwelt. Schule wird als Ort der allgemeinen Menschenbildung betrachtet." },
          { dt: "Kritik am Zugriff der Mächte", ftag: "F 34", dd: "Neuzeitliche Schultheorien kritisieren den Zugriff gesellschaftlicher Mächte auf die Schule (Kirche, Staat, Ökonomie) und problematisieren die <b>institutionelle Organisation der Vergesellschaftung</b> Heranwachsender (die Folie nennt hier <b>Rousseau, Herbart</b>)." },
          { dt: "Bildung vs. Ausbildung", ftag: "F 35", dd: "Unterscheidung zwischen berufs- bzw. standesspezifischer Bildung (Ausbildung) und allgemeiner Menschenbildung (Bildung)." },
          { dt: "Spannung Gesellschaft vs. Freiheit", ftag: "F 35", dd: "Offene Fragen betreffen Spannungen zwischen gesellschaftlichen Bedingtheiten von Schule und individuellen Freiheitsansprüchen (die Folie nennt <b>Humboldt</b>)." },
          { dt: "Pädagogische Sonderwelt", ftag: "F 35", dd: "Die Antworten werfen zum Teil Probleme auf: tendenzielle Abkopplung pädagogischer Bildungsansprüche von realen gesellschaftlichen Bedingungen, eine „pädagogische Sonderwelt\" (die Folie nennt <b>Rousseau und Humboldt</b>)." } ] },
        { h4: "Vergleich", tabelle: { kopf: ["", "Comenius", "Rousseau", "Humboldt", "Herbart"], zeilen: [
          ["Zeit", "17. Jh., 1592 bis 1670, Dreißigjähriger Krieg", "18. Jh., 1712 bis 1778, Aufklärung", "19. Jh., 1767 bis 1835, preußische Reformzeit", "19. Jh., 1776 bis 1841 (Folie druckt 1767)"],
          ["Schrift", "Didactica Magna 1657", "Émile 1762", "Königsberger und Litauischer Schulplan 1809", "Formalstufen 1806/1965"],
          ["Menschenbild", "Ebenbild Gottes, ursprünglich gut, gleiche Natur", "frei, empfindsam, vernünftig; alles entartet unter den Händen des Menschen", "der Mensch stärkt seine Kräfte ohne äußeren Zweck", "innere Freiheit; Rechtlichkeit und Güte; Bildsamkeit"],
          ["Schule ist", "Werkstatt der Menschlichkeit: allen alles lehren", "verdächtig: fördert Eigennutz; Katechismusunterricht", "allgemeine, nicht spezifische Bildung; gegliederte Einheitsschule", "erziehender Unterricht; „Schule heißt Muße\""],
          ["Zahlenliste", "<b>4 Stufen à 6 Jahre</b> + <b>3 Ziele</b>", "<b>4 Phasen</b> (5/12/15/20)", "<b>4 Kräfte</b> + <b>3 Stadien</b>", "<b>4 Formalstufen</b> + <b>2 Prinzipien</b>"],
          ["Wer bestimmt?", "Gott und die Methode; Wissen wird vermittelt (Docht, Wachs)", "die Natur des Kindes; Erzieher arrangiert nur (negative Erziehung)", "der Mensch selbst; nicht der Staat, nicht Abnehmer", "der Mensch bildet sich; Lehrkraft formt nicht nach ihrem Willen"],

    { titel: "Problematischer Wirkungskreislauf", ftag: "F 35",
      svg: `<svg viewBox="0 0 720 240" role="img" aria-label="Kreislauf von Folie 35: Kompositionsmerkmale (niedriger Sozialindex, geringe Schulqualität) führen zu geringen Leistungen und einem hohen Anteil an fehlenden Schulabschlüssen, diese zu negativem Schulimage und Schwierigkeiten bei der Akquise von Lehrkräften, und das wieder zurück zu den Kompositionsmerkmalen.">

  ],
  karten: [
    { id: "perspektiven", wer: "Perspektiven auf Schulqualität · F 7 bis 11 · Fend 1998, Scheerens 2004, Fend 2000, Klieme 2016", titel: "Gute Schule: Es kommt darauf an, wen man fragt",
      kurz: "Vier Perspektiven geben vier Antworten auf die Frage nach der guten Schule. Die Folie 9 zieht das Fazit: Was eine gute Schule ausmacht, <b>variiert abhängig von der theoretischen Perspektive und der gesellschaftlichen Zielsetzung</b>.",
      bloecke: [
        { h4: "Vier Perspektiven", dl: [
          { dt: "Schuleffektivitätsforschung", ftag: "F 7", dd: "Seit den 1970er Jahren, international. Sucht Merkmale jener Schulen, die gemessen an den kognitiven und sozialen Eingangsvoraussetzungen der Schüler:innen <b>besonders hohe Leistungen</b> aufweisen: <q>Schulqualität als messbarer Effekt</q>. Gute Schulen definieren sich durch <b>gute Schülerleistungen, geringe Abbruchquoten</b>." },
          { dt: "Schulklimaforschung", ftag: "F 8", dd: "In Deutschland lange die Orientierung. Kernthema war <b>nicht Effektivität</b>, sondern die schulischen Bedingungen für Persönlichkeitsentwicklung und Bildung: <q>Normatives Verständnis von Schulqualität</q>. Gute Schulen definieren sich durch <b>soziale Integration, Reichhaltigkeit des Schullebens, Arbeitszufriedenheit des Kollegiums, pädagogische Zuwendung</b> zur Schülerschaft (Fend 1998). Normativ = sagt, wie es sein soll." },
          { dt: "Systemtheoretisch / strukturfunktionalistisch", ftag: "F 9", dd: "Schule als gesellschaftliches Subsystem, das gesellschaftliche Kohärenz und Kontinuität über soziale und generationale Grenzen hinweg ermöglicht, indem junge Menschen aus potenziell allen Schichten die Chance auf Bildung erhalten. Gute Schulen <b>erfüllen spezifische Funktionen für die Gesellschaft</b> (Brücke zu Parsons und Fend in Schultheorie I)." },
          { dt: "Bildungspolitisch", ftag: "F 9", dd: "Schulqualität als <b>Steuerungsinteresse der Bildungsadministration</b>, die dafür sorgen muss, dass schulische Prozesse effizient gestaltet werden. Gute Schulen <b>entsprechen Kriterien normativer Rahmenkonzepte</b> (so eines ist der Orientierungsrahmen Brandenburg, F 21 ff.)." } ] },
        { h4: "Five Factor Model vs. Kriterien guter Schulen", ftag: "F 10", tabelle: { kopf: ["", "Five Factor Model (Schuleffektivitätsforschung: Scheerens 2004)", "Kriterien guter Schulen (schultheoretisch-normativ: Fend 2000)"], zeilen: [
          ["1", "Effektive Schulleitung", "Effizientes Schul- und Unterrichtsmanagement"],
          ["2", "Hohe, aber angemessene Leistungserwartungen", "Hohe Leistungserwartungen an Lernende, zusammen mit schulischer Unterstützung bei Leistungsabfall"],
          ["3", "Sichere und strukturierte Schulumwelt", "Pädagogisch und didaktisch überlegt gestaltete Schulumwelt"],
          ["4", "Betonung der Notwendigkeit des Erlangens von Basiskompetenzen", "Klare Konzeption bei pädagogischen Leitideen"],
          ["5", "Konstante Erfassung der Leistungen Lernender", "Systematische Analyse des Lernfortschrittes und des Verhaltens der Lernenden"],
          ["6", "", "<b>Bestmögliche Zeitnutzung</b>"],
          ["7", "", "<b>Förderliche Beziehungen zwischen Lehrkräften, Eltern und Lernenden</b>"] ] },
          hint: "Links 5 Faktoren aus der Schuleffektivitätsforschung, rechts 7 schultheoretisch-normative Kriterien. Zeile 6 und 7 sind links leer: <b>Zeitnutzung</b> und <b>förderliche Beziehungen</b> stehen nur bei Fend." },
        { h4: "Widersprechen sich die Ansätze?", ftag: "F 11", text: "Nicht unbedingt: Hohe Schulleistungen stehen <b>in vielen, aber nicht allen Ländern</b> auch mit hohem Wohlbefinden in Zusammenhang. Ein <b>umfassendes Verständnis guter Schulen</b> ist notwendig, um qualitätsvolle Bildungsprozesse zu ermöglichen (Klieme 2016, S. 51)." },
      ],
      kritikAn: { ftag: "F 9 · 11", punkte: [
        "<b>Keine Perspektive reicht allein (F 11):</b> Klieme fordert ein umfassendes Verständnis guter Schulen. Nur messbarer Effekt oder nur Klima greift zu kurz.",
        "<b>„Gut\" ist perspektivabhängig (F 9):</b> Was eine gute Schule ausmacht, variiert mit der theoretischen Perspektive und der gesellschaftlichen Zielsetzung. Es gibt keine neutrale Definition." ] },
      kritikSelbst: null,
      kritikIdee: { punkte: [
        "<b>Aus Folie 33 ableitbar:</b> Wer Schulqualität als messbaren Effekt (F 7) versteht, misst zum Teil die Zusammensetzung der Schülerschaft mit. Leistungsergebnisse fallen je nach Komposition anders aus, ohne dass dies mit tatsächlichen Qualitätsunterschieden zusammenhängt. Die Effektivitätsforschung korrigiert das selbst mit dem Value-added-Ansatz (F 37).",
        "<b>Aus Folie 17 ableitbar:</b> Die Schulklimaforschung (F 8) baut auf einem Merkmal, das <q>keine objektive Bedingung ist, sondern subjektiv empfunden wird</q>. Klima ist schwerer zu messen und zu vergleichen als Leistung." ] },
      fallen: [
        "<b>Zählfalle:</b> Scheerens hat <b>5</b> Faktoren, Fend 2000 hat <b>7</b> Kriterien. „Bestmögliche Zeitnutzung\" und „Förderliche Beziehungen zwischen Lehrkräften, Eltern und Lernenden\" gehören zu <b>Fend</b>, nicht ins Five Factor Model (F 10).",
        "<b>Dreimal Fend:</b> Fend 1998 steht für die Schulklimaforschung (F 8), Fend 2000 für die Kriterien guter Schulen (F 10), und der Fend aus Schultheorie I (1980/2006) für die vier Funktionen der Schule. Gleicher Name, drei Bezüge." ] },

    { id: "rahmen", wer: "Bedingungsfaktoren · Rahmenmodelle · F 12 bis 20 · Ditton 2000/2007, Baumert et al. 2010", titel: "Rahmenmodelle: Was in Schulqualität hineinwirkt und was herauskommt",
      kurz: "Schulqualität ist kein einzelnes Merkmal, sondern ein Zusammenspiel: Kontext, Eingangsbedingungen und Prozesse wirken auf Ergebnisse. Die Modelle sortieren diese Faktoren nach Ebenen und nach ihrer Nähe zum Unterricht.",
      bloecke: [
        { h4: "Grundformel", ftag: "F 12", dl: [
          { dt: "Drei Variablengruppen wirken auf Ergebnisse", dd: "Schulqualität ergibt sich aus der Wirkung von <b>Kontextvariablen</b> (z. B. Lehrpläne), <b>Schuleingangsvariablen</b> (z. B. Eingangsleistung der Schüler:innen) und <b>Prozessvariablen</b> (Unterricht: Strukturiertheit, Lernzeit) auf kurz- und längerfristige <b>Bildungsergebnisse</b> (outcome, output) (Racherbäumer et al. 2012, S. 242)." },
          { dt: "Qualität als Voraussetzung", dd: "Unterschiede in der Schulqualität werden als <b>Voraussetzung für Leistungen Lernender</b> betrachtet." } ] },
        { h4: "Ditton 2000: strukturell und dynamisch", ftag: "F 13", dl: [
          { dt: "Strukturelle Dimension", dd: "Schule als <b>Mehrebenensystem</b>: Kontextbedingungen (z. B. das Schulsystem) plus spezifische Faktoren der Institution Schule, des Unterrichts, der Lehrerpersönlichkeit und der Merkmale der Lernenden." },
          { dt: "Dynamische Dimension", dd: "<b>Prozessbetrachtung</b>, ausgerichtet auf die <q>Produktionsfunktion des Schulwesens</q>: die Bedingungen und Prozesse, durch die Eingangsbedingungen (inputs) in erzielte Ergebnisse (outputs, outcomes) transformiert werden." },
          { dt: "Mehrebenencharakter", dd: "Individuen (Lernende, Lehrende) geschachtelt in Lehr-Lern-Situationen innerhalb von Schulen, die ihrerseits in den sozial-regionalen Kontext eingebettet sind. Geschachtelt = wie Matrjoschka-Puppen, eine Ebene steckt in der nächsten." } ] },
        { h4: "Baumert et al. 2010: proximal und distal", ftag: "F 14 bis 18", dl: [
          { dt: "Distale Variablen", ftag: "F 15 · 16", dd: "<q>vom Unterrichtsgeschehen entfernte Faktoren, die in keinem direkten Wirkungszusammenhang mit Schulleistungen stehen, sondern nur indirekt leistungswirksam sind</q>: räumliche Ausstattung, Schulform, externe Faktoren wie das Einzugsgebiet. Auch die <b>schulischen Bedingungen für Unterricht und Lernen</b> (Ressourcen, Lernangebote, Schulorganisation, Qualitätssicherung, Sozialkapital der Schule) sind distal. Distal = fern." },
          { dt: "Proximale Variablen", ftag: "F 15 · 17", dd: "beeinflussen das Lernen <b>direkt</b>: <b>Unterrichtsqualität</b>, <b>Lernaktivitäten</b> der Schüler:innen, <b>Schulklima</b>. Proximal = nah." },
          { dt: "Schulklima", ftag: "F 17", dd: "ein zentrales Qualitätsmerkmal, das <q>keine objektive Bedingung ist, sondern subjektiv empfunden wird</q>. Auf Folie 17: Schulzufriedenheit, Schüler-Lehrer- und Schüler-Schüler-Beziehung, physische Gewalt, Leistungs- und Disziplindruck, Kommunikation im Kollegium." },
          { dt: "Drei Ebenen", ftag: "F 14", dd: "<b>Mikroebene</b>: Lernen und Unterricht. <b>Mesoebene</b>: Bedingungen in Schule, Familie, Peergroup. <b>Makroebene</b>: Systembindung der Schule." },
          { dt: "Lernaktivitäten", ftag: "F 18", dd: "Prozessmerkmale wie innerpsychische Prozesse: Aufmerksamkeit im Unterricht, Zeitaufwand und Intensität der Hausaufgabennutzung, freiwillige Beteiligung an Fördermaßnahmen." } ] },
        { h4: "Aktuelle Rahmenmodelle: vier Faktorengruppen", ftag: "F 19", tabelle: { kopf: ["Faktor", "Was gemeint ist", "Beispiele auf der Folie"], zeilen: [
          ["1 · Kontext", "Bedingungen, unter denen Schulen arbeiten und die sie <b>selbst nicht ändern können</b>", "sozial-regionales Umfeld"],
          ["2 · Input", "Ausstattung der Schule und gesellschaftliche Zielerwartungen", "personelle, räumliche, finanzielle Ausstattung; <b>Lehrpläne</b>"],
          ["3 · Prozess", "was die Schule tut", "Unterrichtsqualität, Schulmanagement"],
          ["4 · Output", "was herauskommt", "Schülerkompetenzen"] ] },
          hint: "Schulen werden als <b>Organisationssysteme</b> konzipiert, in denen das Zusammenwirken der Faktoren den Output auf Schülerebene beeinflusst (F 19)." },
        { h4: "Ditton 2007: Modell zur Schul- und Unterrichtsqualität", ftag: "F 20", text: "Drei Spalten: <b>Voraussetzungen</b> (1. Bedingungen, 2. Intentionen), <b>primäre Merkmale und Prozesse</b> (3. Qualität der einzelnen Bildungseinrichtungen auf der Institutionsebene, 4. Qualität der Lehr- und Lernsituation auf der Interaktionsebene), <b>Ergebnisse</b> (5. Outputs, 6. Outcomes). Darunter läuft das Curriculum mit: intendiert, implementiert, erreicht. Am Fuß drei Stichworte: Standards, Verantwortung, Einschätzung. Die Folie besteht nur aus dem Bild, siehe Grafik." },
      ],
      kritikAn: { ftag: "F 17 · 18", punkte: [
        "<b>Black-box-Forschung (F 18):</b> Die Forschung zu Bedingungen von Schulleistungen bleibt überwiegend eine <q>black-box-Forschung</q>, denn individuelle Lernprozesse sollen nicht erfasst werden. Man sieht Input und Output, nicht das Lernen dazwischen.",
        "<b>Nur ein Ausschnitt (F 18):</b> Ausschließlich die fächerübergreifende Problemlösekompetenz thematisiert Lern- und Problemlösestrategien.",
        "<b>Schulklima ist subjektiv (F 17):</b> Ein zentrales Qualitätsmerkmal des Modells ist keine objektive Bedingung, sondern wird subjektiv empfunden." ] },
      kritikSelbst: null,
      kritikIdee: { punkte: [
        "<b>Aus Folie 33 und 35 ableitbar:</b> Die Modelle führen den Kontext als einen Faktor unter vieren, die Kompositionseffekte zeigen aber, wie stark er wirkt: Leistungsunterschiede entstehen, <q>ohne dass dies mit tatsächlichen Unterschieden in der Qualität der Schulen zusammenhängt</q>. Ein Output-Vergleich ohne Blick auf die Komposition misst nicht Schulqualität.",
        "<b>Aus Folie 23 ableitbar:</b> Kontextfaktoren kann die Schule selbst nicht ändern (F 19), Rahmenbedingungen zu schaffen ist Aufgabe von Politik und Verwaltung. Die Modelle sagen aber nicht, wer für welchen Faktor verantwortlich ist; Ditton 2007 deutet es nur mit den Stichworten Standards, Verantwortung, Einschätzung an." ] },
      fallen: [
        "<b>Distal oder proximal?</b> Schulform, Ausstattung, Einzugsgebiet sind <b>distal</b> (indirekt). Unterrichtsqualität, Lernaktivitäten, Schulklima sind <b>proximal</b> (direkt). Eine Option wie „Schulform ist proximal\" ist falsch (F 15 bis 17).",
        "<b>Lehrpläne:</b> Auf Folie 19 zählen sie zum <b>Input</b> (gesellschaftliche Zielerwartungen), das sozial-regionale Umfeld zum <b>Kontext</b>. Folie 12 nennt Lehrpläne allerdings als Beispiel für Kontextvariablen. Bei einer Frage nach den <b>vier Faktorengruppen</b> gilt Folie 19." ] },

    { id: "orientierung", wer: "Orientierungsrahmen „Gute Schule\" Brandenburg · F 21 bis 28", titel: "Brandenburg: drei Dimensionen, vier Qualitätsbereiche",
      kurz: "Brandenburg hat ein normatives Rahmenkonzept, also genau das, was die bildungspolitische Perspektive (F 9) meint. Es sortiert Schulqualität in Rahmenbedingungen, Prozesse und Ergebnisse und gibt Schulen Kriterien für die eigene Prüfung an die Hand.",
      bloecke: [
        { h4: "Drei Dimensionen", ftag: "F 22 · 23", dl: [
          { dt: "Rahmenbedingungen", dd: "enthalten wesentliche Aspekte, die sich auf Prozesse und Ergebnisse einer Schule auswirken, <b>auf die diese aber keinen grundsätzlichen Einfluss hat</b>. Rahmenbedingungen zu schaffen ist <b>Aufgabe von Bildungspolitik und Schulverwaltung</b>." },
          { dt: "Prozessdimension", dd: "vier <b>Qualitätsbereiche</b> (QB), siehe Tabelle unten." },
          { dt: "Dimension Ergebnisse und Wirkungen", dd: "Leistungen und Erfolge einer Schule und ihrer Schüler:innen in vier <b>Kategorien</b>: <b>Kompetenzen</b>, <b>Übergänge und Schulabschlüsse</b>, <b>Teilhabe</b>, <b>Zufriedenheit mit der Schule</b>." } ] },
        { h4: "Die vier Qualitätsbereiche und ihre Unterfacetten", ftag: "F 24", tabelle: { kopf: ["QB", "Name", "Unterfacetten"], zeilen: [
          ["1", "Führung und Verantwortung", "1.1 Pädagogische und kooperative Führung · 1.2 Unterrichtsorganisation · 1.3 Personalentwicklung · 1.4 Qualitätsmanagement"],
          ["2", "Lehren und Lernen", "2.1 Gestaltung von Lehr- und Lernprozessen · 2.2 Individualisierung und Kompetenzorientierung · 2.3 Lehren und Lernen im Transformationsprozess · 2.4 Lernen begleiten und einschätzen"],
          ["3", "Schule als Lern-, Lebens- und Arbeitsort", "3.1 Demokratische Schulkultur · 3.2 Partizipation und Mitwirkung · 3.3 Gesunde Schule"],
          ["4", "Schule als lernende Organisation", "4.1 Grundlagen der Schulentwicklung · 4.2 Datennutzung und Reflexion · 4.3 Professionalisierung"] ] },
          hint: "QB 1 und QB 2 haben je vier Unterfacetten, QB 3 und QB 4 je drei (Grafik auf F 24)." },
        { h4: "So sieht ein Kriterium aus", ftag: "F 25 bis 27", dl: [
          { dt: "1.4.1 Prozess- und Ergebnisverantwortung (QB 1)", ftag: "F 25", dd: "<q>Die Schulleitung steuert Entwicklungsprozesse in Bezug auf die Unterrichtsqualität der Schule.</q> Relevante Aspekte u. a.: gemeinsames Verständnis von lernwirksamem Unterricht; Schulprogramm und schulinternes Curriculum als Arbeitsgrundlage; Lehrkräfte analysieren leistungsbezogene Daten; Entwicklungsdaten (Bildungsgangempfehlungen, Abschlüsse, Wiederholerquoten) werden in der Konferenz ausgewertet (Orientierungsrahmen S. 19)." },
          { dt: "4.2.1 Datengestützte Unterrichtsentwicklung (QB 4)", ftag: "F 26", dd: "Die Schule nutzt regelmäßig Daten zu Prozessen und Ergebnissen für die systematische Weiterentwicklung des Unterrichts. U. a.: Lehrkräfte erfassen die Qualität des eigenen Unterrichts; Schüler:innen als Feedbackgebende; kollegiale Unterrichtsbesuche; Ergebnisse aus Vergleichsarbeiten und Lernstandserhebungen werden auf Klassen-, Jahrgangs- und Fachebene analysiert (S. 34). Rahmung auf der Folie: <q>Ich bin Lehrkraft und möchte meine Schule evaluieren</q>." },
          { dt: "4.2.2 Datengestützte Schulentwicklung (QB 4)", ftag: "F 27", dd: "Regelmäßige Auswertung im Qualitätsentwicklungszyklus, Ergebnisse werden mit allen Beteiligten reflektiert. U. a.: Daten im Zusammenhang mit den Entwicklungszielen analysieren; Anlässe und Ergebnisse transparent dokumentieren; Eltern und außerschulische Partner gezielt einbeziehen (S. 35)." } ] },
      ],
      kritikAn: null, kritikSelbst: null,
      kritikIdee: { punkte: [
        "<b>Aus Folie 23 und 33 ableitbar:</b> Der Rahmen misst die Schule an Prozessen und Ergebnissen, sagt aber selbst, dass die Rahmenbedingungen außerhalb ihres Einflusses liegen. Kompositionseffekte (F 33) zeigen, dass Ergebnisse stark von der Schülerschaft abhängen. Eine Schule in herausfordernder Lage kann bei „Ergebnisse und Wirkungen\" schlecht dastehen, ohne schlechte Arbeit zu machen.",
        "<b>Aus Folie 9 ableitbar:</b> Der Rahmen ist ein normatives Rahmenkonzept der Bildungsadministration, also Ausdruck eines Steuerungsinteresses. Was darin als gut gilt, ist eine politische Setzung, kein empirischer Befund." ] },
      fallen: [
        "<b>Drei Dimensionen, aber zweimal vier:</b> Die Prozessdimension hat vier <b>Qualitätsbereiche</b>, die Ergebnisdimension vier <b>Kategorien</b>. Nicht mischen: „Teilhabe\" ist eine Ergebniskategorie, „Lehren und Lernen\" ein Qualitätsbereich (F 23).",
        "<b>Nur der Orientierungsrahmen:</b> Die Folien 25 bis 28 zeigen Beispiele aus diesem Rahmen. Evaluationsarten oder Evaluationsbegriffe stehen nicht auf den Folien dieser Sitzung; laut Rose ist Schulevaluation nicht klausurrelevant." ] },

    { id: "komposition", wer: "Kompositionseffekte · F 29 bis 35 · Harker & Tymms 2004, Baumert et al. 2006, Dumont et al. 2013", titel: "Kompositionseffekte: Die Klasse wirkt mit, über das Kind hinaus",
      kurz: "Bedingungen von Schülerleistungen <b>jenseits der Schulqualität</b> (F 29): Wer mit wem lernt, beeinflusst die Leistungsentwicklung, zusätzlich zu dem, was das einzelne Kind mitbringt.",
      bloecke: [
        { h4: "Ausgangsbefund", ftag: "F 30", dl: [
          { dt: "Schulform erklärt am meisten", dd: "Schulformzugehörigkeit erklärt neben individuellen Schülermerkmalen den <b>weitaus größten Teil der Varianz</b> in fachlichen Leistungen. Varianz = Streuung der Ergebnisse." },
          { dt: "Aber auch innerhalb gleicher Schulform", dd: "Schulleistungen variieren stark <b>zwischen Schulen der gleichen Schulform</b>. Beides, Schulformunterschiede und Unterschiede zwischen Einzelschulen, geht zu einem Großteil auf Kompositionseffekte zurück." } ] },
        { h4: "Definition", ftag: "F 31 · 32", dl: [
          { dt: "Kompositionseffekt (Harker und Tymms 2004)", dd: "Auswirkungen <b>aggregierter Individualmerkmale</b> (z. B. durchschnittliche kognitive Leistungsfähigkeit, sozioökonomischer Status) in einer Lerngruppe (z. B. Klasse) auf die Leistungsentwicklung Lernender. Aggregiert = über die Gruppe zusammengerechnet, etwa der Klassendurchschnitt." },
          { dt: "Wörtlich", dd: "<q>…liegt vor, wenn die Zusammensetzung der Jugendlichen einer Klasse (z. B. mittleres Leistungsniveau der Klasse) über das entsprechende Individualmerkmal hinaus (z. B. individuelle Leistung der Jugendlichen) einen Einfluss auf die Leistungsentwicklung hat.</q>" } ] },
        { h4: "Was das bedeutet", ftag: "F 33 · 34", dl: [
          { dt: "Andere Lernbedingungen", dd: "Die Komposition einer Klasse oder Schule kann zu unterschiedlichen Lernbedingungen führen und so <b>zusätzlich zu den individuellen Lernvoraussetzungen</b> die Schulleistung beeinflussen." },
          { dt: "Nicht gleich Qualität", dd: "Leistungsergebnisse von Schulen können je nach Komposition stärker oder schwächer ausfallen, <b>ohne dass dies mit tatsächlichen Unterschieden in der Qualität der Schulen zusammenhängt</b>." },
          { dt: "Privilegierte Umgebung hilft", dd: "Schüler:innen, die von einer sozial privilegierteren Schülerschaft umgeben sind, zeigen höhere Leistungen als Schüler:innen mit vergleichbaren Voraussetzungen in einer Gruppe aus sozial eher schwachen Familien (Dumont et al. 2013; Gärtner 2015)." },
          { dt: "Sechs ungünstige Kompositionsmerkmale (Baumert et al. 2006)", dd: "hoher Anteil bildungsferner Familien · hohe Wiederholerzahlen · niedriges Leistungs- und Fähigkeitsniveau · Eltern ohne Berufsausbildung · familiäre Probleme · Arbeitslosigkeit und Gewalttätigkeit im Umfeld." } ] },
        { h4: "Problematischer Wirkungskreislauf", ftag: "F 35", text: "Kompositionsmerkmale wirken in statistisch bedeutsamer Weise auf Lernergebnisse: <b>niedriger Sozialindex, geringe Schulqualität</b> → <b>geringe Leistungen, hoher Anteil an fehlenden Schulabschlüssen</b> → <b>negatives Schulimage, Schwierigkeiten bei der Akquise von Lehrkräften</b> → zurück zum Anfang. Ein Kreis, der sich selbst verstärkt (siehe Grafik)." },
      ],
      kritikAn: null,
      kritikSelbst: { ftag: "F 33", punkte: [
        "<b>Am reinen Leistungsvergleich:</b> Wer Schulen nur an Ergebnissen misst, verwechselt Komposition mit Qualität. Die Leistungen einer Schule können hoch sein, ohne dass die Schule besser arbeitet (F 33)." ] },
      kritikIdee: { punkte: [
        "<b>Aus Folie 37 ableitbar:</b> Die Kompositionsforschung erklärt, warum Rohvergleiche unfair sind, sagt aber nicht, wie man fair vergleicht. Die Antwort liefert erst der Value-added-Ansatz: Leistungszuwachs im Vergleich zu Schulen mit ähnlicher Schülerschaft.",
        "<b>Aus Folie 35 und 44 bis 46 ableitbar:</b> Der Wirkungskreislauf beschreibt, wie es abwärts geht, nicht, wo man ihn unterbricht. Die fünf Qualitätsmerkmale effektiver Schulen und die Förderprogramme (F 47 ff.) sind die Versuche, den Kreis zu durchbrechen." ] },
      fallen: [
        "<b>Schlüsselwort „über das Individualmerkmal hinaus\":</b> Ein Kompositionseffekt heißt nicht „ein starkes Kind ist gut\", sondern „ein Kind in einer starken Klasse entwickelt sich besser, als es nach seinen eigenen Werten allein zu erwarten wäre\" (F 32).",
        "<b>Schulform:</b> Schulformunterschiede sind laut Folie 30 <b>selbst zu einem Großteil Kompositionseffekte</b>. „Gymnasien sind die besseren Schulen\" folgt daraus nicht." ] },

    { id: "effektiv", wer: "Effektive Schulen in herausfordernder Lage · F 36 bis 46 · Creemers et al. 1989, Sammons 2007, Holtappels 2008/2017, OECD 2012, Racherbäumer et al. 2013", titel: "Effektive Schulen: mehr Zuwachs, als die Herkunft erwarten lässt",
      kurz: "Eine Schule ist nicht dann gut, wenn ihre Ergebnisse hoch sind, sondern wenn ihre Schüler:innen mehr dazulernen als andere mit gleicher Ausgangslage. Das ist der Value-added-Gedanke, und er macht Schulen in schwieriger Lage überhaupt erst vergleichbar.",
      bloecke: [
        { h4: "Begriffe", dl: [
          { dt: "Effektive Schule", ftag: "F 37", dd: "Eine Schule gilt als effektiv, <q>wenn sich die Leistungen der Schülerinnen und Schüler in stärkerem Maß verbessern als aufgrund ihres familiären Hintergrunds zu erwarten gewesen wäre</q> (Creemers, Peters & Reynolds 1989). Die Definition stellt den <b>Leistungszuwachs</b> in den Vordergrund und betont den <b>Mehrwert</b>, den die Schule unabhängig von den Ausgangsbedingungen beiträgt." },
          { dt: "Value-added-Ansatz", ftag: "F 37", dd: "<q>An effective school thus adds extra value to its students' outcomes, in comparison with other schools serving similar intakes</q> (Sammons 2007, S. 13). Berücksichtigt, dass Schüler:innen unterschiedliche Fähigkeitsniveaus und Herkunft haben und dass das ihre Leistungsentwicklung beeinflusst. Intake = die Schülerschaft, die eine Schule aufnimmt." },
          { dt: "Schule in herausfordernder Lage", ftag: "F 38", dd: "<q>Schulen, die mit einer anspruchsvollen Problemkonstellation konfrontiert werden, welche ihnen hohe Anstrengungen abverlangt</q> (Holtappels et al. 2017, S. 18). Höhere Anforderungen in allen Bereichen der Schulqualität, die die einzelne Institution abfangen muss." },
          { dt: "Erwartet schlecht oder unerwartet gut", ftag: "F 38", dd: "Holtappels (2008) unterscheidet Schulen mit <b>erwartet schlechter</b> und mit <b>unerwartet guter Outputqualität</b>: sie gehen unterschiedlich gut mit der herausfordernden Lage um." } ] },
        { h4: "OECD 2012: drei Schultypen", ftag: "F 39 bis 43", tabelle: { kopf: ["Typ", "Bedeutung laut Folie", "Merkmale"], zeilen: [
          ["Advantaged schools", "<b>effektive</b> Schule in herausfordernder Lage", "investieren mehr Zeit und Anstrengung in professionelle Entwicklung, besonders unterrichtsbezogene Fortbildung mit starkem Praxisbezug (F 46)"],
          ["Mixed schools", "dazwischen", "disadvantaged students über- oder unterrepräsentiert, also niedrige sozioökonomische Segregation; Schulklima von Durchmischung geprägt; disadvantaged students zeigen hier <b>bessere Leistungen als an disadvantaged schools</b>; <b>keine externe Unterstützung nötig, selbststeuerungsfähig</b> (F 42)"],
          ["Disadvantaged schools", "<b>ineffektive</b> Schule in herausfordernder Lage", "disadvantaged students überrepräsentiert (hohe soziale Exklusion); geringe Beschäftigungsquote, mehr Gesundheitsprobleme und Gewalttaten; mehr Angst und Wut; Leistungsniveau wird nicht erreicht, große Lernrückstände; ineffizienter Umgang mit Bedürfnissen der Schülerschaft und Schulbudget; <b>Notwendigkeit externer Unterstützung</b> (F 41)"] ] },
          hint: "Die OECD hat <b>keine genauen Definitionen</b> für die drei Typen, nur allgemeine Kriterien (F 40). Die Grafik auf F 40 zeigt je Land, wie sich benachteiligte Schüler:innen auf die drei Typen verteilen; Deutschland ist rot markiert." },
        { h4: "Fünf Qualitätsmerkmale effektiver Schulen in herausfordernder Lage", ftag: "F 44 bis 46 · Racherbäumer et al. 2013", dl: [
          { dt: "1 · Schulleitungshandeln", ftag: "F 44", dd: "kooperativer Führungsstil; hohes Maß an Transparenz und demokratische Entscheidungsprozesse; Entwicklung einer positiven Schulkultur, verbunden mit hoher Sichtbarkeit und rechtzeitigem Eingreifen in entstehenden Problemsituationen." },
          { dt: "2 · Datengenerierung und Datennutzung", ftag: "F 45", dd: "regelmäßige Erfassung von Schülerleistungsmerkmalen und Merkmalen der Unterrichtsqualität; Nutzung der Daten zur <b>internen Evaluation</b> schulischer Prozesse." },
          { dt: "3 · Schulkultur", ftag: "F 45", dd: "transparente und hohe Leistungserwartung; freundliches, wertschätzendes und vertrauensvolles Schul- und Lernklima; Zusammenarbeit der Lehrkräfte für eine positive Schul- und Unterrichtskultur." },
          { dt: "4 · Qualität der Lehr-Lernprozesse", ftag: "F 46", dd: "Aufmerksamkeit liegt auf Unterricht und Instruktion; strukturierte Lernprozesse, unmittelbares Feedback bei lernschwachen Schüler:innen; kurzfristige Lernziele, Förderung kognitiver Aktivität." },
          { dt: "5 · Nutzung externer Unterstützungsstrukturen", ftag: "F 46", dd: "Intensität und Vielfalt von Außenkontakten für inhaltlich erweiterte Lernmöglichkeiten; Einbindung der Eltern; Einbindung in Schulnetzwerke, in denen Konzepte für die Praxis ausgetauscht werden." } ] },
      ],
      kritikAn: { ftag: "F 40", punkte: [
        "<b>Unscharfe Typen:</b> Die OECD hat keine genauen Definitionen für advantaged, mixed und disadvantaged schools, es werden nur allgemeine Kriterien erfasst. Die Zuordnung einer konkreten Schule ist deshalb nicht eindeutig." ] },
      kritikSelbst: { ftag: "F 37", punkte: [
        "<b>An der Rohleistung als Maßstab:</b> Nicht die absolute Leistung zählt, sondern der Zuwachs gegenüber dem, was der familiäre Hintergrund erwarten lässt; der Mehrwert wird <q>unabhängig von den Ausgangsbedingungen</q> betont." ] },
      kritikIdee: { punkte: [
        "<b>Aus Folie 33 und 34 ableitbar:</b> Value added vergleicht mit Schulen mit <q>similar intakes</q>. Wie ähnlich die Schülerschaft wirklich ist, entscheidet über das Ergebnis, und die Kompositionsmerkmale von Folie 34 sind zahlreich und schwer vollständig zu kontrollieren.",
        "<b>Aus Folie 10 ableitbar:</b> Die fünf Qualitätsmerkmale (F 44 bis 46) überschneiden sich stark mit dem Five Factor Model (Schulleitung, Leistungserwartung, Leistungserfassung). Speziell für herausfordernde Lagen ist vor allem Merkmal 5, die externe Unterstützung." ] },
      fallen: [
        "<b>„Advantaged\" heißt nicht „privilegiert\":</b> Advantaged schools sind <b>effektive Schulen in herausfordernder Lage</b>, keine Schulen in reichen Vierteln (F 39, 43).",
        "<b>Wer braucht Hilfe von außen?</b> <b>Disadvantaged</b> schools brauchen externe Unterstützung (F 41). <b>Mixed</b> schools sind selbststeuerungsfähig und brauchen keine (F 42). Beliebter Tausch in den Optionen." ] },

    { id: "foerder", wer: "Förderprogramme · Randwissen · F 47 bis 59", titel: "Förderprogramme: fünf Namen, je ein Satz", color: "var(--um)",
      kurz: "Die Folien zeigen zwei Gruppen: Programme <b>für disadvantaged schools</b> (Trennfolie F 47) und Programme <b>für den Umgang mit Verhaltensstörungen</b> (Trennfolie F 56). Laut Referenz Randwissen mit geringem Klausurpotenzial, darum hier nur das Nötigste.",
      bloecke: [
        { h4: "Für disadvantaged schools", ftag: "F 48 bis 55", dl: [
          { dt: "School Turnaround (Berlin)", ftag: "F 48 bis 51", dd: "Pilotprojekt <q>School Turnaround – Berliner Schulen starten durch</q> (Robert-Bosch-Stiftung). Schulen wurden <b>nicht anhand des Durchschnitts, sondern anhand einer erkennbaren negativen Entwicklungstendenz</b> ausgewählt (Krankenstand, Versetzungswünsche, Unterrichtsausfall, Fehlzeiten). <b>Zehn Schulen, vier Jahre</b>, vier Handlungsfelder: Schulmanagement, Unterrichtsqualität, Schulkultur, Leistungsdaten. <b>Externe Prozessbegleiter</b> beraten, nehmen die Strukturen auf, konfrontieren das Selbstbild, schärfen Entwicklungsziele. Beispielschulen: Albrecht-von-Graefe-Schule (Kreuzberg), Bücherwurm-Schule am Weiher (Hellersdorf)." },
          { dt: "BISS-Sprachbildung", ftag: "F 52 · 53", dd: "<b>B</b>ildung durch <b>S</b>prache und <b>S</b>chrift, Bund-Länder-Initiative zur Sprachförderung, Sprachdiagnostik und Leseförderung. <b>Fünfjähriges</b> Programm; Fokus auf der <b>Bildungssprache Deutsch</b> in alltags- bzw. unterrichtsintegrierter Förderung (Leseförderung, sprachsensibler Fachunterricht, Deutsch als Zweitsprache); läuft über <b>drei Bildungsetappen</b> (Elementar-, Primar-, Sekundarbereich). Angebote: Blended-Learning-Fortbildungen, Tool-Datenbanken, Handreichungen, Jahrestagungen, Fachgruppen." },
          { dt: "Startchancen-Programm", ftag: "F 54 · 55", dd: "Programm des Bundesbildungsministeriums für Schulen mit hohem Anteil sozial benachteiligter Schüler:innen. <b>Größtes und langfristigstes Bildungsprogramm in der Geschichte der Bundesrepublik</b>: rund <b>4000 Schulen</b>, Start Schuljahr <b>2024/25</b>, Laufzeit <b>zehn Jahre</b>. Fokus: Grundkompetenzen Lesen, Schreiben, Rechnen; Strukturen in Unterricht und Kollegium werden professionalisiert. Drei Säulen (Grafik F 55): Investitionen in die Lernumgebung, Chancenbudgets für Schul- und Unterrichtsentwicklung, Personal für multiprofessionelle Teams; wissenschaftlich begleitet und evaluiert." } ] },
        { h4: "Für den Umgang mit Verhaltensstörungen", ftag: "F 57 bis 59", dl: [
          { dt: "Berlin-Brandenburger Anti-Mobbing-Fibel", ftag: "F 57 · 58", dd: "Broschüre <q>Was tun wenn?</q>. Warnt vor dem <b>Mythos von der Selbsthilfe</b>: gutes Bewältigungsvermögen ist bei großen Belastungen unerlässlich, aber die beste Ausstattung reicht manchmal nicht. Enthält den <b>SMOB-Fragebogen</b>, der mit <b>93 Fragen</b> das Bild vom Mobbing innerhalb der Klasse erfasst." },
          { dt: "buddY-Programm", ftag: "F 59", dd: "<q>Aufeinander achten. Füreinander da sein. Miteinander Lernen.</q> Soziale Kompetenzen (Perspektivwechsel, Reflexionsfähigkeit, Kooperations- und Konfliktfähigkeit) durch Verantwortungsübernahme und erlebte Akzeptanz; betreut von buddY-Trainern, Lehrkräften, Schulsozialarbeit; in Berlin, Hessen, Niedersachsen, NRW, Thüringen. Beispielmethode <b>Mind Sync</b>: Karten ohne Absprache in aufsteigender Reihe sortieren, die Gruppe muss sich innerlich synchronisieren." } ] },
      ],
      kritikAn: null, kritikSelbst: null,
      kritikIdee: { punkte: [
        "<b>Aus Folie 37 ableitbar:</b> Ob ein Programm wirkt, müsste man am Leistungszuwachs gegenüber vergleichbaren Schulen messen (Value added). Die Ergebnisfolien zu School Turnaround (F 50, 51) zeigen Ziele, Maßnahmen und Entwicklungen, aber keine solchen Vergleichswerte." ] },
      fallen: [
        "<b>Zahlenfalle:</b> Startchancen: ~4000 Schulen, 10 Jahre, ab 2024/25. School Turnaround: 10 Schulen, 4 Jahre. SMOB: 93 Fragen. BISS: 5 Jahre, 3 Bildungsetappen." ] },

        { h4: "Roter Faden", text: "Folie 7 sagt: Qualität ist messbarer Effekt. Folie 33 sagt: Der Effekt hängt an der Schülerschaft. Folie 37 löst das auf: Effektiv ist, wer <b>mehr Zuwachs</b> schafft, als die Herkunft erwarten lässt. Folie 60 fasst zusammen: Schulen sind in Systemstrukturen eingebettet, innen und außen hängen zusammen." },
      ],
      kritikAn: null, kritikSelbst: null, kritikIdee: null,
      fallen: [

      caption: "<b>Je höher die Stufe, desto weiter weg von der Klasse die Entscheidung.</b> Folie 41 zeigt die sechs Maßnahmen als Liste; die Treppe ist hier nachgezeichnet, die Reihenfolge ist die der Folie. Stufen 1 bis 3 entscheidet die Schule selbst, ab Stufe 4 das staatliche Schulamt, Stufe 6 nur mit dem Ministerium und nur nach Ablauf der Schulpflicht. Klassiker-Falle: Der Ausschluss „bis zu zwei Wochen“ ist Sache der <b>Klassenkonferenz</b>, nicht der Klassenlehrerin und nicht des Schulamts." },
    { titel: "Mitwirkung § 74: wer, wie, wo", ftag: "F 76 · 77 · 82 · 84",
      svg: `<svg viewBox="0 0 740 320" role="img" aria-label="Mitwirkung nach § 74 BbgSchulG: Eltern, Schülerinnen und Schüler sowie Lehrkräfte wirken mit (Möglichkeiten nutzen, sich einbringen, etwas bewegen, konstruktiv zusammenarbeiten), und zwar in Gremien, im Schulleben und im Unterricht. Dazu die Gremien § 81 Elternversammlung und § 83 Klassensprecher.">

      caption: "<b>Drei Gruppen, drei Orte.</b> Folie 76 zeigt Eltern, Schüler und Lehrkräfte links, das Ziel „Mitwirkung“ in der Mitte und die Orte rechts: Gremien, Schulleben, Unterricht. Die Zahlen aus § 81 und § 83 sind die Kipper: <b>ein Fünftel</b> der Eltern kann eine Versammlung verlangen, <b>zwei</b> Elternvertreter laden <b>dreimal</b> im Jahr ein; Klassensprecher ab <b>Jahrgang 4</b>, <b>zwei</b> pro Klasse, <b>zwei Stunden je Schulmonat</b> frei (F 82, F 84)." },
