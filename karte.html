  const n = { id: "n-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ziel, text: "", x, y, deleted: false, updated: Date.now() };
  NOTIZEN.push(n); notizenLokal(); notizSenden(n); notizenZeichnen(n.id); return n;
}
// Zeichnet die Notizen, die zur aktuellen Hauptkarte gehoeren, als HTML-Schicht ueber das SVG
function notizenZeichnen(fokusId) {
  const el = document.getElementById("map-haupt"); const svg = el && el.querySelector("svg");
  const alt = el && el.querySelector(".notiz-schicht"); if (alt) alt.remove();

  const sichtbar = NOTIZEN.filter((n) => !n.deleted && (n.ziel === "frei:" + basis || svg.querySelector(`[data-ziel="${CSS.escape(n.ziel)}"]`)));
  for (const n of sichtbar) {

    else { anker = svg.querySelector(`[data-ziel="${CSS.escape(n.ziel)}"]`); px = (+anker.dataset.x + +anker.dataset.w + n.x) * k; py = (+anker.dataset.y + n.y) * k; }
    const d = document.createElement("div"); d.className = "notiz"; d.dataset.id = n.id; d.style.left = px + "px"; d.style.top = py + "px";
    d.innerHTML = `${anker ? '<span class="faden" title="haengt an ' + esc(anker.dataset.name || n.ziel) + '"></span>' : ""}<div class="griff"><span>${anker ? esc(anker.dataset.name || "").slice(0, 22) : "frei"}</span><button type="button" title="Löschen">×</button></div><div class="txt" contenteditable="true">${esc(n.text)}</div>`;

    // Ziehen am Griff, Position in SVG-Einheiten speichern

    g.addEventListener("pointermove", (e) => { if (!start) return; d.style.left = start.l + e.clientX - start.x + "px"; d.style.top = start.t + e.clientY - start.y + "px"; });

// Die Hauptkarte ueber dem Inhalt: bleibt ueber alle Stufen stehen, wechselt weich zwischen

let mapZu = lesen("mapZu", {}); if (!mapZu || typeof mapZu !== "object") mapZu = {};   // alter Wert (true/false) aus einer frueheren Fassung   // je Ebene: { karte: bool, sonst: bool }; Vorgabe: auf einer Karte eingeklappt
function zeigeHauptkarte(key, titel, baue) {
  const sec = document.getElementById("karte-bereich"), el = document.getElementById("map-haupt"), tg = document.getElementById("map-toggle");
  const cs = document.getElementById("chips-schalter"), cb = document.getElementById("chips");
  if (!key) { sec.hidden = true; tg.hidden = true; MAP_KEY = null; return; }
  tg.hidden = false;
  const ebene = key.startsWith("karte:") ? "karte" : "sonst";
  const zu = mapZu[ebene] == null ? ebene === "karte" : mapZu[ebene];
  sec.hidden = zu; tg.textContent = zu ? "Karte einblenden" : "Karte ausblenden";
  tg.onclick = () => { mapZu[ebene] = !zu; speichern("mapZu", mapZu); MAP_KEY = null; zeigeHauptkarte(key, titel, baue); };
  if (zu) return;
  document.getElementById("map-titel").textContent = titel;
  cs.hidden = false; cb.checked = zeigeChips;
  cb.onchange = () => { zeigeChips = cb.checked; MAP_KEY = null; zeigeHauptkarte(key, titel, baue); };

  document.getElementById("zoom-fit").onclick = () => zoomen(null);

  const tid = key === "gesamt" ? "gesamt" : key.split(":")[1];
  if (!erledigt("quiz:" + tid)) {
    if (MAP_KEY === "verdeckt:" + tid) return; MAP_KEY = "verdeckt:" + tid;
    document.getElementById("map-titel").textContent = titel + " · verdeckt, bis du die Äste eingetragen hast"; cs.hidden = true; document.getElementById("map-reset").hidden = true;
    el.classList.remove("passt"); el.innerHTML = ""; renderPath("quiz/" + tid, el, { eingebettet: true });
    return;
  }
  const rs = document.getElementById("map-reset"); rs.hidden = false; rs.onclick = () => { if (!confirm("Karte wieder verdecken und die Äste neu abfragen? Zählt als neue Sitzung.")) return; delete ERLEDIGT["quiz:" + tid]; speichern("erledigt", ERLEDIGT); ereignis("reset", tid, 0, 0, null); MAP_KEY = null; zeigeHauptkarte(key, titel, baue); };

  if (alt && alt.split(":")[0] !== key.split(":")[0] || (alt && alt.startsWith("gesamt") !== key.startsWith("gesamt"))) {
    el.classList.add("wechsel"); setTimeout(() => { zeichne(); el.classList.remove("wechsel"); }, 180);
  } else zeichne();
}

// Rendert einen Pfad ("thema/st1", "karte/st1/parsons", "gesamt") in ein Element.

    view.innerHTML = spalte(viewThema(t, ast && ast.id, emb));

    else setzeMap(view.querySelector("#map-thema"), themaMap(ast && ast.id)());
  } else if (p[0] === "karte" && t) {
    const k = t.karten.find((x) => x.id === p[2]) || t.karten[0];
    const ast = t.aeste.find((a) => a.karte === k.id);
    view.innerHTML = spalte(viewKarte(t, k));
    if (!emb) { pfad([["Gesamtkarte", "#gesamt"], [t.label, `#thema/${t.id}`], [k.titel.split(":")[0], `#karte/${t.id}/${k.id}`]], `#thema/${t.id}`); zeigeHauptkarte("karte:" + t.id + ":" + k.id, "Themenkarte · " + t.label + " · " + k.titel.split(":")[0], themaMap(ast && ast.id)); }
  } else if (p[0] === "alle" && t) {
    view.innerHTML = spalte(viewAlle(t));
    if (!emb) { pfad([["Gesamtkarte", "#gesamt"], [t.label, `#thema/${t.id}`], ["Alle Karten", `#alle/${t.id}`]], `#thema/${t.id}`); zeigeHauptkarte("thema:" + t.id + ":", "Themenkarte · " + t.label, themaMap(null)); }
  } else if (p[0] === "bquiz") {

    if (!emb) { zeigeHauptkarte(null); pfad([["Gesamtkarte", "#gesamt"], ["Begriffe", "#bquiz/" + (p[1] || "gesamt")]], "#gesamt"); }
  } else if (p[0] === "gquiz" && t) {
    const idx = p[2] != null && p[2] !== "" ? +p[2] : null;
    view.innerHTML = spalte(viewGquiz(t, idx));
    if (!emb) { zeigeHauptkarte(null); pfad([["Gesamtkarte", "#gesamt"], [t.label, `#thema/${t.id}`], ["Grafik-Quiz", `#gquiz/${t.id}`]], `#thema/${t.id}`); }
    starteGquiz(t, idx);
  } else if (p[0] === "quiz" && (p[1] === "gesamt" || t)) {
    view.innerHTML = spalte(viewQuiz(p[1]));
    if (!emb) zeigeHauptkarte(null);
    if (!emb) pfad([["Gesamtkarte", "#gesamt"], ...(t ? [[t.label, `#thema/${t.id}`]] : []), ["Quiz", `#quiz/${p[1]}`]], t ? `#thema/${t.id}` : "#gesamt");
    starteQuiz(p[1]);
  } else if (p[0] === "hoeren") {
    const info = trackInfo(p[1]) || trackListe()[0];
    view.innerHTML = viewHoeren(info);
    if (!emb) zeigeHauptkarte(null);
    if (!emb) pfad([["Gesamtkarte", "#gesamt"], ...(info.thema ? [[info.thema.label, `#thema/${info.thema.id}`]] : []), ["Hören: " + info.titel, `#hoeren/${info.id}`]], info.thema ? (info.karte ? `#karte/${info.thema.id}/${info.karte.id}` : `#thema/${info.thema.id}`) : "#gesamt");
    starteHoeren(info);
  } else {
    view.innerHTML = spalte(viewGesamt(emb));
    const spec = () => { const s = gesamtSpec(); if (opts.ohneKinder) for (const b of [...s.left, ...s.right]) if (b.id === opts.ohneKinder) { b.kinder = []; b.stub = true; } return s; };
    const baue = () => mindmap(spec(), { aria: "Gesamtkarte aller Oberthemen", chipMax: 320, chips: zeigeChips && !emb, notizen: !emb && NOTIZEN_AN });

    else setzeMap(view.querySelector("#map-gesamt"), baue());
  }
}
